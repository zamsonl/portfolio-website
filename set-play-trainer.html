    }}));
    add(el('button', { class:'btn sm', text:'▶ Preview', onclick:()=>animatePlay(d.play, {}) }));
    setStageNote('Drag the five. Each beat is a keyframe.');
    return;
  }
  setStageNote('');
}

/* One button, because forcing the error is how you practise seeing it. */
function defenceButton(){
  if (App.settings.defence === 'off') return null;
  return App.defMistakeOpt
    ? el('button', { class:'btn sm', text:'Reset coverage',
        onclick:()=>{ App.defMistakeOpt = null; renderAll(); } })
    : el('button', { class:'btn sm', text:'Force a mistake',
        onclick:()=>{ triggerMistake(true);
          if (!App.defMistakeOpt) toast('No coverage error is available on this beat.');
          renderAll(); } });
}
/* The window a blown coverage opens, named in the same vocabulary as the calls. */
function defenceNote(){
  if (App.settings.defence === 'off' || !App.defMistakeOpt) return null;
  const ctx = defenceContext();
  if (!ctx) return null;
  const m = applyMistake(App.defMistakeOpt, displaySpots() || ctx.beat.spots, ctx.ballSlot, App.court);
  const verdict = m.space >= 6 ? 'That is a shot.'
                : m.space >= 4 ? 'That is a catch, not a shot.'
                               : 'Not enough — keep it moving.';
  const c = el('div', { class:'card' });
  c.appendChild(el('h3', { html:'Coverage broken <span class="tag">' + esc(MISTAKE_LABEL[m.type]) + '</span>' }));
  c.appendChild(el('div', { class:'coach', html: esc(m.text) + '<br><b>' + esc(verdict) + '</b>' }));
  return c;
}
function actionTagger(){
  const wrap = el('div', { class:'act' });
  const acts = App.attempt.actions, a0 = acts[0] || { type:'none' };
  const typeSel = el('select', { style:'flex:0 0 auto;min-width:148px', onchange:e=>{
    const t = e.target.value;
    App.attempt.actions = (t === 'none') ? [] : [{ type:t, by:(acts[0]&&acts[0].by)||1,
      for: ACTION_NEEDS_FOR.has(t) ? ((acts[0]&&acts[0].for)||2) : undefined }];
    renderBar();
  }});
  for (const t of ACTION_TYPES) typeSel.appendChild(el('option', { value:t.id, text:t.label, selected:a0.type===t.id }));
  wrap.appendChild(typeSel);
  if (a0.type !== 'none'){
    const by = el('select', { class:'who', onchange:e=>{ App.attempt.actions[0].by = +e.target.value; } });
    for (const s of SLOTS) by.appendChild(el('option', { value:s, text:'by '+s, selected:a0.by===s }));
    wrap.appendChild(by);
    if (ACTION_NEEDS_FOR.has(a0.type)){
      const fr = el('select', { class:'who', onchange:e=>{ App.attempt.actions[0].for = +e.target.value; } });
      for (const s of SLOTS) fr.appendChild(el('option', { value:s, text:'for '+s, selected:a0.for===s }));
      wrap.appendChild(fr);
    }
  }
  return wrap;
}

      'Tolerance depends on role — a screener has about <b>2.5 ft</b> of slack, a spot-up shooter about <b>4.5 ft</b>. ' +
      'Keep team-mates who are not screening each other at least <b>12 ft</b> apart.' }));
    c.appendChild(sc);

/* Spacing is checked continuously while you place, not only when you commit —
   the rule is easier to internalise if it answers back on every drag. */
function liveCheck(){
  const wrap = el('div', { class:'livechk' });
  const beat = App.play.beats[App.beatIndex];
  const spots = App.attempt.spots;
  const sp = spacingReport(spots, beat, App.court);
  const tight = sp.violations.filter(v => v.kind === 'tight');
  const paint = sp.violations.find(v => v.kind === 'paint');
  const inPaint = SLOTS.filter(x => Math.abs(spots[x][0]) <= App.court.paintHalf && spots[x][1] <= App.court.ftY);

  if (!tight.length){
    wrap.appendChild(el('div', { class:'lrow' }, [ el('span', { html:'Spacing legal — closest non-screen pair is <b>' +
      closestPair(spots, beat).toFixed(1) + ' ft</b>' }) ]));
  } else {
    for (const v of tight.slice(0,3)) wrap.appendChild(el('div', { class:'lrow warn' },
      [ el('span', { html:`<b>${v.a}</b> and <b>${v.b}</b> only <b>${v.d.toFixed(1)} ft</b> apart` }) ]));
  }
  wrap.appendChild(el('div', { class:'lrow' + (paint ? ' warn':'') },
    [ el('span', { html:`<b>${inPaint.length}</b> in the paint` + (paint ? ' — two is the limit' : '') }) ]));
  return wrap;
}
function closestPair(spots, beat){
  const ex = exemptPairs(beat);
  let best = Infinity;
  for (let i = 0; i < SLOTS.length; i++)
    for (let j = i+1; j < SLOTS.length; j++){
      const a = SLOTS[i], b = SLOTS[j];
      if (ex.has(a+'-'+b)) continue;
      best = Math.min(best, dist(spots[a], spots[b]));
    }
  return isFinite(best) ? best : 0;
}
function slotLegend(){
  const legend = el('div', { class:'notes', style:'margin-top:10px' });
  for (const s of SLOTS){
    const w = el('span', { class:'who', text:String(s) });
    const sc0 = slotColors()[s];
    w.style.background = sc0; w.style.color = readableInk(sc0); w.style.borderColor = 'transparent';
    legend.appendChild(el('div', { class:'note' }, [ w, el('span', { text:SLOT_NAME[s] }) ]));
  }
  return legend;
}

/* ---------------------------------------------------------- the call sheet */
function callSheet(){
  const g = App.general, d = g.draft;
  const c = el('div', { class:'card grow' });
  c.appendChild(el('h3', { html:'Call sheet <span class="tag">you are the 1</span>' }));
  const sc = el('div', { class:'scroll' });

  sc.appendChild(el('div', { class:'coach', html:
    'Drag <b>yourself</b> on the court. Everyone else moves only when you call them. ' +
    'Anyone you never call <b>stays where they are</b>.' }));

  // issued calls
  const list = el('div', { class:'calls' });
  if (!g.calls.length){
    list.appendChild(el('div', { class:'hint', style:'padding-block:6px', text:'No calls yet.' }));
  } else {
    g.calls.forEach((cl, i) => list.appendChild(el('div', { class:'call' }, [
      el('span', { class:'tx', text:callText(cl) }),
      el('button', { class:'x', text:'×', title:'Remove call',
        onclick:()=>{ g.calls.splice(i,1); renderRail(); } })
    ])));
  }
  sc.appendChild(list);

  /* The roster makes the mode's central rule visible: a team-mate you never
     named simply does not move. */
  sc.appendChild(el('div', { class:'hint', style:'margin-top:13px', text:'This beat' }));
  const named = new Set();
  for (const cl of g.calls){
    if (cl.v === 'send' || cl.v === 'ballscreen') named.add(cl.who);
    else if (cl.v === 'offball'){ named.add(cl.who); named.add(cl.for); }
    else if (cl.v === 'clear'){
      const sgn = sideSign(cl.side);
      for (const n of SLOTS) if (n !== 1 && Math.sign(g.spots[n][0]) === sgn && Math.abs(g.spots[n][0]) >= 4) named.add(n);
    }
  }
  const roster = el('div', { class:'roster' });
  for (const n of [2,3,4,5]){
    const on = named.has(n);
    const pill = el('span', { class:'pill', text:String(n) });
    pill.style.background = slotColors()[n];
    pill.style.color = readableInk(slotColors()[n]);
    roster.appendChild(el('div', { class:'rrow ' + (on ? 'moved':'still') }, [
      pill, el('span', { text:SLOT_NAME[n] }),
      el('span', { class:'st', text: on ? 'called' : 'stays put' })
    ]));
  }
  sc.appendChild(roster);

  // composer
  const verbSel = el('select', { onchange:e=>{ d.v = e.target.value; renderRail(); } });
  [['send','Send a team-mate to a spot'],['ballscreen','Call a ball screen for me'],
   ['offball','Call an off-ball screen'],['clear','Clear a side']]
    .forEach(([v,l]) => verbSel.appendChild(el('option', { value:v, text:l, selected:d.v===v })));
  sc.appendChild(field('Call', verbSel));

  const row = el('div', { class:'act' });
  const whoSel = (val, on, only) => {
    const s = el('select', { class:'who', onchange:e=>{ on(+e.target.value); renderRail(); } });
    for (const n of (only || [2,3,4,5])) s.appendChild(el('option', { value:n, text:String(n), selected:val===n }));
    return s;
  };
  const sideSel = (val, on) => {
    const s = el('select', { onchange:e=>{ on(e.target.value); renderRail(); } });
    for (const v of ['left','right']) s.appendChild(el('option', { value:v, text:v, selected:val===v }));
    return s;
  };

  if (d.v === 'send'){
    row.appendChild(whoSel(d.who, v=>d.who=v));
    const whereSel = el('select', { onchange:e=>{ d.where = e.target.value; renderRail(); } });
    for (const k of SPOT_KEYS) whereSel.appendChild(el('option', { value:k, text:k, selected:d.where===k }));
    row.appendChild(whereSel);
    if (SIDED.has(d.where)) row.appendChild(sideSel(d.side, v=>d.side=v));
  } else if (d.v === 'ballscreen'){
    row.appendChild(whoSel(d.who, v=>d.who=v));
    row.appendChild(el('span', { class:'hint', text:'screens on my' }));
    row.appendChild(sideSel(d.side, v=>d.side=v));
  } else if (d.v === 'offball'){
    row.appendChild(whoSel(d.who, v=>d.who=v));
    const tSel = el('select', { onchange:e=>{ d.type = e.target.value; renderRail(); } });
    for (const t of ACTION_TYPES) if (ACTION_NEEDS_FOR.has(t.id) && t.id !== 'pass')
      tSel.appendChild(el('option', { value:t.id, text:t.label, selected:d.type===t.id }));
    row.appendChild(tSel);
    row.appendChild(el('span', { class:'hint', text:'for' }));
    row.appendChild(whoSel(d.for, v=>d.for=v, SLOTS));
  } else {
    row.appendChild(sideSel(d.side, v=>d.side=v));
    row.appendChild(el('span', { class:'hint', text:'side' }));
  }
  sc.appendChild(row);

  sc.appendChild(el('button', { class:'btn sm wide', style:'margin-top:8px', text:'+ Add this call', onclick:()=>{
    if (g.calls.length >= 6) return toast('Six calls is plenty for one beat.');
    const c2 = { v:d.v };
    if (d.v === 'send'){ c2.who = d.who; c2.where = d.where; c2.side = d.side; }
    else if (d.v === 'ballscreen'){ c2.who = d.who; c2.side = d.side; }
    else if (d.v === 'offball'){ c2.who = d.who; c2.type = d.type; c2.for = d.for; }
    else c2.side = d.side;
    g.calls.push(c2); renderRail();
  }}));

  // one-tap presets for the calls people actually make
  sc.appendChild(el('div', { class:'hint', style:'margin-top:12px', text:'Quick calls' }));
  const pc = el('div', { class:'pcalls' });
  const preset = (label, mk) => pc.appendChild(el('button', { class:'btn sm', text:label,
    onclick:()=>{ if (g.calls.length < 6){ g.calls.push(mk()); renderRail(); } } }));
  preset('2 → weak corner', ()=>({ v:'send', who:2, where:'corner', side:'left' }));
  preset('3 → weak corner', ()=>({ v:'send', who:3, where:'corner', side:'left' }));
  preset('Clear left',      ()=>({ v:'clear', side:'left' }));
  preset('Clear right',     ()=>({ v:'clear', side:'right' }));
  preset('5 screen right',  ()=>({ v:'ballscreen', who:5, side:'right' }));
  preset('5 screen left',   ()=>({ v:'ballscreen', who:5, side:'left' }));
  preset('4 screen right',  ()=>({ v:'ballscreen', who:4, side:'right' }));
  preset('4 screen left',   ()=>({ v:'ballscreen', who:4, side:'left' }));
  sc.appendChild(pc);

  sc.appendChild(el('div', { class:'hint', style:'margin-top:12px', html:
    'Two-man game: send the other three away, then call a ball screen. ' +
    'The empty side is the whole point — no help defender can reach you.' }));

  c.appendChild(sc);
  return c;
}

function meters(rows){

/* The Floor General call vocabulary, drawn from SPOT_MAP itself so the diagram
   and the dropdown can never disagree. */
const SPOT_ABBR = { 'corner':'C', 'wing':'W', 'slot':'S', 'top':'T', 'trail':'TR',
                    'elbow':'E', 'block':'B', 'short corner':'SC', 'dunker':'D',
                    'nail':'N', 'rim':'R' };
function renderSpotMap(){
  const host = $('#spotmap');
  if (!host) return;
  host.textContent = '';
  const c = App.court, hw = c.width/2, pad = 2;
  const m = svg('svg', { viewBox:`${-hw-pad} ${-pad} ${c.width+pad*2} ${c.len*.62+pad*2}`,
    style:'width:100%;height:auto;display:block;border-radius:7px;overflow:hidden' });
  const sq = y => y*.62;
  m.appendChild(svg('rect', { x:-hw, y:0, width:c.width, height:c.len*.62, fill:'var(--c-floor)' }));
  m.appendChild(svg('rect', { x:-c.paintHalf, y:0, width:c.paintHalf*2, height:sq(c.ftY),
    fill:'var(--c-paint)', stroke:'var(--c-line)', 'stroke-width':.3 }));
  const x3 = cornerX(c), by3 = breakY(c);
  m.appendChild(svg('path', { d: c.straightCorner
      ? `M ${-x3} 0 L ${-x3} ${sq(by3)} Q 0 ${sq(c.hoopY + c.arc3)} ${x3} ${sq(by3)} L ${x3} 0`
      : `M ${-x3} 0 Q 0 ${sq(c.hoopY + c.arc3)} ${x3} 0`,
    fill:'none', stroke:'var(--c-arc)', 'stroke-width':.4 }));
  m.appendChild(svg('circle', { cx:0, cy:sq(c.hoopY), r:.8, fill:'none', stroke:'var(--c-arc)', 'stroke-width':.35 }));
  for (const key of SPOT_KEYS){
    const signs = SIDED.has(key) ? [-1,1] : [0];
    for (const sg of signs){
      const [x,y] = SPOT_MAP[key](sg === 0 ? 1 : sg);
      const cy = sq(y);
      m.appendChild(svg('circle', { cx:x, cy, r:1.5, fill:'var(--accent)', opacity:.9 }));
      const t = svg('text', { x, y:cy+.62, 'text-anchor':'middle', 'font-size':1.75,
        'font-family':'system-ui, sans-serif', 'font-weight':750, fill:'var(--accent-ink)' });
      t.textContent = SPOT_ABBR[key] || '?';
      m.appendChild(t);
    }
  }
  host.appendChild(m);
  const grid = el('div', { class:'spotgrid' });
  for (const key of SPOT_KEYS){
    grid.appendChild(el('b', { text:SPOT_ABBR[key] || '?' }));
    grid.appendChild(el('span', { text: key + (SIDED.has(key) ? ' (left / right)' : '') }));
  }
  host.appendChild(grid);
  host.appendChild(el('div', { class:'hint', style:'margin-top:9px',
    text:'These are the destinations you can send a team-mate to in Floor General.' }));
}

function newQuiz(){
  cancelAnim();
  const pool = allPlays();
  if (pool.length < 2){ App.quiz = null; renderAll(); return; }
  const answer = pool[Math.floor(Math.random()*pool.length)];
  const others = pool.filter(p => p.id !== answer.id).sort(()=>Math.random()-.5).slice(0,3);
  App.quiz = { play:answer, choices:others.concat([answer]).sort(()=>Math.random()-.5), picked:null };
  renderAll();
  animatePlay(answer, {});
}

function designAction(a, i){
  const d = App.designer, b = d.play.beats[d.beat];
  const wrap = el('div', { class:'act' });
  const t = el('select', { onchange:e=>{
    a.type = e.target.value;
    if (!ACTION_NEEDS_FOR.has(a.type)) delete a.for; else if (!a.for) a.for = 1;
    d.dirty = true; renderRail();
  }});
  for (const at of ACTION_TYPES){
    if (at.id === 'none') continue;
    t.appendChild(el('option', { value:at.id, text:at.label, selected:a.type === at.id }));
  }
  wrap.appendChild(t);
  const by = el('select', { class:'who', onchange:e=>{ a.by = +e.target.value; d.dirty = true; } });
  for (const s of SLOTS) by.appendChild(el('option', { value:s, text:'by '+s, selected:a.by === s }));
  wrap.appendChild(by);
  if (ACTION_NEEDS_FOR.has(a.type)){
    const fr = el('select', { class:'who', onchange:e=>{ a.for = +e.target.value; d.dirty = true; } });
    for (const s of SLOTS) fr.appendChild(el('option', { value:s, text:'for '+s, selected:a.for === s }));
    wrap.appendChild(fr);
  }
  wrap.appendChild(el('button', { class:'btn sm ico', text:'×', title:'Remove',
    onclick:()=>{ b.actions.splice(i,1); d.dirty = true; renderRail(); } }));
  return wrap;

  for (const n of SLOTS) s.appendChild(el('option', { value:n, text:`${n} — ${SLOT_NAME[n]}`, selected:b.ball === n }));

/* ============================================================ SHARE / FILE */
async function sharePlay(play){
  let clean;
  try{ clean = validatePlay(play); } catch(err){ return toast('Cannot share: ' + err.message); }
  const code = await encodePlay(clean);
  const url = location.origin + location.pathname + '#p=' + code;
  modal({
    title:'Share this play',
    sub:'Anyone who opens this link gets the play loaded and ready to run. Nothing is uploaded anywhere — the whole play travels inside the link itself.',
    body:(box)=>{
      const ta = el('textarea', { class:'codebox', readonly:true });
      ta.value = url;
      box.appendChild(ta);
      box.appendChild(el('div', { class:'hint', style:'margin-top:8px',
        text: url.length > 1800
          ? 'This link is long — some chat apps will wrap it. Export to a file is safer for very long plays.'
          : `${url.length} characters. Safe to paste anywhere.` }));
      setTimeout(()=>{ try{ ta.focus(); ta.select(); }catch(e){} }, 30);
    },
    actions:[
      ['Copy link', async ()=>{
        try{ await navigator.clipboard.writeText(url); toast('Link copied.'); }
        catch(e){ toast('Copy blocked — select the text and copy manually.'); }
      }, true],
      ['Close', null]
    ]
  });
}
function exportPlay(play){
  let clean;
  try{ clean = validatePlay(play); } catch(err){ return toast('Cannot export: ' + err.message); }
  const blob = new Blob([JSON.stringify(clean, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href:url, download:(clean.name || 'play').replace(/[^a-z0-9]+/gi,'-').toLowerCase() + '.hoopsplay.json' });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function importPlay(){
  const inp = el('input', { type:'file', accept:'.json,application/json', style:'display:none' });
  inp.addEventListener('change', ()=>{
    const f = inp.files && inp.files[0];
    if (!f){ inp.remove(); return; }
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const p = validatePlay(JSON.parse(String(rd.result)));
        if (Store.savePlay(p)){ toast('Imported "' + p.name + '".'); renderLibrary(); openDesigner(p); }
        else toast('Could not save the imported play to this browser.');
      }catch(err){ toast('That file is not a valid play: ' + err.message); }
      inp.remove();
    };
    rd.onerror = ()=>{ toast('Could not read that file.'); inp.remove(); };
    rd.readAsText(f);
  });
  document.body.appendChild(inp);
  inp.click();
}

/* ================================================================= MODALS */
function modal(opts){
  const back = el('div', { class:'modal', role:'dialog', 'aria-modal':'true' });
  const box = el('div', { class:'box' });
  if (opts.title) box.appendChild(el('h2', { text:opts.title }));
  if (opts.sub)   box.appendChild(el('div', { class:'sub', html:opts.sub }));
  if (opts.body)  opts.body(box);
  const acts = el('div', { class:'actions' });
  for (const [label, fn, pri] of (opts.actions || [['Close', null]])){
    acts.appendChild(el('button', { class:'btn' + (pri ? ' pri':''), text:label,
      onclick:()=>{ if (fn) fn(); if (!fn || opts.keepOpen !== true) close(); } }));
  }
  box.appendChild(acts);
  back.appendChild(box);
  function close(){ back.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e){ if (e.key === 'Escape') close(); }
  back.addEventListener('pointerdown', e => { if (e.target === back) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(back);
  return { close, box };
}
let toastTimer = null;
function toast(msg){
  let t = $('#toast');
  if (!t){
    t = el('div', { id:'toast' });
    Object.assign(t.style, { position:'fixed', insetInlineStart:'50%', bottom:'22px',
      transform:'translateX(-50%)', background:'var(--bg-2)', border:'1px solid var(--line-2)',
      color:'var(--ink)', padding:'9px 15px', borderRadius:'99px', zIndex:'90',
      boxShadow:'var(--shadow)', fontSize:'13.5px', fontWeight:'600', maxWidth:'88vw',
      textAlign:'center', transition:'opacity .25s ease' });
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.opacity = '0'; }, 2600);
}
function avgPart(k){
  const rs = App.results.filter(Boolean);
  return rs.length ? rs.reduce((a,r)=>a+r.parts[k],0)/rs.length : 0;
}

  const play = App.play;
  modal({

      mk('Court surface','court',[['hardwood','Hardwood'],['blueprint','Blueprint'],['chalkboard','Chalkboard'],['neon','Neon']]);
      mk('Renderer','render',[['flat','Top-down 2D'],['tilt','Tilted 2.5D']]);
      mk('Court spec','spec',[['nba','NBA'],['fiba','FIBA'],['hs','High school']]);
      mk('Hints in Run It','hints',[['guided','Guided — label and previous positions'],
                                    ['standard','Standard — previous positions'],['blind','Blind — nothing']]);
      mk('Defenders','defence',[['off','Off'],['on','On — they track and trail'],
                                ['mistakes','On, and they make mistakes']]);
      box.appendChild(el('div', { class:'hint', style:'margin-top:6px',
        text:'Defenders are derived from wherever you actually put the offence, and they never affect your score.' }));
      box.appendChild(el('div', { class:'hint', style:'margin-top:10px',
        text:'Recall mode always forces Blind, whatever this is set to.' }));

      box.appendChild(el('h3', { class:'seth', text:'Position colours' }));
      const swatches = el('div', { class:'swatches' });
      const rows = [[1,'1 — Point guard'],[2,'2 — Shooting guard'],[3,'3 — Small forward'],
                    [4,'4 — Power forward'],[5,'5 — Centre'],['d','Defenders (all one colour)']];
      const redraw = () => { applySettings(); renderAll(); };
      for (const [k, label] of rows){
        const inp = el('input', { type:'color', value: slotColors()[k],
          oninput:e=>{ s.colors[k] = e.target.value; Store.saveSettings(s); redraw(); } });
        inp.dataset.slot = k;
        swatches.appendChild(el('label', { class:'sw' }, [ inp, el('span', { text:label }) ]));
      }
      box.appendChild(swatches);
      const presets = el('div', { class:'pcalls', style:'margin-top:9px' });
      for (const name of Object.keys(COLOR_PRESETS)){
        presets.appendChild(el('button', { class:'btn sm', text:name, onclick:()=>{
          s.colors = Object.assign({}, COLOR_PRESETS[name]);
          Store.saveSettings(s);
          $$('.swatches input[type=color]').forEach(i => { i.value = s.colors[i.dataset.slot]; });
          redraw();
        }}));
      }
      box.appendChild(presets);
    },
    actions:[['Done', null, true]]
  });
}
function openHelp(){
  modal({

    sub:'Other basketball apps either let a coach <i>draw</i> plays, or quiz you on <i>decisions</i>. This one grades <b>where you stand</b>.',
    body:(box)=>{
      box.appendChild(el('div', { style:'font-size:13.5px;line-height:1.65;color:var(--ink-2)', html:`
        <p style="margin:0 0 10px"><b style="color:var(--ink)">Run It</b> — you place all five. Drag every player to where they
        belong on this beat, drag the ball onto its handler, tag the action, and get graded on four things:</p>
        <ul style="margin:0 0 12px;padding-left:19px">
          <li><b>Positions (55%)</b> — distance from the correct spot, tolerance by role. A screener gets 2.5 ft
              of slack, a corner shooter 4.5 ft.</li>
          <li><b>Ball (15%)</b> — is it with the right player.</li>
          <li><b>Action (20%)</b> — right type, right screener, right target.</li>
          <li><b>Spacing (10%)</b> — nobody within 12 ft of a team-mate they are not screening, no more than
              two in the paint.</li>
        </ul>
        <p style="margin:0 0 10px"><b style="color:var(--ink)">Floor General</b> — you are the 1 and nothing else. Drag only
        yourself, then <i>call</i> the other four: send 2 to the weak corner, clear the left side, 5 set a ball screen
        on your right. A correct call means your team-mates execute the play properly. A wrong call sends them
        literally where you said. Anyone you never call <b>stays where they are</b> — forgetting to move somebody
        is how you learn that clearing a side is an action, not an assumption.</p>
        <p style="margin:0 0 10px">Both modes feed the identical grader, so the scores are directly comparable.</p>
        <p style="margin:0 0 10px">After each beat you get a <b>ghost diff</b>: hollow markers show the truth, and a
        coloured line runs from where each player ended up to where they belonged. A bad beat never compounds —
        the next one starts from the <i>correct</i> positions, not yours.</p>
        <p style="margin:0"><b style="color:var(--ink)">One honest caveat:</b> real basketball is read-based, so "correct"
        has genuine variance at the edges. Tolerances are generous, scoring is a percentage rather than
        right/wrong, and every deduction explains itself. Treat it as a coach's opinion, not an oracle.</p>` }));
    },
    actions:[['Got it', null, true]]
  });
}

/* =================================================================== MODES */
function setMode(m){
  cancelAnim();
  App.mode = m;
  App.reviewing = false;
  App.defMistakeOpt = null;
  syncModeButtons();
  if (m === 'design'){
    if (!App.designer) openDesigner(App.play ? JSON.parse(JSON.stringify(App.play)) : blankPlay());
    else renderAll();
    return;
  }
  if (m === 'name')    return newQuiz();
  if (m === 'general') return App.play ? startGeneral(App.play) : renderAll();
  if (isPlacementMode()) return App.play ? startRun(App.play) : renderAll();
  renderAll();
}
function syncModeButtons(){
  $$('#modes button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === App.mode)));
}

/* ==================================================================== BOOT */
function boot(){
  applySettings();

  $('#modes').addEventListener('click', e => {
    const b = e.target.closest('button[data-mode]');
    if (b) setMode(b.dataset.mode);
  });
  $('#btnSettings').addEventListener('click', openSettings);
  $('#btnHelp').addEventListener('click', openHelp);
  $('#btnNewPlay').addEventListener('click', ()=>openDesigner(blankPlay()));
  $('#btnImport').addEventListener('click', importPlay);

  const court = $('#court');
  /* The tilt squash is derived from the stage aspect, so a resize has to
     rebuild the renderer. Debounced, and a no-op when nothing actually moved. */
  if (typeof ResizeObserver === 'function'){
    let rt = 0, lastW = 0, lastH = 0;
    new ResizeObserver(entries => {
      const r = entries[0].contentRect;
      if (Math.abs(r.width-lastW) < 2 && Math.abs(r.height-lastH) < 2) return;
      lastW = r.width; lastH = r.height;
      clearTimeout(rt);
      rt = setTimeout(()=>{ if (App.renderer && App.renderer.kind === 'tilt') buildRenderer(); else paint(); }, 130);
    }).observe($('.stage'));
  }
  court.addEventListener('pointerdown', onPointerDown);
  court.addEventListener('pointermove', onPointerMove);
  court.addEventListener('pointerup', onPointerUp);
  court.addEventListener('pointercancel', onPointerUp);

  document.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea, select')) return;
    if (document.querySelector('.modal')) return;
    if (e.key === 'Enter' && isGradedMode() && App.play){
      e.preventDefault();
      if (App.reviewing) nextBeat();
      else if (App.mode === 'general') runCalls();
      else checkBeat();
    }
    if (App.mode === 'learn' && App.play){
      if (e.key === 'ArrowRight'){ App.beatIndex = Math.min(App.play.beats.length-1, App.beatIndex+1); cancelAnim(); triggerMistake(false); renderAll(); }
      if (e.key === 'ArrowLeft'){  App.beatIndex = Math.max(0, App.beatIndex-1); cancelAnim(); triggerMistake(false); renderAll(); }
    }
  });

  renderLibrary();
  renderHistory();
  renderSpotMap();

  /* A shared play in the URL takes precedence over everything else. */
  const m = /(?:^|[#&])p=([A-Za-z0-9\-_]+)/.exec(location.hash || '');
  if (m){
    decodePlay(m[1]).then(p => {
      App.play = p; App.mode = 'learn'; syncModeButtons(); renderAll();
      modal({
        title:'Shared play: ' + p.name,
        sub:'Someone sent you this play. It is loaded and ready — save it to keep it in this browser.',
        actions:[
          ['Save to my plays', ()=>{ toast(Store.savePlay(p) ? 'Saved.' : 'Could not save.'); renderLibrary(); }, true],
          ['Just run it', ()=>{ App.mode = 'run'; syncModeButtons(); startRun(p); }],
          ['Close', null]
        ]
      });
    }).catch(err => {
      toast('That share link could not be read: ' + err.message);
      App.play = BUILTIN[0];
      setMode('learn');
    });
  } else {
    App.play = BUILTIN[0];
    setMode('run');
  }
}

/* Exposed for the external verification harness. The app never reads these
   back off window — they are here so the grading contract can be tested
   without a DOM. */
window.HOOPS = {
  COURTS, BUILTIN, SLOTS, TOL, WEIGHTS, MIN_SPACING, SPOT_MAP,
  gradeBeat, gradePlay, positionScore, scoreActions, spacingReport, roleForSlot,
  resolveCalls, letterFor, encodePlay, decodePlay, validatePlay,
  defenderPos, defenderLag, buildDefence, mistakeOptions, applyMistake, nearestSpotName,
  defenceFor, defenceContext, triggerMistake, displaySpots, MISTAKE_LABEL,
  slotColors, readableInk, DEFAULT_COLORS, COLOR_PRESETS,
  cornerX, breakY, Store, App, cloneSpots, exemptPairs
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
