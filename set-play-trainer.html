<!doctype html>
<html lang="en" data-appearance="dark" data-court="hardwood" data-render="flat">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set Play Trainer</title>
<meta name="description" content="Learn basketball set plays by running them. Watch a play step by step, practise it and get graded on where you stand, or draw your own plays and share them.">
<meta name="theme-color" content="#0f0d0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='9' fill='%23ff8a3d'/%3E%3Cg fill='none' stroke='%2312100e' stroke-width='2.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8.5 23.5 C 8.5 14.5, 14 10.5, 22 10.5'/%3E%3Cpath d='M18.6 6.8 L 22.8 10.5 L 18.6 14.2'/%3E%3C/g%3E%3Ccircle cx='8.5' cy='23.5' r='3.1' fill='%2312100e'/%3E%3C/svg%3E">
<style>
/* =============================================================================
   Set Play Trainer — v2 interface

   Designed around one question: "what does a person who has never used this
   need to see right now?" Every screen does one job. You pick a play first and
   then decide what to do with it; nothing asks you to understand a mode.

   Three independent theme axes, as before:
     data-appearance  dark | light           the app chrome
     data-court       hardwood | blueprint | chalkboard | neon
     data-render      flat | tilt
   ========================================================================== */
:root{
  --bg:#0f0d0c; --surface:#171412; --surface-2:#1e1a17; --surface-3:#27221e;
  --line:#2d2723; --line-2:#3d3530;
  --ink:#f4efe9; --ink-2:#c1b5a9; --ink-3:#8a7e73;
  --accent:#ff8a3d; --accent-hi:#ffa566; --accent-ink:#1c0f05;
  --accent-soft:rgba(255,138,61,.13); --accent-line:rgba(255,138,61,.42);
  --good:#4ec97f; --good-soft:rgba(78,201,127,.14);
  --warn:#ffc247; --warn-soft:rgba(255,194,71,.14);
  --bad:#ff6b5e;  --bad-soft:rgba(255,107,94,.14);
  --r-xl:20px; --r-lg:16px; --r:12px; --r-sm:9px;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --shadow-sm:0 4px 14px rgba(0,0,0,.28);
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --top:60px;
  --side:380px;
}
html[data-appearance="light"]{
  --bg:#f5f2ee; --surface:#ffffff; --surface-2:#faf8f5; --surface-3:#efe9e2;
  --line:#e4ddd4; --line-2:#d2c8bb;
  --ink:#1c1714; --ink-2:#5b5048; --ink-3:#8b7f74;
  --accent:#d0600f; --accent-hi:#e8741f; --accent-ink:#fff7f0;
  --accent-soft:rgba(208,96,15,.1); --accent-line:rgba(208,96,15,.38);
  --good:#1f8a4c; --good-soft:rgba(31,138,76,.1);
  --warn:#9a6b00; --warn-soft:rgba(154,107,0,.1);
  --bad:#c0392b;  --bad-soft:rgba(192,57,43,.1);
  --shadow:0 18px 44px rgba(60,40,20,.14);
  --shadow-sm:0 4px 12px rgba(60,40,20,.09);
}
html[data-court="hardwood"]  {--c-floor:#c38246;--c-floor-2:#a96a33;--c-line:#f7ecdc;--c-paint:#9d5d2b;--c-arc:#f7ecdc;--c-glow:rgba(255,236,208,.16)}
html[data-court="blueprint"] {--c-floor:#0e2140;--c-floor-2:#0a1a33;--c-line:#7fd4ff;--c-paint:#123058;--c-arc:#7fd4ff;--c-glow:rgba(127,212,255,.14)}
html[data-court="chalkboard"]{--c-floor:#22312b;--c-floor-2:#1a2721;--c-line:#e8f0e4;--c-paint:#2b4038;--c-arc:#e8f0e4;--c-glow:rgba(232,240,228,.1)}
html[data-court="neon"]      {--c-floor:#0a0710;--c-floor-2:#0f0a1a;--c-line:#ff3ea5;--c-paint:#170d26;--c-arc:#34e7ff;--c-glow:rgba(255,62,165,.18)}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-.015em;font-weight:680}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* --------------------------------------------------------------- top bar -- */
.top{
  position:sticky;top:0;z-index:30;height:var(--top);
  display:flex;align-items:center;gap:12px;
  padding-inline:18px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:720;letter-spacing:-.02em;white-space:nowrap;
  background:none;border:0;cursor:pointer;padding:6px 4px;font-size:16px}
.brand svg{width:26px;height:26px;flex:none}
.back{display:flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--ink-2);
  font-weight:600;padding:8px 10px;border-radius:var(--r-sm);white-space:nowrap}
.back:hover{background:var(--surface-2);color:var(--ink)}
.back svg{width:18px;height:18px}
.top-title{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-sub{color:var(--ink-3);font-weight:500;margin-inline-start:8px;font-size:14px}
.top .sp{flex:1 1 auto}
.top .acts{display:flex;align-items:center;gap:8px}

/* ------------------------------------------------------------------ buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:38px;padding:0 15px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);
  font-weight:620;font-size:14px;cursor:pointer;white-space:nowrap;
  transition:background .14s ease,border-color .14s ease,transform .08s ease;
}
.btn:hover:not(:disabled){background:var(--surface-3);border-color:var(--ink-3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover:not(:disabled){background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px}
.btn.lg{min-height:48px;padding:0 20px;font-size:15.5px;border-radius:var(--r)}
.btn.wide{width:100%}
.btn.icon{padding:0;width:38px}
.btn.sm.icon{width:32px}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:620;
  text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* --------------------------------------------------------------- inputs --- */
.input,textarea.input,select.input{
  width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:9px 12px;color:var(--ink);font-size:14.5px;
}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:74px;line-height:1.5}
.title-input{
  background:transparent;border:1px solid transparent;border-radius:var(--r-sm);
  font-weight:720;font-size:17px;padding:6px 10px;min-width:0;width:min(420px,40vw);color:var(--ink);
}
.title-input:hover{border-color:var(--line-2)}
.title-input:focus{outline:none;border-color:var(--accent);background:var(--surface)}

/* segmented control */
.seg{display:inline-flex;gap:3px;padding:3px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:transparent;color:var(--ink-2);cursor:pointer;font-weight:620;font-size:13.5px;
  padding:7px 13px;border-radius:7px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* switch */
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;color:var(--ink-2);user-select:none}
.switch input{appearance:none;width:38px;height:22px;border-radius:99px;background:var(--line-2);position:relative;cursor:pointer;flex:none;transition:background .15s}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:99px;background:#fff;transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(16px)}

/* ----------------------------------------------------------------- home --- */
.home{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.hello h1{font-size:30px;line-height:1.15}
.hello p{color:var(--ink-2);margin-top:6px;max-width:620px}
.section{margin-top:30px}
.section-h{display:flex;align-items:center;gap:10px;margin-bottom:13px}
.section-h h2{font-size:17px}
.section-h .count{color:var(--ink-3);font-size:13.5px;font-weight:600}
.section-h .sp{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
.pcard{
  position:relative;display:flex;flex-direction:column;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;cursor:pointer;color:inherit;padding:0;
  transition:border-color .15s,transform .15s,box-shadow .15s;
}
.pcard:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.pcard .thumb{aspect-ratio:50/40;background:var(--c-floor);display:block;width:100%}
.pcard .thumb svg{width:100%;height:100%;display:block}
.pcard .body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:4px}
.pcard .name{font-weight:700;font-size:15.5px;line-height:1.3;padding-right:34px}
.pcard .meta{color:var(--ink-3);font-size:13px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pcard .best{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.62);color:#fff;
  font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;backdrop-filter:blur(6px)}
.pcard .more{position:absolute;right:9px;bottom:11px}
.diff{display:inline-flex;gap:3px}
.diff i{width:6px;height:6px;border-radius:99px;background:var(--line-2);display:block}
.diff i.on{background:var(--accent)}
.tag{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent)}
.pcard.create{
  border:2px dashed var(--line-2);background:transparent;align-items:center;justify-content:center;
  min-height:250px;gap:10px;padding:22px;text-align:center;
}
.pcard.create:hover{border-color:var(--accent);background:var(--accent-soft)}
.pcard.create .plus{width:54px;height:54px;border-radius:99px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center}
.pcard.create .plus svg{width:26px;height:26px}
.pcard.create b{font-size:16px}
.pcard.create span{color:var(--ink-2);font-size:13.5px;max-width:220px}
.quiz-card{display:flex;align-items:center;gap:18px;padding:18px 20px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-lg)}
.quiz-card .qi{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;flex:none}
.quiz-card .qi svg{width:24px;height:24px}
.quiz-card .qt{flex:1;min-width:0}
.quiz-card .qt b{display:block;font-size:15.5px}
.quiz-card .qt span{color:var(--ink-2);font-size:13.5px}
.foot{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;padding-top:20px;border-top:1px solid var(--line)}
.emptyhero{width:100%;display:flex;align-items:center;gap:20px;text-align:left;cursor:pointer;color:inherit;
  background:linear-gradient(120deg,var(--accent-soft),transparent 70%),var(--surface);
  border:2px dashed var(--accent-line);border-radius:var(--r-lg);padding:24px 26px;transition:border-color .15s,transform .15s}
.emptyhero:hover{border-color:var(--accent);transform:translateY(-1px)}
.emptyhero .plus{width:58px;height:58px;border-radius:99px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.emptyhero .plus svg{width:28px;height:28px}
.emptyhero .tx{flex:1;min-width:0}
.emptyhero .tx b{display:block;font-size:18px;margin-bottom:4px}
.emptyhero .tx span{color:var(--ink-2);font-size:14.5px;line-height:1.55}
.emptyhero .go{flex:none;font-weight:720;color:var(--accent);font-size:15px}
.spotpick{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.spotbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.spmap{width:100%;display:block;border-radius:12px;overflow:hidden}

/* ------------------------------------------------------------- workspace -- */
.work{
  display:grid;height:calc(100dvh - var(--top));
  grid-template-columns:minmax(0,1fr) 9px var(--side);
}
.stagecol{display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px;gap:12px}
.stage{flex:1 1 0;min-height:0;position:relative;border-radius:var(--r-lg);overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.stage svg.court{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.banner{display:flex;align-items:center;gap:10px;flex:none;
  background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r);
  padding:10px 8px 10px 14px;font-size:13.5px;font-weight:600;line-height:1.45;text-align:left}
.banner .x{background:none;border:0;color:var(--ink-3);cursor:pointer;border-radius:99px;width:26px;height:26px;display:grid;place-items:center}
.banner .x:hover{background:var(--surface-3);color:var(--ink)}
.under{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:44px}
.work.nosplit{grid-template-columns:minmax(0,1fr)}
.qchoices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:9px;width:100%}
.qchoices .choice{text-align:center;padding:14px 12px}
.under .sp{flex:1}
.grip{position:relative;cursor:col-resize;touch-action:none;background:transparent}
.grip::before{content:'';position:absolute;top:0;bottom:0;left:4px;width:1px;background:var(--line)}
.grip::after{content:'';position:absolute;top:calc(50% - 22px);height:44px;left:2px;width:5px;border-radius:99px;background:var(--line-2);transition:background .15s}
.grip:hover::after,.grip.drag::after{background:var(--accent)}
.side{min-height:0;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-left:1px solid var(--line);
  padding:20px 20px 28px;display:flex;flex-direction:column;gap:18px}
.block{display:flex;flex-direction:column;gap:9px}
.label{font-size:11.5px;font-weight:720;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.help{font-size:13px;color:var(--ink-3);line-height:1.5}
.hr{height:1px;background:var(--line);margin-block:2px}
.lead{font-size:14.5px;color:var(--ink-2);line-height:1.6}
.lead b{color:var(--ink);font-weight:650}
.coach{font-size:14px;line-height:1.62;color:var(--ink-2);border-left:3px solid var(--accent);padding-inline-start:12px}
.coach b{color:var(--ink);font-weight:650}
.mistake{font-size:13.5px;line-height:1.55;color:var(--ink-2);background:var(--warn-soft);
  border-radius:var(--r-sm);padding:10px 12px}
.mistake b{color:var(--warn);display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}

/* step list (watch + edit) */
.steps{display:flex;flex-direction:column;gap:6px}
.stepbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;color:inherit;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:14px}
.stepbtn:hover{border-color:var(--line-2)}
.stepbtn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.stepbtn .n{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;
  background:var(--surface-3);font-weight:720;font-size:12.5px;color:var(--ink-2)}
.stepbtn[aria-current="true"] .n{background:var(--accent);color:var(--accent-ink)}
.stepbtn .t{flex:1;min-width:0;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepbtn .sc{font-weight:720;font-size:13px}

/* the filmstrip under the court in the editor */
.strip{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding-bottom:2px;min-width:0;flex:1}
.chip{flex:none;display:flex;align-items:center;gap:8px;cursor:pointer;color:inherit;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 10px 6px 6px;max-width:210px}
.chip:hover{border-color:var(--line-2)}
.chip[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .n{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface-3);
  font-weight:720;font-size:12.5px;flex:none}
.chip[aria-current="true"] .n{background:var(--accent);color:var(--accent-ink)}
.chip .t{font-size:13.5px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addstep{flex:none;border:1.5px dashed var(--line-2);background:transparent;color:var(--ink-2);border-radius:var(--r-sm);
  padding:0 14px;cursor:pointer;font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.addstep:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.addstep svg{width:16px;height:16px}

/* who-has-the-ball + player pickers */
.players{display:flex;gap:8px;flex-wrap:wrap}
.pbtn{width:44px;height:44px;border-radius:99px;border:2px solid transparent;cursor:pointer;font-weight:800;font-size:16px;
  display:grid;place-items:center;transition:transform .08s,box-shadow .15s;position:relative}
.pbtn:hover{transform:scale(1.06)}
.pbtn[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.pbtn .bb{position:absolute;right:-5px;bottom:-5px;width:19px;height:19px}

/* moves on a step */
.moves{display:flex;flex-direction:column;gap:7px}
.move{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:8px 8px 8px 10px}
.move .ic{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.move .ic svg{width:19px;height:19px}
.move .tx{flex:1;min-width:0}
.move .tx b{display:block;font-size:14px;font-weight:650}
.move .tx span{display:block;font-size:12.5px;color:var(--ink-3);line-height:1.4}
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r-sm);padding:14px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* action card picker */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px}
.acards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.acard{display:flex;gap:11px;align-items:flex-start;text-align:left;cursor:pointer;color:inherit;
  background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r);padding:11px 12px;transition:border-color .12s,background .12s}
.acard:hover{border-color:var(--accent-line)}
.acard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.acard .ic{width:34px;height:34px;border-radius:9px;background:var(--surface-3);color:var(--accent);display:grid;place-items:center;flex:none}
.acard .ic svg{width:20px;height:20px}
.acard b{display:block;font-size:14.5px;font-weight:680}
.acard span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.42;margin-top:2px}
.pickrow{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.sentence{font-size:16px;font-weight:680;background:var(--accent-soft);color:var(--ink);
  border-radius:var(--r-sm);padding:11px 13px;margin-top:16px}

/* score + feedback */
.score{display:flex;align-items:baseline;gap:11px}
.score b{font-size:44px;font-weight:780;letter-spacing:-.04em;line-height:1}
.score .gr{font-size:15px;font-weight:760;padding:3px 11px;border-radius:99px;background:var(--surface-3)}
.meters{display:flex;flex-direction:column;gap:9px}

.sheet .sh h2{font-size:20px;flex:1}

.menu button.danger{color:var(--bad)}
.menu button svg{width:17px;height:17px;color:var(--ink-3)}
.menu hr{border:0;height:1px;background:var(--line);margin:5px 4px}

/* toast */

  .top{padding-inline:10px;gap:6px}

  .hello h1{font-size:24px}
  .brand .nm{display:none}
  .title-input{width:38vw;font-size:15px}

  .save span:not(.dot){display:none}

  .stagecol{padding:10px}
  .emptyhero{flex-direction:column;align-items:flex-start;padding:20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<div id="app"></div>
<script>
"use strict";
/* -------------------------------------------------------------- geometry -- */
/* Feet. Origin at the centre of the baseline, y grows away from the basket.
   The basket is drawn at the top, which is what every coaching diagram does. */
const COURTS = {
  nba:  { key:'nba',  name:'NBA',         width:50,   len:47,   hoopY:5.25, rimR:.75,
          bbY:4,    bbHalf:3,    paintHalf:8,    ftY:19,    ftR:6,   raR:4,
          arc3:23.75, corner3X:22,    straightCorner:true },
  fiba: { key:'fiba', name:'FIBA',        width:49.2, len:47.2, hoopY:5.25, rimR:.74,
          bbY:3.94, bbHalf:2.95, paintHalf:8.04, ftY:19.03, ftR:5.9, raR:4.1,
          arc3:22.15, corner3X:21.65, straightCorner:true },
  hs:   { key:'hs',   name:'High school', width:50,   len:42,   hoopY:5.25, rimR:.75,
          bbY:4,    bbHalf:3,    paintHalf:6,    ftY:19,    ftR:6,   raR:0,
          arc3:19.75, corner3X:0,    straightCorner:false }
};
/* Derived, never hand-typed: where the arc meets the baseline when there is no
   straight corner segment, and where the straight segment ends when there is. */
function cornerX(c){
  return c.straightCorner ? c.corner3X : Math.sqrt(Math.max(0, c.arc3*c.arc3 - c.hoopY*c.hoopY));
}
function breakY(c){
  if (!c.straightCorner) return 0;
  return c.hoopY + Math.sqrt(Math.max(0, c.arc3*c.arc3 - c.corner3X*c.corner3X));
}

const SLOTS = [1,2,3,4,5];
const SLOT_NAME = {1:'Point guard',2:'Shooting guard',3:'Small forward',4:'Power forward',5:'Centre'};

const DEFAULT_COLORS = { 1:'#f2c14e', 2:'#e0702a', 3:'#4ec97f', 4:'#5aa9e6', 5:'#c780e8', d:'#8b93a3' };
const COLOR_PRESETS = {
  'Default':      { 1:'#f2c14e', 2:'#e0702a', 3:'#4ec97f', 4:'#5aa9e6', 5:'#c780e8', d:'#8b93a3' },
  /* Okabe-Ito: distinguishable under every common form of colour blindness. */
  'Colour-safe':  { 1:'#e69f00', 2:'#56b4e9', 3:'#009e73', 4:'#f0e442', 5:'#cc79a7', d:'#9aa0a6' },
  'Warm court':   { 1:'#ffd166', 2:'#ef8354', 3:'#e56b6f', 4:'#b56576', 5:'#eaac8b', d:'#7d8491' },
  'Cool':         { 1:'#9bf6ff', 2:'#a0c4ff', 3:'#bdb2ff', 4:'#8ecae6', 5:'#caffbf', d:'#8d99ae' },
  'Mono':         { 1:'#f5f0e8', 2:'#d3c8b8', 3:'#b0a28c', 4:'#8d7c64', 5:'#6b5b46', d:'#6f7378' }
};
const HEX = /^#[0-9a-f]{6}$/i;
/* Colours come from user input, so every read is validated rather than trusted. */
function slotColors(){
  const c = (App.settings && App.settings.colors) || {};
  const out = {};
  for (const k of [1,2,3,4,5,'d']) out[k] = HEX.test(c[k]) ? c[k] : DEFAULT_COLORS[k];
  return out;
}
/* A user can pick any colour, so the number on a token picks its own ink. */
function readableInk(hex){
  if (!HEX.test(hex)) return '#141014';
  const v = i => parseInt(hex.slice(1+i*2, 3+i*2), 16) / 255;
  const lin = u => u <= .03928 ? u/12.92 : Math.pow((u+.055)/1.055, 2.4);
  const L = .2126*lin(v(0)) + .7152*lin(v(1)) + .0722*lin(v(2));
  return L > .42 ? '#141014' : '#ffffff';
}

/* Every action carries its own definition. The app is full of coaching
   vocabulary, and a dropdown reading "Flare / Pop / Curl / Seal" is useless to
   anyone who does not already know what those words mean. */
const ACTION_TYPES = [
  { id:'none',    label:'Nothing on this step', short:'players are just getting to their spots',
    help:'Nobody screens, cuts or passes on this step — everyone is simply getting to a spot.' },
  { id:'screen',  label:'Screen',          needsFor:true, short:'stand still and free a team-mate',
    help:'One player stands still and lets a defender run into him, freeing a team-mate. The one standing still is the screener ("by"); the one who gets free is who it is "for".' },
  { id:'clearout',label:'Clear out',                      short:'empty your side so a team-mate can go 1-on-1',
    help:'A player leaves his side of the floor and takes his defender with him, so a team-mate can attack one-on-one or run a two-man game with no help defender nearby. This is what the point guard is asking for when he waves a wing across to the far side.' },
  { id:'handoff', label:'Dribble handoff', needsFor:true, short:'hand the ball off on the run',
    help:'The ball handler dribbles up to a team-mate and hands him the ball as he runs past. A pass and a screen in one move.' },
  { id:'pass',    label:'Pass',            needsFor:true, short:'throw it to a team-mate',
    help:'The ball is thrown from one player to another.' },
  { id:'cut',     label:'Cut',                            short:'hard run to get open',
    help:'A hard, sharp run to get open — usually toward the basket.' },
  { id:'roll',    label:'Roll',                           short:'after screening, dive to the rim',
    help:'After setting a ball screen, the screener turns and runs hard to the rim, hoping for a pass on the way.' },
  { id:'pop',     label:'Pop',                            short:'after screening, step out for a shot',
    help:'The opposite of a roll. After screening, he steps OUT to open space for a shot instead of diving to the rim. Bigs who can shoot pop; bigs who dunk roll.' },
  { id:'dribble', label:'Dribble',                        short:'drive or advance the ball yourself',
    help:'The ball handler advances or attacks with the ball himself.' },
  { id:'flare',   label:'Flare',                          short:'cut AWAY from the ball for a shot',
    help:'A cut AWAY from the ball — out toward the sideline or corner, usually off a screen — to catch with space for a shot. You flare away; you curl toward.' },
  { id:'curl',    label:'Curl',                           short:'hook tight around a screen to the rim',
    help:'Running tight around a screen and hooking toward the basket, staying shoulder-to-shoulder with the screener. The opposite choice to a flare.' },
  { id:'lift',    label:'Lift',                           short:'step up from the corner as an outlet',
    help:'Stepping up from the corner toward the wing to give the ball handler somewhere to pass. Lifting drags a defender with you, which is often the whole point.' },
  { id:'post',    label:'Post up',                        short:'set up with your back to the basket',
    help:'A player sets up near the lane with his back to the basket, asking for the ball so he can score close in.' },
  { id:'seal',    label:'Seal',                           short:'pin your defender to open the rim',
    help:'A big man puts his body between his defender and the ball and holds him there, opening a passing lane at the rim.' }
];
const ACTION_SHORT = Object.fromEntries(ACTION_TYPES.map(a => [a.id, a.short]));
const ACTION_HELP = Object.fromEntries(ACTION_TYPES.map(a => [a.id, a.help]));
const ACTION_LABEL = Object.fromEntries(ACTION_TYPES.map(a=>[a.id,a.label]));
const ACTION_NEEDS_FOR = new Set(ACTION_TYPES.filter(a=>a.needsFor).map(a=>a.id));
/* Contact is the entire point of these actions, so the pair involved is exempt
   from the minimum-spacing rule. Without this, every screen beat would be
   flagged as bad spacing, which would be nonsense. */
const CONTACT_ACTIONS = new Set(['screen','handoff','seal']);

/* ---------------------------------------------------------- built-in plays */
const BUILTIN = [
{
  id:'five-out-drag', name:'5-Out Drag', formation:'5-Out', difficulty:1,
  tags:['transition','ball screen','spacing'],
  blurb:'Transition ball screen out of a five-out look. Really a spacing lesson: if the corners are not filled early, the drag screen has nowhere to go.',
  beats:[
    { label:'Push ahead', ball:1,
      spots:{1:[-10,31], 2:[-22,5], 3:[22,5], 4:[20,24], 5:[2,37]},
      actions:[{type:'dribble',by:1}], keyPlayers:[2,3],
      coaching:'1 pushes to the left slot. <b>2 and 3 sprint the corners</b> — not the wings, the corners. 4 fills the right wing, 5 trails the play.',
      mistake:'Filling the wings instead of the corners. A filled corner drags the low defender out of the paint; a filled wing does not.' },
    { label:'Drag screen', ball:1,
      spots:{1:[-13,29], 2:[-22,5], 3:[22,5], 4:[20,24], 5:[-8,30]},
      actions:[{type:'screen',by:5,for:1}], keyPlayers:[1,5],
      coaching:'5 trails into a drag screen on 1’s <b>inside shoulder</b>, before the defence is set. 1 uses it to attack the <b>middle</b> of the floor.',
      mistake:'Setting the screen too high, above the arc. There is nothing to attack from out there — the drag has to happen inside 30 ft.' },
    { label:'Roll and space', ball:1,
      spots:{1:[-4,24], 2:[-22,5], 3:[22,5], 4:[12,30], 5:[-1,11]},
      actions:[{type:'roll',by:5}], keyPlayers:[5,4],
      coaching:'5 rolls hard to the rim. <b>4 lifts from the wing to the top</b> to become the spray-out. That lift is what forces the help defender to choose.',
      mistake:'4 standing still on the wing. If nobody lifts, the weak-side defender helps for free and the roll dies on arrival.' }
  ]
},
{
  id:'horns-flare', name:'Horns Flare', formation:'Horns', difficulty:2,
  tags:['half court','ball screen','flare'],
  blurb:'The most common modern half-court entry. Two bigs at the elbows, corners filled, then a ball screen one way and a flare screen the other.',
  beats:[
    { label:'Horns set', ball:1,
      spots:{1:[0,30], 2:[-22,5], 3:[22,5], 4:[-8,19], 5:[8,19]},
      actions:[], keyPlayers:[4,5],
      coaching:'Both bigs sit <b>on the elbows</b> — the corners of the free-throw line. 1 is centred above the arc, both corners filled.',
      mistake:'Bigs drifting down to the blocks. From the blocks there is no ball-screen angle and the set collapses into a post-up.' },
    { label:'Ball screen right', ball:1,
      spots:{1:[5,27], 2:[-22,5], 3:[22,5], 4:[-8,19], 5:[9,25]},
      actions:[{type:'screen',by:5,for:1}], keyPlayers:[1,5],
      coaching:'5 steps up off the elbow to screen. 1 takes it and drives <b>right</b> — the flare on the far side only works if the ball actually moves that way.',
      mistake:'1 going away from the screen out of habit. Reject it and you have run a completely different play.' },
    { label:'Flare screen', ball:1,
      spots:{1:[12,26], 2:[-18,12], 3:[22,5], 4:[-13,18], 5:[4,14]},
      actions:[{type:'screen',by:4,for:2},{type:'roll',by:5}], keyPlayers:[4,2],
      coaching:'As the ball turns the corner, <b>4 slides down and flare-screens for 2</b>, who lifts out of the corner. 5 rolls through the middle.',

},
{

  blurb:'A pure two-man game. Send everybody to the weak side, then play 1 and 5 on an island with no help defender within twenty feet. The whole play is the clear-out.',
  beats:[

      spots:{1:[13,30], 2:[-22,5], 3:[-21,22], 4:[-10,9], 5:[16,22]},
      actions:[], keyPlayers:[2,3,4],
      spacingExempt:[[1,5]],
      coaching:'Ball and big on the right. <b>Everyone else goes left</b> — corner, slot and weak-side dunker. The right side of the floor must be genuinely empty.',
      mistake:'Leaving one team-mate on the strong side. His defender is the help defender, and the entire point of the play was to remove him.' },
    { label:'Screen into space', ball:1,
      spots:{1:[13,29], 2:[-22,5], 3:[-21,22], 4:[-10,9], 5:[18,27]},
      actions:[{type:'screen',by:5,for:1}], keyPlayers:[1,5],
      coaching:'5 screens on 1’s <b>outside shoulder</b>, sending him at the empty right side. Nobody can rotate over in time from where the other three are standing.',
      mistake:'Screening him back toward the middle. That drives straight into the three defenders you just spent a step moving away.' },
    { label:'Downhill', ball:1,
      spots:{1:[17,20], 2:[-22,5], 3:[-21,22], 4:[-10,9], 5:[7,11]},
      actions:[{type:'roll',by:5}], keyPlayers:[1,5],
      coaching:'1 turns the corner with a clear lane. 5 rolls in behind him. Two defenders, two attackers, and no third defender close enough to matter.',
      mistake:'Picking up the dribble early. On an empty side the advantage lasts as long as the dribble does.' },
    { label:'The one pass out', ball:1,
      spots:{1:[16,15], 2:[-22,5], 3:[-21,22], 4:[-10,9], 5:[3,7]},
      actions:[{type:'pass',by:1,for:2}], keyPlayers:[1],
      coaching:'If the weak-side low man finally steps in to tag the roll, he has left <b>2 in the corner</b>. That is the only pass this play ever needs.',

{

  blurb:'A ball screen with a back screen laid on the roller’s defender. Three defenders end up wrong at once. Timing is everything, which is exactly what practising it step by step can teach.',
  beats:[
    { label:'Spain setup', ball:1,

      spots:{1:[-2,29], 2:[-22,5], 3:[22,5], 4:[-1,20], 5:[-7,27]},
      actions:[{type:'screen',by:5,for:1}], keyPlayers:[1,5],
      spacingExempt:[[4,5],[1,4]],
      coaching:'An ordinary ball screen, 1 comes off it going <b>left</b>. Everything so far should look exactly like a normal pick-and-roll — that is the disguise.',

    { label:'The Spain action', ball:1,
      spots:{1:[-12,25], 2:[-22,5], 3:[22,5], 4:[0,21], 5:[-1,16]},
      actions:[{type:'screen',by:4,for:5},{type:'roll',by:5}], keyPlayers:[4,5],

    { label:'Screener pops', ball:1,
      spots:{1:[-15,22], 2:[-22,5], 3:[22,5], 4:[3,29], 5:[-2,8]},

      mistake:'Popping to the wing. The top of the key is the spot — it is the furthest point from both defenders who are now below the ball.' },
    { label:'Three reads', ball:1,
      spots:{1:[-17,21], 2:[-22,5], 3:[22,5], 4:[2,30], 5:[-1,7]},
      actions:[{type:'pass',by:1,for:4}], keyPlayers:[1],
      coaching:'Read the low man. <b>If he tags 5, hit 4 at the top.</b> If he stays home, throw the lob. If both help, the weak-side corner is open.',

/* --------------------------------------------------------------- helpers -- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const dist = (a,b)=> Math.hypot(a[0]-b[0], a[1]-b[1]);
const lerp = (a,b,t)=> a + (b-a)*t;
const round3 = v => Math.round(v*1000)/1000;
function el(tag, attrs, kids){
  const n = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'value' && (tag === 'input' || tag === 'textarea')) n.value = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of (kids||[])) if (c) n.appendChild(c);
  return n;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(prefix){
  const r = new Uint8Array(6);
  if (self.crypto && self.crypto.getRandomValues) crypto.getRandomValues(r);
  else for (let i=0;i<r.length;i++) r[i] = Math.floor(Math.random()*256);
  return prefix + '-' + Array.from(r, b=>b.toString(16).padStart(2,'0')).join('');

function cloneSpots(s){ const o = {}; for (const k of SLOTS) o[k] = [s[k][0], s[k][1]]; return o; }

/* --------------------------------------------------------- share codes --- */
function b64urlEncode(bytes){
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(str){
  const s = str.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(s + '='.repeat((4 - s.length % 4) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function encodePlay(play){
  const bytes = new TextEncoder().encode(JSON.stringify(play));
  if (typeof CompressionStream === 'function'){
    try{
      const cs = new CompressionStream('deflate-raw');
      const w = cs.writable.getWriter(); w.write(bytes); w.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      return 'z' + b64urlEncode(new Uint8Array(buf));
    }catch(e){ /* fall through to raw */ }
  }
  return 'r' + b64urlEncode(bytes);
}
async function decodePlay(code){
  if (!code || code.length < 2) throw new Error('empty share code');
  const tag = code[0];
  let bytes = b64urlDecode(code.slice(1));
  if (tag === 'z'){
    if (typeof DecompressionStream !== 'function') throw new Error('this browser cannot read compressed share codes');
    const ds = new DecompressionStream('deflate-raw');
    const w = ds.writable.getWriter(); w.write(bytes); w.close();
    bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
  } else if (tag !== 'r'){
    throw new Error('unrecognised share code');
  }
  return validatePlay(JSON.parse(new TextDecoder().decode(bytes)));
}

/* Anything arriving from a URL, a file or another person is untrusted input.
   Normalise it into the shape the engine expects, or refuse it outright. */
/* Anything that reaches a `html:` sink must lose its markup first. Plays travel
   between people as links and files, so this is the boundary. */
function stripTags(v){
  return String(v == null ? '' : v).replace(/<[^>]*>/g, '').replace(/[<>]/g, '');
}
function validatePlay(raw){
  if (!raw || typeof raw !== 'object') throw new Error('not a play object');
  const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  const play = {
    id: (typeof raw.id === 'string' && raw.id) ? raw.id.slice(0,64) : uid('play'),
    name: stripTags(raw.name || 'Untitled play').slice(0,80),
    formation: stripTags(raw.formation || '').slice(0,40),
    difficulty: Math.min(3, Math.max(1, Math.round(num(raw.difficulty, 1)))),
    tags: Array.isArray(raw.tags) ? raw.tags.slice(0,6).map(t=>stripTags(t).slice(0,24)) : [],
    blurb: stripTags(raw.blurb || '').slice(0,700),
    custom: true, beats: []
  };
  const beats = Array.isArray(raw.beats) ? raw.beats.slice(0,12) : [];
  if (!beats.length) throw new Error('a play needs at least one beat');
  for (const b of beats){
    const spots = {};
    for (const s of SLOTS){
      const p = (b && b.spots) ? b.spots[s] : null;
      spots[s] = (Array.isArray(p) && p.length === 2)
        ? [ Math.max(-30, Math.min(30, num(p[0], 0))), Math.max(-2, Math.min(52, num(p[1], 20))) ]
        : [ (s-3)*8, 24 ];
    }
    const actions = (Array.isArray(b.actions) ? b.actions.slice(0,3) : []).map(a => {
      if (!a || !ACTION_LABEL[a.type] || a.type === 'none') return null;
      if (!SLOTS.includes(a.by)) return null;
      const out = { type:a.type, by:a.by };
      if (ACTION_NEEDS_FOR.has(a.type) && SLOTS.includes(a.for)) out.for = a.for;
      return out;
    }).filter(Boolean);
    play.beats.push({
      label: stripTags((b && b.label) || '').slice(0,48),
      ball: SLOTS.includes(b && b.ball) ? b.ball : 1,
      spots, actions,
      keyPlayers: Array.isArray(b && b.keyPlayers) ? b.keyPlayers.filter(s=>SLOTS.includes(s)) : [],
      spacingExempt: Array.isArray(b && b.spacingExempt)
        ? b.spacingExempt.filter(p => Array.isArray(p) && p.length===2 && SLOTS.includes(p[0]) && SLOTS.includes(p[1]))
        : [],
      coaching: stripTags((b && b.coaching) || '').slice(0,700),
      mistake:  stripTags((b && b.mistake)  || '').slice(0,500)
    });
  }
  return play;
}

/* ================================================================= GRADE ==
   Pure. No DOM, no globals beyond the constant tables, no knowledge that a
   renderer or a UI exists. Same input, same output, forever.
   ======================================================================== */
const TOL = {
  screener: { ok:2.5, fail:7  },   // a screen 5 ft off the mark is not a screen
  cutter:   { ok:3.5, fail:9  },
  spot:     { ok:4.5, fail:11 }    // a corner shooter has room to breathe
};
const WEIGHTS = { pos:.55, ball:.15, act:.20, space:.10 };
const MIN_SPACING = 12;   // feet between non-contact team-mates
const PAINT_MAX   = 2;    // offensive players allowed in the paint at once

function roleForSlot(beat, slot){
  for (const a of beat.actions || []){
    if (a.by === slot && CONTACT_ACTIONS.has(a.type)) return 'screener';
    if (a.by === slot) return 'cutter';
    if (a.for === slot) return 'cutter';
  }
  if (beat.ball === slot) return 'cutter';
  return 'spot';
}
function positionScore(user, ref, role){
  const t = TOL[role] || TOL.spot;
  const d = dist(user, ref);
  if (d <= t.ok) return 1;
  return clamp01((t.fail - d) / (t.fail - t.ok));
}
function exemptPairs(beat){
  const set = new Set();
  const add = (a,b) => set.add(a < b ? a+'-'+b : b+'-'+a);
  for (const a of beat.actions || []) if (CONTACT_ACTIONS.has(a.type) && a.by && a.for) add(a.by, a.for);
  for (const p of beat.spacingExempt || []) add(p[0], p[1]);
  return set;
}
function spacingReport(spots, beat, court){
  const ex = exemptPairs(beat);
  const violations = [];
  for (let i = 0; i < SLOTS.length; i++){
    for (let j = i+1; j < SLOTS.length; j++){
      const a = SLOTS[i], b = SLOTS[j];
      if (ex.has(a+'-'+b)) continue;
      const d = dist(spots[a], spots[b]);
      if (d < MIN_SPACING) violations.push({ kind:'tight', a, b, d });
    }
  }
  const inPaint = SLOTS.filter(s => Math.abs(spots[s][0]) <= court.paintHalf && spots[s][1] <= court.ftY);
  if (inPaint.length > PAINT_MAX) violations.push({ kind:'paint', who:inPaint });
  return { violations, score: clamp01(1 - .34 * violations.length) };
}
function scoreActions(userActs, refActs){
  const u = (userActs || []).filter(a => a && a.type && a.type !== 'none');
  const r = (refActs  || []).filter(a => a && a.type && a.type !== 'none');
  if (!r.length && !u.length) return 1;         // correctly identified a quiet beat
  if (!r.length || !u.length) return 0;
  const used = new Set();
  let total = 0;
  for (const ua of u){
    let best = 0, bestI = -1;
    r.forEach((ra, i) => {
      if (used.has(i)) return;
      let s = 0;
      if (ra.type === ua.type){
        s = .25;
        if (ra.by === ua.by){
          s = .6;
          if (!ACTION_NEEDS_FOR.has(ra.type) || ra.for === ua.for) s = 1;
        }
      }
      if (s > best){ best = s; bestI = i; }
    });
    if (bestI >= 0) used.add(bestI);
    total += best;
  }
  return clamp01(total / Math.max(r.length, u.length));
}
function describeMiss(user, ref){
  const d = dist(user, ref), dx = user[0]-ref[0], dy = user[1]-ref[1], ft = d.toFixed(1);
  if (Math.abs(dy) >= Math.abs(dx)) return dy > 0 ? `${ft} ft too far from the basket` : `${ft} ft too deep toward the basket`;
  const outward = (ref[0] === 0) ? (dx > 0) : (Math.sign(dx) === Math.sign(ref[0]));
  return outward ? `${ft} ft too wide` : `${ft} ft too far inside`;
}
/**
 * Grade one beat.
 * @param {{spots:Object, ball:number, actions:Array}} attempt   court feet
 * @param {Object} beat   reference beat
 * @param {Object} court  court spec (only the paint test uses it)
 */
function gradeBeat(attempt, beat, court){
  const parts = {}, per = {};
  let weighted = 0, weightSum = 0;
  for (const s of SLOTS){
    const role = roleForSlot(beat, s);
    const sc = positionScore(attempt.spots[s], beat.spots[s], role);
    const w = (beat.keyPlayers || []).includes(s) ? 1.5 : 1;
    per[s] = { score:sc, role, weight:w, dist:Math.round(dist(attempt.spots[s], beat.spots[s])*100)/100 };
    weighted += sc*w; weightSum += w;
  }
  parts.pos   = weightSum ? weighted/weightSum : 0;
  parts.ball  = attempt.ball === beat.ball ? 1 : 0;
  parts.act   = scoreActions(attempt.actions, beat.actions);
  const sp    = spacingReport(attempt.spots, beat, court);
  parts.space = sp.score;

  const total = parts.pos*WEIGHTS.pos + parts.ball*WEIGHTS.ball + parts.act*WEIGHTS.act + parts.space*WEIGHTS.space;

  /* Diagnostics: geometry first, coaching cue second. */
  const notes = [];
  for (const s of SLOTS){
    if (per[s].score >= .85) continue;
    notes.push({ slot:s, level: per[s].score < .4 ? 'bad' : 'warn',
      text:`${SLOT_NAME[s]} was ${describeMiss(attempt.spots[s], beat.spots[s])}.` });
  }
  if (!parts.ball) notes.push({ slot:beat.ball, level:'bad',
    text:`The ball belongs with ${beat.ball} on this beat, not ${attempt.ball}.` });
  if (parts.act < 1){
    const want = (beat.actions || []).length
      ? beat.actions.map(a => ACTION_LABEL[a.type].toLowerCase() + ' by ' + a.by + (a.for ? ' for ' + a.for : '')).join(', ')
      : 'no action at all';
    notes.push({ slot:'!', level: parts.act === 0 ? 'bad' : 'warn', text:`The action here is ${want}.` });
  }
  for (const v of sp.violations){
    notes.push(v.kind === 'paint'
      ? { slot:'!', level:'warn', text:`${v.who.join(', ')} are all in the paint. Two at most, or there is nowhere to drive.` }
      : { slot:'!', level:'warn', text:`${v.a} and ${v.b} are only ${v.d.toFixed(1)} ft apart. One defender guards both.` });
  }
  if (!notes.length) notes.push({ slot:'✓', level:'good',
    text:'Every spot inside tolerance, spacing legal, right action. Clean beat.' });

  return { total, parts, per, spacing:sp, notes };
}
function letterFor(score){
  const p = score*100;
  if (p >= 93) return 'A';
  if (p >= 87) return 'A-';
  if (p >= 80) return 'B+';
  if (p >= 73) return 'B';
  if (p >= 66) return 'B-';
  if (p >= 58) return 'C+';
  if (p >= 50) return 'C';
  if (p >= 40) return 'D';
  return 'F';
}
/* Later beats are harder and matter more, so they carry slightly more weight. */
function gradePlay(beatScores){
  if (!beatScores.length) return 0;
  let num = 0, den = 0;
  beatScores.forEach((s,i)=>{ const w = 1 + i*0.12; num += s*w; den += w; });
  return num/den;
}

/* ========================================================= FLOOR GENERAL ==
   You are the 1. You place only yourself; everyone else moves because you told
   them to. A call is resolved against the beat's intent:

     - a call that MATCHES the intent sends that team-mate to the play's spot.
       Your team-mates know the play; a correct call means they execute it.
     - a call that does NOT match sends them literally where you said, which
       will grade exactly as badly as it deserves.
     - anyone you never called stays where they were, so forgetting to move
       someone costs you. That is the lesson.

   The output is an ordinary {spots, ball, actions} attempt, so it goes through
   gradeBeat() untouched. The engine has no idea this mode exists.
   ======================================================================== */
const SPOT_MAP = {
  'corner':       s => [22*s, 5],
  'wing':         s => [21*s, 22],
  'slot':         s => [11*s, 29],
  'top':          _ => [0, 30],
  'trail':        _ => [0, 36],
  'elbow':        s => [8*s, 19],
  'block':        s => [8*s, 6],
  'short corner': s => [14*s, 6],
  'dunker':       s => [9*s, 9],
  'nail':         _ => [0, 19],
  'rim':          _ => [0, 8]
};
const SPOT_KEYS = Object.keys(SPOT_MAP);
const SPOT_HELP = {
  'corner':       'The very bottom of the three-point line, by the baseline. The shortest three on the floor.',
  'wing':         'The side of the arc, roughly level with the free-throw line.',
  'slot':         'Between the wing and the top — a guard spot above the arc.',
  'top':          'Straight out from the basket, above the arc. Also called the top of the key.',
  'trail':        'Behind the play in transition — the last big man up the floor.',
  'elbow':        'The corner of the free-throw line, where it meets the lane.',
  'block':        'The painted block beside the lane, right next to the rim.',
  'short corner': 'On the baseline just outside the lane, between the block and the corner.',
  'dunker':       'Just off the lane near the baseline, on the weak side, waiting for a drop-off pass.',
  'nail':         'The middle of the free-throw line — the most important help position on defence.',
  'rim':          'Right at the basket — the highest-percentage shot there is.'
};
/* The words the coaching notes use. Being able to run a play is no help if the
   note explaining it is in a language you do not speak. */
const TERM_HELP = {
  'Strong side':  'The half of the floor the ball is on.',
  'Weak side':    'The half of the floor away from the ball. Also called the help side.',
  'Goalside':     'Between your man and your own basket — where a defender wants to be.',
  'Low man':      'The bottom weak-side defender. His job is to step in on a rolling big.',
  'Tag':          'Stepping in briefly to slow a rolling big, then recovering to your own man.',
  'Skip pass':    'A long pass thrown across the floor, over the top of the defence, to the far side.',
  'Drag screen':  'A ball screen set early in transition, before the defence is organised.',
  'Back screen':  'A screen set on a defender from behind, where he cannot see it coming.',
  'Flare screen': 'A screen that sends the cutter away from the ball, out toward the sideline.',
  'Ball screen':  'A screen set for the player holding the ball. The basis of the pick-and-roll.',
  'Empty side':   'A side of the floor deliberately cleared of team-mates, so no help defender is near.',
  'Clear out':    'Sending a team-mate away to the far side so the ball handler can attack alone. The action that creates an empty side.',
  'Two-man game': 'Just two attackers working together — usually a guard and a big — on a side with nobody else on it.',
  'Spacing':      'How far apart the offence stands. Twelve feet or more means one defender cannot guard two players.',
  'Beat':         'One moment in a play, like a frame. A play is a handful of beats in order.'
};
const SIDED = new Set(['corner','wing','slot','elbow','block','short corner','dunker']);
const SNAP_FT = 6.5;   // how close a called destination must be to count as right

function sideSign(side){ return side === 'left' ? -1 : 1; }
function spotFor(where, side){ return SPOT_MAP[where](sideSign(side)); }
function callText(c){
  if (c.v === 'send')       return `${c.who} → ${SIDED.has(c.where) ? c.side + ' ' : ''}${c.where}`;
  if (c.v === 'ballscreen') return `${c.who} ball screen, my ${c.side}`;
  if (c.v === 'offball')    return `${c.who} ${ACTION_LABEL[c.type].toLowerCase()} for ${c.for}`;
  if (c.v === 'clear')      return `clear the ${c.side} side`;
  return '?';
}
/**
 * @param {Object} baseSpots  where everyone currently stands
 * @param {Array}  pgPos      where the user put the 1
 * @param {Array}  calls
 * @param {Object} beat       the reference beat, used only to judge intent
 * @returns {{spots, actions, log}}
 */
function resolveCalls(baseSpots, pgPos, calls, beat){
  const spots = cloneSpots(baseSpots);
  spots[1] = [pgPos[0], pgPos[1]];
  const actions = [];
  const log = [];
  const refActs = beat.actions || [];

  for (const c of (calls || [])){
    let ok = false, note = '', action = null, who = c.who;

    if (c.v === 'send'){
      const target = spotFor(c.where, c.side);
      const ref = beat.spots[who];
      ok = dist(target, ref) <= SNAP_FT;
      spots[who] = ok ? [ref[0], ref[1]] : target;
      note = ok ? 'right spot for this beat' : 'the play does not want him there';
    }
    else if (c.v === 'ballscreen'){
      const want = refActs.find(a => a.type === 'screen' && a.by === who && a.for === 1);
      if (want){
        const ref = beat.spots[who];
        const refSide = (ref[0] - beat.spots[1][0]) >= 0 ? 'right' : 'left';
        ok = refSide === c.side;
      }
      if (ok){
        spots[who] = [beat.spots[who][0], beat.spots[who][1]];
        note = 'right screener, right side';
      } else {
        spots[who] = [pgPos[0] + 5*sideSign(c.side), pgPos[1] - 1.5];
        note = want ? 'right screener, wrong side' : 'not the screener on this beat';
      }
      action = { type:'screen', by:who, for:1 };
    }
    else if (c.v === 'offball'){
      const want = refActs.find(a => a.type === c.type && a.by === who && a.for === c.for);
      if (want){
        ok = true;
        spots[who] = [beat.spots[who][0], beat.spots[who][1]];
        spots[c.for] = [beat.spots[c.for][0], beat.spots[c.for][1]];
        note = 'exactly the off-ball action this beat needs';
      } else {
        /* Put the screener between the target and the rim: a plausible but, on
           this beat, wrong place to be. */
        const t = spots[c.for];
        spots[who] = [ (t[0] + beat.spots[1][0])/2, (t[1] + beat.spots[1][1])/2 ];
        note = 'no such action on this beat';
      }
      action = { type:c.type, by:who, for:c.for };
    }
    else if (c.v === 'clear'){
      const sgn = sideSign(c.side);
      /* "Everybody out" never means the big who is screening for you. Real
         point guards do not wave off their own ball screen. */
      const keep = new Set([1]);
      for (const a of refActs) if (CONTACT_ACTIONS.has(a.type) && a.for === 1) keep.add(a.by);
      let moved = 0, right = 0;
      for (const s of SLOTS){
        if (keep.has(s)) continue;
        if (Math.sign(spots[s][0]) !== sgn || Math.abs(spots[s][0]) < 4) continue;
        moved++;
        const ref = beat.spots[s];
        /* Clearing is correct for this player if the play really does want him
           off that side. */
        if (Math.sign(ref[0]) !== sgn || Math.abs(ref[0]) < 4){ spots[s] = [ref[0], ref[1]]; right++; }
        else spots[s] = [-spots[s][0], spots[s][1]];
      }
      ok = moved > 0 && right === moved;
      note = moved === 0 ? 'nobody needed to move off that side'
           : ok ? 'everyone who had to move, moved'
           : `${moved-right} of them belonged on that side`;
    }
    log.push({ call:c, ok, note, text:callText(c) });
    if (action) actions.push(action);
  }
  return { spots, actions, log };
}


/* ================================================================ DEFENCE ==
   Defenders are DERIVED from the offensive shape, never authored. That means
   every play — including one you design yourself — gets a defence for free,
   and the defence reacts to where YOU actually put people rather than to some
   stored ideal. All five wear one colour, because as an offensive player you
   read the shape of a defence, not its individuals.

   Pure functions. They never touch the DOM, and they never touch the score:
   defenders are a reading layer, not a graded one.
   ========================================================================= */
const D_ON_BALL = 3.0;     // how tight the on-ball defender plays
const D_MIN_GAP = 3.6;     // closest an off-ball defender sits to his man
const D_MAX_GAP = 9.5;     // furthest he sags in help
const D_PER_FT  = .20;     // extra sag per foot of distance from the ball
const D_HOOP_BIAS = .58;   // ball-you-man: how much of the gap points at the rim

function unitVec(from, to){
  const dx = to[0]-from[0], dy = to[1]-from[1], m = Math.hypot(dx, dy);
  return m < 1e-6 ? [0,0] : [dx/m, dy/m];
}
/* One defender's steady-state position, on the ball-you-man line. */
function defenderPos(slot, spots, ballSlot, court){
  const man = spots[slot], hoop = [0, court.hoopY];
  if (slot === ballSlot){
    const u = unitVec(man, hoop);
    return clampCourt([man[0] + u[0]*D_ON_BALL, man[1] + u[1]*D_ON_BALL], court);
  }
  const ball = spots[ballSlot];
  const gap = Math.max(D_MIN_GAP, Math.min(D_MAX_GAP, D_MIN_GAP + dist(man, ball)*D_PER_FT));
  const uh = unitVec(man, hoop), ub = unitVec(man, ball);
  let vx = uh[0]*D_HOOP_BIAS + ub[0]*(1-D_HOOP_BIAS);
  let vy = uh[1]*D_HOOP_BIAS + ub[1]*(1-D_HOOP_BIAS);
  const m = Math.hypot(vx, vy) || 1;
  return clampCourt([man[0] + vx/m*gap, man[1] + vy/m*gap], court);
}
/* Nudge a defender clear of the others so a blown coverage is never rendered
   underneath the token that caused it. */
function separate(p, victim, spots, ballSlot, court, overrides){
  let out = [p[0], p[1]];
  for (let pass = 0; pass < 6; pass++){
    let moved = false;
    for (const s of SLOTS){
      if (s === victim) continue;
      const other = (overrides && overrides[s]) || defenderPos(s, spots, ballSlot, court);
      const dx = out[0]-other[0], dy = out[1]-other[1];
      const dd = Math.hypot(dx, dy);
      if (dd >= 3.0) continue;
      const u = dd < 1e-6 ? [0, 1] : [dx/dd, dy/dd];
      out = [ out[0] + u[0]*(3.0-dd), out[1] + u[1]*(3.0-dd) ];
      moved = true;
    }
    if (!moved) break;
  }
  return out;
}
function clampCourt(p, court){
  return [ Math.max(-court.width/2 + .6, Math.min(court.width/2 - .6, p[0])),
           Math.max(.6, Math.min(court.len - .6, p[1])) ];
}
/* How late a defender is to react. Being screened costs you the most; guarding
   the screener costs a little; everyone else is just half a step behind. */
function defenderLag(slot, beat){
  for (const a of (beat && beat.actions) || []){
    if (CONTACT_ACTIONS.has(a.type) && a.for === slot) return .55;
    if (CONTACT_ACTIONS.has(a.type) && a.by  === slot) return .28;
  }
  return .15;
}

const MISTAKE_LABEL = {
  caught:   'caught on the screen',
  switched: 'blown switch',
  overhelp: 'over-help',
  ballwatch:'ball-watching'
};
/* Which coverage errors this particular beat could plausibly produce. */
function mistakeOptions(beat, spots, ballSlot){
  const out = [];
  for (const a of (beat.actions || [])){
    if (a.type !== 'screen' || !a.for) continue;
    out.push({ type:'caught',   victim:a.for, by:a.by });
    out.push({ type:'switched', victim:a.for, by:a.by });
  }
  const away = SLOTS.filter(x => x !== ballSlot)
    .sort((a,b) => dist(spots[b], spots[ballSlot]) - dist(spots[a], spots[ballSlot]));
  if (away[0]) out.push({ type:'overhelp',  victim:away[0] });
  if (away[1]) out.push({ type:'ballwatch', victim:away[1] });
  return out;
}
/**
 * Apply one coverage error and report the window it opens.
 *
 * Returns an override map rather than a single position, because a real
 * breakdown moves more than one defender: when a man is screened, the
 * screener's defender is busy with the screener and is not there to help.
 * Without that second override the "mistake" could open no space at all.
 *
 * @returns {{type, victim, by, overrides, defender, space, where, text}}
 */
function applyMistake(opt, spots, ballSlot, court){
  const man = spots[opt.victim];
  const overrides = {};
  let d = defenderPos(opt.victim, spots, ballSlot, court);

  if (opt.type === 'caught' || opt.type === 'switched'){
    /* Stuck on the screen: he ends up on the far side of the screener from his
       man, which is both what happens and what keeps him visible. */
    const scr = spots[opt.by] || spots[ballSlot];
    const u = unitVec(man, scr);
    d = (u[0] === 0 && u[1] === 0)
      ? [d[0], d[1] + 4.6]
      : [scr[0] + u[0]*2.3, scr[1] + u[1]*2.3];
    if (opt.by && opt.by !== opt.victim){
      /* The screener's man is attached to his own man and therefore not
         available to help. Which side he is attached on is a free choice, so
         take the one that stays furthest from the victim rather than guessing
         a direction that might drift into the very window being opened. */
      const sp = spots[opt.by];
      const cands = [
        unitVec(sp, [0, court.hoopY]),   // goalside
        unitVec(man, sp),                // away from the victim
        unitVec(sp, spots[ballSlot])     // ballside
      ].filter(u => u[0] || u[1])
       .map(u => clampCourt([sp[0] + u[0]*2.4, sp[1] + u[1]*2.4], court));
      if (cands.length){
        overrides[opt.by] = cands.reduce((a, b) => dist(b, man) > dist(a, man) ? b : a);
      }
    }
  } else {
    /* Helped or ball-watched. Drifting at the ball is only an error if it
       actually leaves his man; when his clean position already sits between the
       man and the ball, moving ballward would CLOSE the gap, so the error that
       really happens is losing the man altogether. */
    const uBall = unitVec(d, spots[ballSlot]);
    const pull = opt.type === 'overhelp' ? 6.2 : 4.4;
    let cand = [d[0] + uBall[0]*pull, d[1] + uBall[1]*pull];
    if (dist(cand, man) <= dist(d, man) + .5){
      const uAway = unitVec(man, d);
      const vx = uAway[0]*.7 + uBall[0]*.3, vy = uAway[1]*.7 + uBall[1]*.3;
      const m = Math.hypot(vx, vy) || 1;
      cand = [d[0] + vx/m*pull, d[1] + vy/m*pull];
    }
    d = cand;
  }

  let beaten = clampCourt(separate(d, opt.victim, spots, ballSlot, court, overrides), court);
  /* Untangling defenders must never hand the beaten one back to his man — the
     separation pass pushes along an arbitrary axis and can undo the mistake. */
  const want = dist(d, man);
  if (dist(beaten, man) < want){
    const u = unitVec(man, beaten);
    if (u[0] || u[1]) beaten = clampCourt([man[0] + u[0]*want, man[1] + u[1]*want], court);
  }
  overrides[opt.victim] = beaten;

  /* The window is whatever the NEAREST remaining defender leaves, which is the
     same number shotQuality will use — the text and the shot cannot disagree. */
  const minTo = ov => {
    let m = Infinity;
    for (const sl of SLOTS) m = Math.min(m, dist(ov[sl] || defenderPos(sl, spots, ballSlot, court), man));
    return m;
  };
  /* Hard guarantee: a breakdown must never leave the victim TIGHTER than clean
     coverage did. Secondary overrides are a flourish; if one would close the
     window instead of opening it, drop it. */
  const cleanMin = minTo({});
  if (minTo(overrides) < cleanMin){
    for (const k of Object.keys(overrides)) if (+k !== opt.victim) delete overrides[k];
  }
  const space = Math.max(minTo(overrides), cleanMin);
  const where = nearestSpotName(man), who = opt.victim;
  const text = opt.type === 'caught'
      ? `X${who} got caught on ${opt.by}’s screen — ${who} has ${space.toFixed(1)} ft at the ${where}.`
    : opt.type === 'switched'
      ? `${opt.by} and ${who} switched late and nobody picked ${who} up — ${space.toFixed(1)} ft at the ${where}.`
    : opt.type === 'overhelp'
      ? `X${who} over-helped on the ball — ${who} is open by ${space.toFixed(1)} ft at the ${where}.`
      : `X${who} ball-watched — ${who} slipped to ${space.toFixed(1)} ft at the ${where}.`;
  return { type:opt.type, victim:who, by:opt.by, overrides,
           defender:overrides[who], space, where, text };
}
/* Name a point using the same vocabulary Floor General calls use. */
function nearestSpotName(p){
  let best = 'floor', bd = Infinity;
  for (const key of SPOT_KEYS){
    for (const sg of (SIDED.has(key) ? [-1,1] : [1])){
      const t = SPOT_MAP[key](sg);
      const d = dist(t, p);
      if (d < bd){ bd = d; best = (SIDED.has(key) ? (sg < 0 ? 'left ' : 'right ') : '') + key; }
    }
  }
  return best;
}
/**
 * The whole defence for one frame.
 * @param spots  current offensive positions
 * @param prev   positions at the start of the move (for reaction lag), or null
 * @param t      tween progress 0..1
 */
function buildDefence(spots, prev, t, beat, ballSlot, court, mistake){
  const lagged = {};
  for (const s of SLOTS){
    if (!prev || t >= 1){ lagged[s] = spots[s]; continue; }
    const lag = defenderLag(s, beat);
    const ts = clamp01((t - lag) / (1 - lag));
    lagged[s] = [ lerp(prev[s][0], spots[s][0], ts), lerp(prev[s][1], spots[s][1], ts) ];
  }
  const out = {};
  for (const s of SLOTS) out[s] = defenderPos(s, lagged, ballSlot, court);
  if (mistake){
    const ov = mistake.overrides || { [mistake.victim]: mistake.defender };
    for (const k of Object.keys(ov)) out[+k] = ov[k];
  }
  return out;
}


/* =================================================================== SHOT ==
   Finishing the possession. Shot quality is the only honest way to grade a
   shot: distance decides the zone, the nearest defender decides the contest,
   and the two together give an expected-points figure. That number is the
   lesson — a wide-open three is worth more than a contested twelve-footer,
   and the defenders/mistake layer exists to manufacture exactly that choice.

   Pure functions. They read no app state and touch no DOM.
   ========================================================================= */
function isThree(p, court){
  const x = cornerX(court), by = breakY(court);
  if (court.straightCorner && p[1] <= by) return Math.abs(p[0]) >= x;
  return dist(p, [0, court.hoopY]) >= court.arc3;
}
const ZONE = {
  rim:   { base:.63, pts:2, name:'layup' },
  paint: { base:.46, pts:2, name:'floater' },
  mid:   { base:.41, pts:2, name:'jumper' },
  three: { base:.37, pts:3, name:'three' },
  deep:  { base:.32, pts:3, name:'deep three' }
};
function shotZone(p, court){
  const d = dist(p, [0, court.hoopY]);
  if (isThree(p, court)) return d > court.arc3 + 4 ? 'deep' : 'three';
  if (d <= 4)  return 'rim';
  if (d <= 10) return 'paint';
  return 'mid';
}
/* Every foot of separation matters, so the contest is continuous rather than
   bucketed; the label is only there to say it in words. */
function contestMult(openFt){
  return Math.max(.58, Math.min(1.12, .58 + openFt * .085));
}
function contestLabel(openFt){
  return openFt < 2 ? 'heavily contested' : openFt < 4 ? 'contested'
       : openFt < 6 ? 'open' : 'wide open';
}
function shotVerdict(exp){
  return exp >= 1.15 ? 'The best shot on the floor.'
       : exp >= 1.00 ? 'A good shot — take it every time.'
       : exp >= .85  ? 'Acceptable.'
       : exp >= .70  ? 'Only late in the clock.'
                     : 'A bad shot. Keep the ball moving.';
}
/**
 * @param shooter slot taking it
 * @param spots   offensive positions
 * @param defenders  derived defence, or null for an uncontested drill
 * @returns {{zone,name,dist,openFt,contest,pct,pts,expected,verdict}}
 */
function shotQuality(shooter, spots, defenders, court){
  const p = spots[shooter];
  const zone = shotZone(p, court);
  const z = ZONE[zone];
  let openFt = 99;
  if (defenders) for (const s of SLOTS) openFt = Math.min(openFt, dist(p, defenders[s]));
  if (!isFinite(openFt)) openFt = 99;
  const mult = contestMult(openFt);
  const pct = Math.max(.05, Math.min(.95, z.base * mult));
  const expected = pct * z.pts;
  return { zone, name:z.name, dist:dist(p, [0, court.hoopY]), openFt,
           contest:contestLabel(openFt), pct, pts:z.pts, expected,
           verdict:shotVerdict(expected) };
}

const SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in (attrs||{})) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  return n;
}
/* A real basketball, face on. The recognisable pattern is the equator, the
   meridian, and two seams that BOW between opposite points on the rim — not
   four lines converging on the poles, which reads as a globe. */
function ballGlyph(cx, cy, r){
  const g = svg('g', { filter:'url(#tokShadow)' });
  const ink = '#3d1e08';
  g.appendChild(svg('circle', { cx, cy, r, fill:'url(#ballSkin)', stroke:ink, 'stroke-width':r*.10 }));
  const seams = svg('g', { fill:'none', stroke:ink, 'stroke-width':r*.115, 'stroke-linecap':'round' });
  seams.appendChild(svg('path', { d:`M ${cx-r} ${cy} H ${cx+r}` }));   // equator
  seams.appendChild(svg('path', { d:`M ${cx} ${cy-r} V ${cy+r}` }));   // meridian
  /* Both endpoints sit on the rim: 0.835^2 + 0.55^2 = 1. Kept well clear of the
     equator, or the three lines bundle together in the middle. */
  const ex = r*.835, ey = r*.55, bow = r*.15;
  seams.appendChild(svg('path', { d:`M ${cx-ex} ${cy-ey} Q ${cx} ${cy+bow} ${cx+ex} ${cy-ey}` }));
  seams.appendChild(svg('path', { d:`M ${cx-ex} ${cy+ey} Q ${cx} ${cy-bow} ${cx+ex} ${cy+ey}` }));
  g.appendChild(seams);
  /* a soft specular so it reads as a sphere rather than a disc */
  g.appendChild(svg('ellipse', { cx:cx - r*.33, cy:cy - r*.44, rx:r*.30, ry:r*.19,
    fill:'#fff', opacity:.28, transform:`rotate(-30 ${cx - r*.33} ${cy - r*.44})` }));
  return g;
}

function courtPath3pt(c){
  const x = cornerX(c), by = breakY(c), r = c.arc3;
  if (!c.straightCorner) return `M ${-x} 0 A ${r} ${r} 0 0 0 ${x} 0`;
  return `M ${-x} 0 L ${-x} ${by} A ${r} ${r} 0 0 0 ${x} ${by} L ${x} 0`;
}
function buildCourtGroup(c){
  const g = svg('g'), L = 'var(--c-line)', hw = c.width/2;
  const add = (t,a)=>{ g.appendChild(svg(t,a)); };
  add('rect', { x:-hw, y:0, width:c.width, height:c.len, fill:'var(--c-floor)' });
  add('rect', { x:-hw, y:0, width:c.width, height:c.len, fill:'url(#floorGlow)' });
  add('rect', { x:-hw, y:0, width:c.width, height:c.len, fill:'none', stroke:L, 'stroke-width':.35 });
  add('rect', { x:-c.paintHalf, y:0, width:c.paintHalf*2, height:c.ftY, fill:'var(--c-paint)', stroke:L, 'stroke-width':.28 });
  // free-throw circle: solid away from the basket, dashed through the paint
  add('path', { d:`M ${-c.ftR} ${c.ftY} A ${c.ftR} ${c.ftR} 0 0 0 ${c.ftR} ${c.ftY}`, fill:'none', stroke:L, 'stroke-width':.28 });
  add('path', { d:`M ${-c.ftR} ${c.ftY} A ${c.ftR} ${c.ftR} 0 0 1 ${c.ftR} ${c.ftY}`, fill:'none', stroke:L, 'stroke-width':.24, 'stroke-dasharray':'1.1 .9' });
  if (c.raR > 0) add('path', { d:`M ${-c.raR} ${c.hoopY} A ${c.raR} ${c.raR} 0 0 0 ${c.raR} ${c.hoopY}`, fill:'none', stroke:L, 'stroke-width':.22, opacity:.75 });
  add('path', { d:courtPath3pt(c), fill:'none', stroke:'var(--c-arc)', 'stroke-width':.34 });
  add('path', { d:`M -6 ${c.len} A 6 6 0 0 1 6 ${c.len}`, fill:'none', stroke:L, 'stroke-width':.28 });
  add('line', { x1:-c.bbHalf, y1:c.bbY, x2:c.bbHalf, y2:c.bbY, stroke:L, 'stroke-width':.42, 'stroke-linecap':'round' });
  add('circle', { cx:0, cy:c.hoopY, r:c.rimR, fill:'none', stroke:'var(--c-arc)', 'stroke-width':.3 });
  return g;
}


/* =============================================================================
   v2 APPLICATION LAYER
   ---------------------------------------------------------------------------
   Everything above this line is the engine: court geometry, the four built-in
   plays, grading, the point-guard call system, the defence model and the shot
   model. It is unchanged from v1 and has three hundred checks behind it.

   Everything below is new. The rules it is built on:

     1. NOTHING YOU MAKE IS EVER LOST. Plays save themselves on every change.
        There is no Save button to forget, and undo/redo cover every edit.
     2. A PLAY YOU MAKE CAN NEVER BE SHADOWED BY A BUILT-IN ONE. v1 let an edited
        copy keep the built-in's id, so the app silently showed you the original
        instead of your work. Built-ins are read-only; editing one makes a copy
        with its own id, and a migration on load rescues plays hit by the old bug.
     3. OBJECT FIRST, THEN ACTION. You pick a play, then choose to watch,
        practise or edit it. No modes to understand up front.
     4. SAY WHAT THINGS MEAN WHERE THEY ARE CHOSEN, not in a help page.
   ========================================================================== */

const clampN = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
/* e.target is the document for synthetic key events, and Document has no
   closest(), so every keyboard handler goes through this. */
function inField(e){
  const t = e && e.target;
  return !!(t && typeof t.closest === 'function' && t.closest('input,textarea,select,[contenteditable]'));
}

/* ===================================================================== STORE */
const K_PLAYS = 'hoops.plays.v1', K_HIST = 'hoops.history.v1',
      K_SET = 'hoops.settings.v1', K_FLAGS = 'hoops.flags.v1';
const HIST_CAP = 200;
const SIDE_DEFAULT = 380, SIDE_MIN = 300, SIDE_MAX = 640;
const MAX_STEPS = 12, MAX_MOVES = 3;
const BUILTIN_IDS = new Set(BUILTIN.map(p => p.id));
const isBuiltin = id => BUILTIN_IDS.has(id);
/* Ids deleted this session. The editor flushes on the way out; without this it
   would write a play straight back after you deleted it from its own menu. */
const DELETED = new Set();

const Store = {
  /* false after any write the browser refused — surfaced in the editor so a
     failed save is never silent */
  ok: true,
  _get(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      const v = JSON.parse(raw);
      return v == null ? fallback : v;
    }catch(e){ return fallback; }
  },
  _set(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); this.ok = true; return true; }
    catch(e){ this.ok = false; return false; }
  },
  plays(){
    const v = this._get(K_PLAYS, []);
    return Array.isArray(v)
      ? v.filter(p => p && typeof p === 'object' && typeof p.id === 'string' && Array.isArray(p.beats) && p.beats.length)
      : [];
  },
  get(id){ return this.plays().find(p => p.id === id) || null; },
  /** Validate and upsert. A built-in id is never written: it gets a new one. */
  put(play){
    const clean = validatePlay(play);
    clean.id = (typeof play.id === 'string' && play.id && !isBuiltin(play.id)) ? play.id.slice(0,64) : uid('play');
    clean.updated = Date.now();
    const all = this.plays();
    const i = all.findIndex(p => p.id === clean.id);
    if (i >= 0) all[i] = clean; else all.push(clean);
    return this._set(K_PLAYS, all) ? clean : null;
  },
  remove(id){ return this._set(K_PLAYS, this.plays().filter(p => p.id !== id)); },

  history(){ const v = this._get(K_HIST, []); return Array.isArray(v) ? v : []; },
  addHistory(rec){ const all = this.history(); all.unshift(rec); return this._set(K_HIST, all.slice(0, HIST_CAP)); },
  bestFor(playId){
    let best = null;
    for (const h of this.history()) if (h.playId === playId && (best === null || h.score > best)) best = h.score;
    return best;
  },

  settings(){
    const d = { appearance:'dark', court:'hardwood', render:'flat', spec:'nba', hints:'standard',
                defence:false, side:SIDE_DEFAULT, colors:Object.assign({}, DEFAULT_COLORS) };
    const v = this._get(K_SET, {});
    const out = Object.assign(d, (v && typeof v === 'object') ? v : {});
    /* v1 stored defence as 'off' | 'on' | 'mistakes' */
    out.defence = out.defence === true || out.defence === 'on' || out.defence === 'mistakes';
    out.colors = Object.assign({}, DEFAULT_COLORS, (out.colors && typeof out.colors === 'object') ? out.colors : {});
    if (!['guided','standard','blind'].includes(out.hints)) out.hints = 'standard';
    if (!COURTS[out.spec]) out.spec = 'nba';
    return out;
  },
  saveSettings(s){ return this._set(K_SET, s); },

  flags(){ const v = this._get(K_FLAGS, {}); return (v && typeof v === 'object') ? v : {}; },
  setFlag(k, v){ const f = this.flags(); f[k] = v; return this._set(K_FLAGS, f); },

  /**
   * Repair plays written by v1's id-collision bug. v1 let "edit" keep a
   * built-in's id, so a saved play was shadowed by the original and looked
   * lost. Any stored play whose id is a built-in's, or repeats another stored
   * play's, gets a fresh id; a name identical to a built-in's gets "My" in front
   * so the two can be told apart. Returns the names it rescued.
   */
  migrate(){
    const all = this.plays();
    const builtinNames = new Set(BUILTIN.map(p => p.name));
    const seen = new Set(), rescued = [];
    let changed = false;
    for (const p of all){
      if (isBuiltin(p.id) || seen.has(p.id)){
        p.id = uid('play');
        if (builtinNames.has(p.name)) p.name = 'My ' + p.name;
        rescued.push(p.name);
        changed = true;
      }
      seen.add(p.id);
    }
    if (changed) this._set(K_PLAYS, all);
    return rescued;
  }
};

function allPlays(){ return Store.plays().concat(BUILTIN); }
/* Your plays are looked up FIRST. Ids can no longer collide, but if one ever
   did, your own work must win over a built-in — never the other way round. */
function findPlay(id){ return Store.get(id) || BUILTIN.find(p => p.id === id) || null; }
