/* ================================================================ WATCH/PLAY */
function screenPlay(root, play){
  const own = !isBuiltin(play.id);
  const moreBtn = btn('', { cls:'icon', icon:'more', aria:'More' });
  moreBtn.addEventListener('click', () => menu(moreBtn, screenMoreItems(play)));
  root.appendChild(topBar({
    back:['Playbook', '/'], title:play.name,
    actions:[
      btn('Practise', { cls:'pri', icon:'target', onclick:()=>go('/practice/' + encodeURIComponent(play.id)) }),
      own ? btn('Edit', { icon:'edit', onclick:()=>go('/edit/' + encodeURIComponent(play.id)) })
          : btn('Make my copy', { icon:'copy', title:'Built-in plays stay as they are; this gives you one to change', onclick:()=>copyPlay(play) }),
      moreBtn
    ]
  }));
  const W = workspace(root);
  let step = 0, anim = null, mistakeOpt = null;

  function frameState(){
    const b = play.beats[step];
    const f = anim ? anim.frame : { spots:b.spots, ball:b.ball, prev:null, t:1 };
    const st = { spots:f.spots, ballPos:ballOffset(f.spots, f.ball), highlight:b.keyPlayers || [],
                 marks: anim ? [] : stepMarks(play, step) };
    if (App.settings.defence){
      const mis = mistakeOpt ? applyMistake(mistakeOpt, f.spots, f.ball, App.court) : null;
      st.defenders = buildDefence(f.spots, f.prev, f.t, b, f.ball, App.court, mis);
      st.mistake = mis;
    }
    return st;
  }
  const draw = () => W.R.draw(frameState());
  W.onRedraw = draw;

  function stopAnim(){ if (anim && anim.raf) cancelAnimationFrame(anim.raf); anim = null; }
  function animate(){
    stopAnim();
    if (play.beats.length < 2) return;
    const from = step >= play.beats.length - 1 ? 0 : step;
    const dwell = 520, travel = 950, span = dwell + travel, n = play.beats.length - 1 - from;
    const total = span * n + dwell, t0 = performance.now();
    const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
    anim = { frame:null, raf:0 };
    const tick = now => {
      if (!anim) return;
      const el_ = clampN(now - t0, 0, total);
      const k = clampN(Math.floor(el_ / span), 0, n - 1);
      const within = el_ - k*span;
      const t = within <= dwell ? 0 : ease(clamp01((within - dwell) / travel));
      const a = play.beats[from+k], b = play.beats[from+k+1], spots = {};
      for (const s of SLOTS) spots[s] = [lerp(a.spots[s][0], b.spots[s][0], t), lerp(a.spots[s][1], b.spots[s][1], t)];
      anim.frame = { spots, ball: t < .5 ? a.ball : b.ball, prev:a.spots, t };
      const shown = t < .5 ? from+k : from+k+1;
      if (shown !== step){ step = shown; paintSide(); }
      draw();
      if (el_ < total) anim.raf = requestAnimationFrame(tick);
      else { stopAnim(); step = play.beats.length - 1; paintSide(); paintUnder(); draw(); }
    };
    anim.raf = requestAnimationFrame(tick);
    paintUnder();
  }

  function paintUnder(){
    const u = clear(W.under);
    u.appendChild(btn('', { cls:'icon', icon:'prev', aria:'Previous step', disabled:step === 0,
      onclick:()=>{ stopAnim(); mistakeOpt = null; step = Math.max(0, step-1); paintAll(); } }));
    u.appendChild(anim
      ? btn('Pause', { cls:'pri', icon:'pause', onclick:()=>{ stopAnim(); paintAll(); } })
      : btn(step >= play.beats.length-1 && play.beats.length > 1 ? 'Replay' : 'Play', { cls:'pri', icon:'play',
          disabled:play.beats.length < 2, onclick:()=>{ mistakeOpt = null; animate(); } }));
    u.appendChild(btn('', { cls:'icon', icon:'next', aria:'Next step', disabled:step >= play.beats.length-1,
      onclick:()=>{ stopAnim(); mistakeOpt = null; step = Math.min(play.beats.length-1, step+1); paintAll(); } }));
    u.appendChild(el('span', { class:'help', text:`Step ${step+1} of ${play.beats.length}` }));
    u.appendChild(el('div', { class:'sp' }));
    u.appendChild(sw('Show defenders', App.settings.defence, v => { App.settings.defence = v; mistakeOpt = null; saveSettings(); paintAll(); }));
    if (App.settings.defence) u.appendChild(btn(mistakeOpt ? 'Reset defence' : 'Force a defensive mistake', { cls:'sm',
      onclick:()=>{
        if (mistakeOpt){ mistakeOpt = null; }
        else {
          const b = play.beats[step];
          const opts = mistakeOptions(b, b.spots, b.ball);
          mistakeOpt = opts.length ? opts[Math.floor(Math.random()*opts.length)] : null;
          if (!mistakeOpt) toast('No defensive mistake fits this step.');
        }
        paintAll();
      } }));
  }

  function paintSide(){
    const s = clear(W.side), b = play.beats[step];
    if (play.blurb){
      const bl = el('div', { class:'block' });
      bl.appendChild(coachNode(play.blurb, !own, 'lead'));
      s.appendChild(bl);
    }
    const sl = el('div', { class:'block' });
    sl.appendChild(el('div', { class:'label', text:`Steps · ${play.beats.length}` }));
    const list = el('div', { class:'steps' });
    play.beats.forEach((bb, i) => {
      const r = el('button', { class:'stepbtn', type:'button', 'aria-current':String(i === step),
        onclick:()=>{ stopAnim(); mistakeOpt = null; step = i; paintAll(); } });
      r.appendChild(el('span', { class:'n', text:String(i+1) }));
      r.appendChild(el('span', { class:'t', text:bb.label || 'Step ' + (i+1) }));
      list.appendChild(r);
    });
    sl.appendChild(list);
    s.appendChild(sl);

    if (mistakeOpt){
      const mis = applyMistake(mistakeOpt, b.spots, b.ball, App.court);
      const mb = el('div', { class:'block' });
      mb.appendChild(el('div', { class:'label', text:'Defensive mistake' }));
      mb.appendChild(el('div', { class:'mistake', text:mis.text }));
      s.appendChild(mb);
    }

    const cur = el('div', { class:'block' });
    cur.appendChild(el('div', { class:'label', text:`Step ${step+1} — ${b.label || 'untitled'}` }));
    if (b.coaching) cur.appendChild(coachNode(b.coaching, !own));
    else cur.appendChild(el('p', { class:'help', text:'No coaching note for this step.' }));
    if ((b.actions || []).length){
      const mv = el('div', { class:'moves' });
      for (const a of b.actions) mv.appendChild(moveRow(a));
      cur.appendChild(mv);
    }
    if (b.mistake){
      const m = el('div', { class:'mistake' });
      m.appendChild(el('b', { text:'Common mistake' }));
      m.appendChild(document.createTextNode(own ? b.mistake : stripTags(b.mistake)));
      cur.appendChild(m);
    }
    s.appendChild(cur);

    const how = el('div', { class:'block' });
    how.appendChild(el('div', { class:'label', text:'Reading the diagram' }));
    how.appendChild(el('p', { class:'help', text:'Solid arrow — a player moves. Zig-zag — the ball is dribbled. Dashed line — a pass. T-bar — a screen.' }));
    const lk = el('button', { class:'lnk', type:'button', text:'What do these basketball words mean?', onclick:openGlossary });
    how.appendChild(lk);
    s.appendChild(how);
  }
  function paintAll(){ paintUnder(); paintSide(); draw(); }
  paintAll();

  const key = e => {
    if (inField(e) || document.querySelector('.scrim')) return;
    if (e.key === 'ArrowRight'){ stopAnim(); step = Math.min(play.beats.length-1, step+1); mistakeOpt = null; paintAll(); }
    if (e.key === 'ArrowLeft'){ stopAnim(); step = Math.max(0, step-1); mistakeOpt = null; paintAll(); }
    if (e.key === ' '){ e.preventDefault(); if (anim){ stopAnim(); paintAll(); } else animate(); }
  };
  document.addEventListener('keydown', key);
  return { destroy(){ stopAnim(); document.removeEventListener('keydown', key); W.destroy(); },
           redraw:paintAll, get step(){ return step; } };
}
function moveRow(a, onremove){
  const r = el('div', { class:'move' });
  const ic = el('span', { class:'ic' }); ic.appendChild(icon(a.type));
  r.appendChild(ic);
  const tx = el('div', { class:'tx' });
  tx.appendChild(el('b', { text:moveSentence(a) }));
  if (a.type !== 'none') tx.appendChild(el('span', { text:ACTION_SHORT[a.type] || '' }));
  r.appendChild(tx);
  if (onremove) r.appendChild(btn('', { cls:'ghost sm icon', icon:'x', aria:'Remove this move', onclick:onremove }));
  return r;
}

/* ============================================================ MOVE PICKER */
/* Choosing a move is choosing from cards that SAY what each one means, then
   tapping who does it. Never three dropdowns in a row. */
/* Who most plausibly does a given move on this step, from the geometry. The
   picker opens on these, so the common case is one tap, not three. */
function guessMove(type, spots, ball, selected, prevActs){
  const others = SLOTS.filter(n => n !== ball);
  const nearest = (to, pool) => pool.slice().sort((a, b) => dist(spots[a], spots[to]) - dist(spots[b], spots[to]))[0];
  const screener = (prevActs || []).find(a => a.type === 'screen');
  switch (type){
    case 'screen':
      if (selected && selected !== ball) return { by:selected, for:ball };
      return { by:nearest(ball, others), for:ball };
    case 'pass': case 'handoff':
      return { by:ball, for: selected && selected !== ball ? selected : nearest(ball, others) };
    case 'roll': case 'pop':
      return { by: selected || (screener ? screener.by : nearest(ball, others)) };
    case 'dribble':
      return { by:ball };
    case 'clearout': case 'lift': case 'flare': case 'curl': case 'cut':
      return { by: selected && selected !== ball ? selected : others[0] };
    default:
      return { by: selected || ball };
  }
}
function pickMove(opts){
  const cur = Object.assign({ type:null, by:opts.by || 1, for:null }, opts.initial || {});
  const ctx = opts.context || null;   // { spots, ball, selected, prevActs }
  const s = sheet({ title:opts.title || 'Add a move', sub:'What happens on this step? Tap a move — each one says what it means.', wide:true });
  const types = ACTION_TYPES.filter(a => opts.allowNone || a.id !== 'none');
  const cards = el('div', { class:'acards' });
  const who = el('div', { class:'pickrow' });
  const forr = el('div', { class:'pickrow' });
  const sentence = el('div', { class:'sentence' });
  const add = btn(opts.okLabel || 'Add move', { cls:'pri', icon:'check', disabled:true });

  function paint(){
    clear(cards);
    for (const a of types){
      const c = el('button', { class:'acard', type:'button', 'aria-pressed':String(cur.type === a.id),
        onclick:()=>{
          cur.type = a.id;
          if (ctx){ const g = guessMove(a.id, ctx.spots, ctx.ball, ctx.selected, ctx.prevActs); cur.by = g.by; if (g.for) cur.for = g.for; }
          if (ACTION_NEEDS_FOR.has(a.id) && (!cur.for || cur.for === cur.by)) cur.for = SLOTS.find(n => n !== cur.by);
          paint();
          /* bring "who does it" into view once a move is picked */
          setTimeout(() => { try{ who.scrollIntoView({ block:'nearest', behavior:'smooth' }); }catch(e){} }, 20);
        } });
      const ic = el('span', { class:'ic' }); ic.appendChild(icon(a.id));
      c.appendChild(ic);
      const tx = el('div');
      tx.appendChild(el('b', { text:a.label }));
      tx.appendChild(el('span', { text:a.short }));
      c.appendChild(tx);
      cards.appendChild(c);
    }
    clear(who);
    const needsWho = cur.type && cur.type !== 'none';
    if (needsWho){
      who.appendChild(el('div', { class:'label', text: ACTION_NEEDS_FOR.has(cur.type) ? 'Who does it?' : 'Who?' }));
      who.appendChild(playerPicker(cur.by, n => { cur.by = n; if (cur.for === n) cur.for = SLOTS.find(k => k !== n); paint(); }));
    }
    clear(forr);
    if (cur.type && ACTION_NEEDS_FOR.has(cur.type)){
      forr.appendChild(el('div', { class:'label', text: cur.type === 'screen' ? 'Who is the screen for?' : 'To whom?' }));
      forr.appendChild(playerPicker(cur.for, n => { cur.for = n; paint(); }, [cur.by]));
    }
    clear(sentence);
    if (cur.type){
      sentence.appendChild(el('div', { text:moveSentence(cur) }));
      sentence.appendChild(el('div', { style:'font-weight:500;font-size:13.5px;color:var(--ink-2);margin-top:4px',
        text:(ACTION_TYPES.find(a => a.id === cur.type) || {}).help || '' }));
    } else sentence.appendChild(el('div', { text:'Tap a move above.' }));
    add.disabled = !cur.type || (ACTION_NEEDS_FOR.has(cur.type) && !cur.for);
  }
  s.body.appendChild(cards);
  s.body.appendChild(who);
  s.body.appendChild(forr);
  s.body.appendChild(sentence);
  const lk = el('button', { class:'lnk', type:'button', text:'See every basketball term', style:'margin-top:12px',
    onclick:openGlossary });
  s.body.appendChild(lk);
  s.foot.appendChild(btn('Cancel', { onclick:()=>s.close() }));
  add.addEventListener('click', () => {
    const out = { type:cur.type };
    if (cur.type !== 'none'){ out.by = cur.by; if (ACTION_NEEDS_FOR.has(cur.type)) out.for = cur.for; }
    s.close();
    opts.onDone(out);
  });
  s.foot.appendChild(add);
  paint();
  return s;
}
function playerPicker(value, onpick, exclude, only){
  const w = el('div', { class:'players', role:'group' });
  for (const n of (only || SLOTS)){
    if (exclude && exclude.includes(n)) continue;
    const c = slotColors()[n];
    const b = el('button', { class:'pbtn', type:'button', 'aria-pressed':String(value === n),
      title:`${n} — ${SLOT_NAME[n]}`, text:String(n), onclick:()=>onpick(n) });
    b.style.background = c; b.style.color = readableInk(c);
    w.appendChild(b);
  }
  return w;
}

/* ================================================================== EDITOR */
function screenEdit(root, stored){
  /* The live play. Every change goes through commit(), which records undo,
     marks the play dirty and schedules a save. Nothing touches `play` except
     through commit(), so nothing can change without being saved. */
  let play = JSON.parse(JSON.stringify(stored));
  play.beats.forEach(b => { b.actions = b.actions || []; });
  let step = 0, selected = null;
  const undo = [], redo = [];
  let saveTimer = 0, saveState = 'saved', lastGroup = null, groupAt = 0;

  const nameIn = el('input', { class:'title-input', type:'text', maxlength:'80', value:play.name,
    'aria-label':'Play name', placeholder:'Name this play' });
  const status = el('span', { class:'save', role:'status', 'aria-live':'polite' });
  status.appendChild(el('span', { class:'dot' }));
  const statusText = el('span', { text:'Saved' });
  status.appendChild(statusText);
  const titleWrap = el('div', { style:'display:flex;align-items:center;gap:10px;min-width:0' });
  titleWrap.appendChild(nameIn);
  titleWrap.appendChild(status);
  const moreBtn = btn('', { cls:'icon', icon:'more', aria:'More' });
  moreBtn.addEventListener('click', () => menu(moreBtn, [
    { label:'Share link', icon:'share', run:()=>{ flush(); shareSheet(play); } },
    { label:'Export file', icon:'download', run:()=>{ flush(); exportPlay(play); } },
    { label:'Duplicate', icon:'copy', run:()=>{ flush(); copyPlay(play); } },
    '-',
    { label:'Basketball terms', icon:'book', run:openGlossary },
    { label:'Settings', icon:'sliders', run:openSettings },
    '-',
    { label:'Delete play', icon:'trash', danger:true, run:()=>{ flush(); deletePlay(play); } }
  ]));
  root.appendChild(topBar({ back:['Playbook', '/'], titleNode:titleWrap, actions:[
    btn('Preview', { icon:'play', title:'Watch it run', onclick:preview }),
    btn('Practise', { cls:'pri', icon:'target', onclick:()=>{ flush(); go('/practice/' + encodeURIComponent(play.id)); } }),
    moreBtn
  ]}));

  const W = workspace(root);

  function setStatus(s){
    saveState = s;
    status.className = 'save' + (s === 'saving' ? ' saving' : s === 'error' ? ' error' : '');
    statusText.textContent = s === 'saving' ? 'Saving…' : s === 'error' ? 'Not saved — export it!' : 'Saved';
    status.title = s === 'error' ? 'This browser refused to store the play. Use ⋯ → Export file to keep it.' : 'Saved to this browser automatically';
  }
  function flush(){
    clearTimeout(saveTimer);
    if (DELETED.has(play.id)) return true;
    if (saveState === 'saved') return true;
    const out = Store.put(play);
    if (out){ play.id = out.id; setStatus('saved'); return true; }
    setStatus('error');
    return false;
  }
  function scheduleSave(){
    setStatus('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 280);
  }
  /**
   * The only way to change the play. `group` coalesces a burst (typing in one
   * field, one drag) into a single undo step.
   */
  function commit(mutate, group){
    const now = Date.now();
    if (!group || group !== lastGroup || now - groupAt > 900){
      undo.push(JSON.stringify({ play, step }));
      if (undo.length > 120) undo.shift();
      redo.length = 0;
    }
    lastGroup = group || null; groupAt = now;
    mutate();
    scheduleSave();
  }
  function restore(snap){
    const o = JSON.parse(snap);
    play = o.play; step = clampN(o.step, 0, play.beats.length - 1);
    nameIn.value = play.name;
    selected = null;
    scheduleSave();
    paintAll();
  }
  function doUndo(){ if (!undo.length) return; redo.push(JSON.stringify({ play, step })); restore(undo.pop()); lastGroup = null; }
  function doRedo(){ if (!redo.length) return; undo.push(JSON.stringify({ play, step })); restore(redo.pop()); lastGroup = null; }

  nameIn.addEventListener('input', () => commit(() => { play.name = nameIn.value; }, 'name'));
  nameIn.addEventListener('blur', () => { if (!nameIn.value.trim()) commit(() => { play.name = 'Untitled play'; nameIn.value = play.name; }); });

  /* ------------------------------------------------------------- the court */
  let previewAnim = null;
  function courtState(){
    const b = play.beats[step];
    if (previewAnim) return { spots:previewAnim.spots, ballPos:ballOffset(previewAnim.spots, previewAnim.ball) };
    return {
      spots:b.spots, ballPos:ballOffset(b.spots, b.ball), selected,
      ghosts: step > 0 ? play.beats[step-1].spots : null,
      marks: stepMarks(play, step)
    };
  }
  const draw = () => W.R.draw(courtState());
  W.onRedraw = draw;

  let drag = null;
  W.court.addEventListener('pointerdown', e => {
    if (previewAnim) return;
    const id = W.R.hitTest(e.clientX, e.clientY);
    if (id === null){ if (selected !== null){ selected = null; paintSide(); draw(); } return; }
    const [fx, fy] = W.R.toCourt(e.clientX, e.clientY);
    const b = play.beats[step];
    const cur = id === 'ball' ? ballOffset(b.spots, b.ball) : b.spots[id];
    drag = { id, dx:cur[0]-fx, dy:cur[1]-fy, moved:false, start:[fx, fy], ballAt:null, t0:Date.now() };
    try{ W.court.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  W.court.addEventListener('pointermove', e => {
    if (!drag) return;
    const [fx, fy] = W.R.toCourt(e.clientX, e.clientY);
    if (!drag.moved && Math.hypot(fx-drag.start[0], fy-drag.start[1]) < .5) return;
    const c = App.court;
    const x = clampN(fx + drag.dx, -c.width/2 + .6, c.width/2 - .6);
    const y = clampN(fy + drag.dy, .6, c.len - .6);
    if (!drag.moved){ drag.moved = true; }
    if (drag.id === 'ball'){
      drag.ballAt = [x, y];
      W.R.draw(Object.assign(courtState(), { ballPos:[x, y] }));
    } else {
      commit(() => { play.beats[step].spots[drag.id] = [x, y]; }, 'drag-' + drag.id + '-' + drag.t0);
      draw();
    }
  });
  const endDrag = e => {
    if (!drag) return;
    const d = drag; drag = null;
    try{ W.court.releasePointerCapture(e.pointerId); }catch(err){}
    if (!d.moved){
      if (d.id !== 'ball'){ selected = selected === d.id ? null : d.id; paintSide(); draw(); }
      return;
    }
    if (d.id === 'ball' && d.ballAt){
      const n = nearestSlot(play.beats[step].spots, d.ballAt, 6);
      if (n && n !== play.beats[step].ball) commit(() => { play.beats[step].ball = n; });
    }
    lastGroup = null;
    /* the strip carries Undo/Redo, so it has to be repainted or they stay grey */
    paintAll();
  };
  W.court.addEventListener('pointerup', endDrag);
  W.court.addEventListener('pointercancel', endDrag);

  /* --------------------------------------------------------- the filmstrip */
  function paintUnder(){
    const u = clear(W.under);
    const strip = el('div', { class:'strip', role:'tablist', 'aria-label':'Steps' });
    play.beats.forEach((b, i) => {
      const c = el('button', { class:'chip', type:'button', role:'tab', 'aria-current':String(i === step),
        title:b.label || 'Step ' + (i+1), onclick:()=>{ step = i; selected = null; paintAll(); } });
      c.appendChild(el('span', { class:'n', text:String(i+1) }));
      c.appendChild(el('span', { class:'t', text:b.label || 'Step ' + (i+1) }));
      strip.appendChild(c);
    });
    const add = el('button', { class:'addstep', type:'button', disabled:play.beats.length >= MAX_STEPS,
      title:'Copies where everyone is now, so you only move who moves', onclick:addStep });
    add.appendChild(icon('plus'));
    add.appendChild(el('span', { text: play.beats.length >= MAX_STEPS ? `${MAX_STEPS} steps max` : 'Add next step' }));
    strip.appendChild(add);
    u.appendChild(strip);
    u.appendChild(btn('', { cls:'icon', icon:'undo', aria:'Undo', title:'Undo (Ctrl+Z)', disabled:!undo.length, onclick:doUndo }));
    u.appendChild(btn('', { cls:'icon', icon:'redo', aria:'Redo', title:'Redo (Ctrl+Y)', disabled:!redo.length, onclick:doRedo }));
  }
  function addStep(){
    if (play.beats.length >= MAX_STEPS) return;
    const src = play.beats[step];
    commit(() => {
      play.beats.splice(step + 1, 0, { label:'', ball:src.ball, spots:cloneSpots(src.spots), actions:[], coaching:'', mistake:'' });
      step++;
    });
    selected = null;
    paintAll();
    toast(`Step ${step+1} added — now drag whoever moves.`);
  }

  /* ------------------------------------------------------- the side panel */
  function paintSide(){
    const s = clear(W.side), b = play.beats[step];

    const hd = el('div', { class:'block' });
    const hr = el('div', { style:'display:flex;align-items:center;gap:8px' });
    hr.appendChild(el('div', { class:'label', style:'flex:1', text:`Step ${step+1} of ${play.beats.length}` }));
    const sm = btn('', { cls:'ghost sm icon', icon:'more', aria:'Step actions' });
    sm.addEventListener('click', () => menu(sm, [
      { label:'Duplicate this step', icon:'copy', run:()=>{ if (play.beats.length >= MAX_STEPS) return toast(`A play can have up to ${MAX_STEPS} steps.`);
          commit(() => { play.beats.splice(step+1, 0, JSON.parse(JSON.stringify(play.beats[step]))); step++; }); paintAll(); } },
      { label:'Move earlier', icon:'prev', run:()=>{ if (!step) return;
          commit(() => { const [x] = play.beats.splice(step, 1); play.beats.splice(step-1, 0, x); step--; }); paintAll(); } },
      { label:'Move later', icon:'next', run:()=>{ if (step >= play.beats.length-1) return;
          commit(() => { const [x] = play.beats.splice(step, 1); play.beats.splice(step+1, 0, x); step++; }); paintAll(); } },
      '-',
      { label:'Delete this step', icon:'trash', danger:true, run:()=>{
          if (play.beats.length <= 1) return toast('A play needs at least one step.');
          commit(() => { play.beats.splice(step, 1); step = Math.max(0, step-1); });
          paintAll(); toast('Step deleted.', ['Undo', doUndo]); } }
    ]));
    hr.appendChild(sm);
    hd.appendChild(hr);
    const lab = el('input', { class:'input', type:'text', maxlength:'48', value:b.label,
      placeholder: step === 0 ? 'e.g. Starting spots' : 'e.g. Ball screen on the right', 'aria-label':'Step name' });
    lab.addEventListener('input', () => { commit(() => { play.beats[step].label = lab.value; }, 'label-' + step); paintUnder(); });
    hd.appendChild(lab);
    hd.appendChild(el('p', { class:'help', text:'A short name for this moment of the play.' }));
    s.appendChild(hd);

    const pos = el('div', { class:'block' });
    pos.appendChild(el('div', { class:'label', text:'Where everyone stands' }));
    pos.appendChild(el('p', { class:'lead', html: step === 0
      ? '<b>Drag the players</b> on the court to where they start.'
      : '<b>Drag whoever moves.</b> The faint circles show where they were on the step before; the arrows show the move.' }));
    s.appendChild(pos);

    const bw = el('div', { class:'block' });
    bw.appendChild(el('div', { class:'label', text:'Who has the ball?' }));
    bw.appendChild(playerPicker(b.ball, n => { commit(() => { play.beats[step].ball = n; }); paintSide(); draw(); }));
    bw.appendChild(el('p', { class:'help', text:'Tap a player, or drag the ball onto one on the court.' }));
    s.appendChild(bw);

    const mv = el('div', { class:'block' });
    mv.appendChild(el('div', { class:'label', text:'What happens?' }));
    const list = el('div', { class:'moves' });
    if (!b.actions.length) list.appendChild(el('div', { class:'empty',
      text: step === 0 ? 'Usually nothing on the first step — players are just getting set.' : 'No moves yet. Add a screen, a pass, a clear out…' }));
    b.actions.forEach((a, i) => list.appendChild(moveRow(a, () => {
      commit(() => { play.beats[step].actions.splice(i, 1); }); paintSide(); draw();
    })));
    mv.appendChild(list);
    mv.appendChild(btn(b.actions.length >= MAX_MOVES ? `Up to ${MAX_MOVES} moves per step` : 'Add a move', {
      icon:'plus', cls:'wide', disabled:b.actions.length >= MAX_MOVES,
      onclick:()=>pickMove({ by:selected || b.ball,
        context:{ spots:b.spots, ball:b.ball, selected, prevActs: step > 0 ? play.beats[step-1].actions : [] },
        onDone:a => { commit(() => { play.beats[step].actions.push(a); }); paintSide(); draw(); } }) }));
    if (selected) mv.appendChild(el('p', { class:'help', text:`Player ${selected} is selected, so a new move starts with him.` }));
    s.appendChild(mv);

    const nt = el('details', { class:'block' });
    if (b.coaching || b.mistake) nt.open = true;
    nt.appendChild(el('summary', { class:'label', style:'cursor:pointer', text:'Coaching notes (optional)' }));
    const co = el('textarea', { class:'input', maxlength:'700', placeholder:'Why do players stand here? Shown to whoever learns the play.', 'aria-label':'Coaching note' });
    co.value = b.coaching || '';
    co.addEventListener('input', () => commit(() => { play.beats[step].coaching = co.value; }, 'coach-' + step));
    const mi = el('textarea', { class:'input', maxlength:'500', placeholder:'The mistake people usually make on this step.', 'aria-label':'Common mistake' });
    mi.value = b.mistake || '';
    mi.addEventListener('input', () => commit(() => { play.beats[step].mistake = mi.value; }, 'mist-' + step));
    nt.appendChild(co); nt.appendChild(mi);
    s.appendChild(nt);

    s.appendChild(el('div', { class:'hr' }));

    const ab = el('div', { class:'block' });
    ab.appendChild(el('div', { class:'label', text:'About this play' }));
    ab.appendChild(seg([[1,'Easy'],[2,'Medium'],[3,'Hard']], play.difficulty || 1,
      v => { commit(() => { play.difficulty = v; }); paintSide(); }, 'Difficulty'));
    const fm = el('input', { class:'input', type:'text', maxlength:'40', value:play.formation || '',
      placeholder:'Starting shape, e.g. Horns or 5-Out (optional)', 'aria-label':'Formation' });
    fm.addEventListener('input', () => commit(() => { play.formation = fm.value; }, 'form'));
    ab.appendChild(fm);
    const bl = el('textarea', { class:'input', maxlength:'700', placeholder:'What is this play for? (optional)', 'aria-label':'Description' });
    bl.value = play.blurb || '';
    bl.addEventListener('input', () => commit(() => { play.blurb = bl.value; }, 'blurb'));
    ab.appendChild(bl);
    s.appendChild(ab);

    const tip = el('p', { class:'help' });
    tip.appendChild(document.createTextNode('Everything saves automatically. '));
    tip.appendChild(el('button', { class:'lnk', type:'button', text:'Basketball terms', onclick:openGlossary }));
    s.appendChild(tip);
  }
  function paintAll(){ paintUnder(); paintSide(); draw(); }

  function preview(){
    if (play.beats.length < 2) return toast('Add a second step first — there is nothing to animate yet.');
    const dwell = 420, travel = 900, seg_ = dwell + travel, n = play.beats.length - 1;
    const total = seg_ * n + dwell, t0 = performance.now();
    const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
    previewAnim = { spots:play.beats[0].spots, ball:play.beats[0].ball, raf:0 };
    const tick = now => {
      if (!previewAnim) return;
      const e_ = clampN(now - t0, 0, total);
      const k = clampN(Math.floor(e_ / seg_), 0, n - 1);
      const w = e_ - k*seg_, t = w <= dwell ? 0 : ease(clamp01((w - dwell) / travel));
      const a = play.beats[k], b = play.beats[k+1], spots = {};
      for (const s of SLOTS) spots[s] = [lerp(a.spots[s][0], b.spots[s][0], t), lerp(a.spots[s][1], b.spots[s][1], t)];
      previewAnim.spots = spots; previewAnim.ball = t < .5 ? a.ball : b.ball;
      draw();
      if (e_ < total) previewAnim.raf = requestAnimationFrame(tick);
      else { previewAnim = null; draw(); }
    };
    previewAnim.raf = requestAnimationFrame(tick);
  }

  const key = e => {
    if (document.querySelector('.scrim')) return;
    const typing = inField(e);
    const mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key === 'z' || e.key === 'Z') && !e.shiftKey && !typing){ e.preventDefault(); doUndo(); }
    else if (mod && ((e.key === 'y' || e.key === 'Y') || ((e.key === 'z' || e.key === 'Z') && e.shiftKey)) && !typing){ e.preventDefault(); doRedo(); }
    else if (!typing && e.key === 'ArrowRight'){ step = Math.min(play.beats.length-1, step+1); selected = null; paintAll(); }
    else if (!typing && e.key === 'ArrowLeft'){ step = Math.max(0, step-1); selected = null; paintAll(); }
  };
  document.addEventListener('keydown', key);
  /* last line of defence: whatever is pending is written before the page goes */
  const onHide = () => flush();
  addEventListener('pagehide', onHide);
  document.addEventListener('visibilitychange', onHide);

  banner(W.stage, 'Drag players to their spots. Then “Add next step” and move whoever moves — it all saves automatically.', 'hintEditor');
  paintAll();
  setStatus('saved');

  return {
    destroy(){
      flush();
      if (previewAnim && previewAnim.raf) cancelAnimationFrame(previewAnim.raf);
      document.removeEventListener('keydown', key);
      removeEventListener('pagehide', onHide);
      document.removeEventListener('visibilitychange', onHide);
      W.destroy();
    },
    redraw:paintAll,
    get play(){ return play; }, get step(){ return step; }, set step(v){ step = v; paintAll(); },
    get saveState(){ return saveState; }, flush, undo:doUndo, redo:doRedo,
    get canUndo(){ return undo.length > 0; }, get canRedo(){ return redo.length > 0; }
  };
}

/* ================================================================ PRACTICE */
function screenPractice(root, play, mode){
  const own = !isBuiltin(play.id);
  const title = el('div', { class:'top-title', text:'Practise' });
  root.appendChild(topBar({ back:[play.name, '/play/' + encodeURIComponent(play.id)], titleNode:title, actions:globalActions() }));
  const W = workspace(root);

  const P = { step:0, results:[], reviewing:false, attempt:null, pg:null, mistakeOpt:null, shot:null, shotResult:null };

  function prevSpots(){ return P.step === 0 ? neutralSpots() : cloneSpots(play.beats[P.step-1].spots); }
  function newStep(){
    P.reviewing = false; P.mistakeOpt = null; P.shotResult = null;
    const base = prevSpots();
    const ball = P.step === 0 ? 1 : play.beats[P.step-1].ball;
    if (mode === 'all'){
      P.attempt = { spots:base, ball, ballPos:ballOffset(base, ball), actions:[] };
      P.pg = null;
    } else {
      const pg = P.step === 0 ? [0, App.court.len - 8] : [base[1][0], base[1][1]];
      base[1] = pg;
      P.pg = { spots:base, calls:[], preview:null };
      P.attempt = null;
    }
  }
  function restart(){ P.step = 0; P.results = []; newStep(); paintAll(); }

  const beat = () => play.beats[P.step];
  const blind = () => App.settings.hints === 'blind';
  function liveSpots(){
    if (mode === 'all') return P.attempt.spots;
    return P.pg.preview ? P.pg.preview.spots : P.pg.spots;
  }
  function liveBall(){ return mode === 'all' ? P.attempt.ball : beat().ball; }

  function courtState(){
    const b = beat(), spots = liveSpots();
    const st = { spots, ballPos: mode === 'all' ? P.attempt.ballPos : ballOffset(spots, b.ball),
                 locked: mode === 'pg' && !P.reviewing ? [2,3,4,5] : [] };
    if (P.reviewing){
      const res = P.results[P.step];
      st.ghosts = b.spots;
      st.marks = SLOTS.map(s => ({ kind:'diff', from:spots[s], to:b.spots[s],
        color: res && res.per[s].score >= .85 ? 'var(--c-arc)' : res && res.per[s].score >= .4 ? '#ffc247' : '#ff6b5e' }));
      st.highlight = b.keyPlayers || [];
    } else if (App.settings.hints !== 'blind' && P.step > 0){
      st.ghosts = play.beats[P.step-1].spots;
    }
    if (App.settings.defence){
      const mis = P.mistakeOpt ? applyMistake(P.mistakeOpt, spots, liveBall(), App.court) : null;
      st.defenders = buildDefence(spots, null, 1, b, liveBall(), App.court, mis);
      st.mistake = mis;
    }
    if (P.shot){
      const t = P.shot.t, hoop = [0, App.court.hoopY];
      const ex = P.shot.made ? hoop[0] : hoop[0] + 1.9, ey = P.shot.made ? hoop[1] : hoop[1] - 1.4;
      st.ballPos = [lerp(P.shot.from[0], ex, t), lerp(P.shot.from[1], ey, t)];
      st.ballScale = 1 + Math.sin(Math.PI * t) * .55;
      st.shotFlash = t > .88 ? P.shot.made : null;
    }
    return st;
  }
  const draw = () => W.R.draw(courtState());
  W.onRedraw = draw;

  /* ----------------------------------------------------------- dragging */
  let drag = null;
  function draggable(){
    if (P.reviewing || P.shot) return [];
    return mode === 'all' ? ['ball',1,2,3,4,5] : (P.pg.preview ? [] : [1]);
  }
  W.court.addEventListener('pointerdown', e => {
    const allowed = draggable();
    if (!allowed.length) return;
    const id = W.R.hitTest(e.clientX, e.clientY, allowed);
    if (id === null) return;
    const [fx, fy] = W.R.toCourt(e.clientX, e.clientY);
    const cur = id === 'ball' ? P.attempt.ballPos : liveSpots()[id];
    drag = { id, dx:cur[0]-fx, dy:cur[1]-fy };
    try{ W.court.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  W.court.addEventListener('pointermove', e => {
    if (!drag) return;
    const [fx, fy] = W.R.toCourt(e.clientX, e.clientY), c = App.court;
    const p = [clampN(fx+drag.dx, -c.width/2+.6, c.width/2-.6), clampN(fy+drag.dy, .6, c.len-.6)];
    if (drag.id === 'ball') P.attempt.ballPos = p;
    else if (mode === 'all'){
      P.attempt.spots[drag.id] = p;
      if (P.attempt.ball === drag.id) P.attempt.ballPos = ballOffset(P.attempt.spots, drag.id);
    } else P.pg.spots[1] = p;
    draw();
  });
  const endDrag = e => {
    if (!drag) return;
    const id = drag.id; drag = null;
    try{ W.court.releasePointerCapture(e.pointerId); }catch(err){}
    if (id === 'ball'){
      const n = nearestSlot(P.attempt.spots, P.attempt.ballPos, 5.5);
      P.attempt.ball = n || P.attempt.ball;
      P.attempt.ballPos = ballOffset(P.attempt.spots, P.attempt.ball);
    }
    paintSide(); draw();
  };
  W.court.addEventListener('pointerup', endDrag);
  W.court.addEventListener('pointercancel', endDrag);

  /* ------------------------------------------------------------ grading */
  function check(){
    const b = beat();
    if (mode === 'pg'){
      const res = resolveCalls(prevSpots(), P.pg.spots[1], P.pg.calls, b);
      P.pg.preview = res;
      P.results[P.step] = gradeBeat({ spots:res.spots, ball:b.ball, actions:res.actions }, b, App.court);
    } else {
      P.results[P.step] = gradeBeat(P.attempt, b, App.court);
    }
    if (blind()){
      if (P.step < play.beats.length - 1){ P.step++; newStep(); paintAll(); }
      else finish();
      return;
    }
    P.reviewing = true;
    paintAll();
  }
  function next(){
    if (P.step < play.beats.length - 1){ P.step++; newStep(); paintAll(); }
    else finish();
  }
  function finish(){
    const scores = P.results.map(r => r ? r.total : 0);
    const total = gradePlay(scores);
    Store.addHistory({ playId:play.id, playName:play.name, mode, score:round3(total), perBeat:scores.map(round3), ts:Date.now() });
    const avg = k => { const rs = P.results.filter(Boolean); return rs.length ? rs.reduce((a, r) => a + r.parts[k], 0) / rs.length : 0; };
    const NAMES = { pos:'where players stood', ball:'who had the ball', act:'what happened', space:'spacing' };
    const weakest = ['pos','ball','act','space'].map(k => ({ k, v:avg(k) })).sort((a, b) => a.v - b.v)[0];
    const s = sheet({ title:`${play.name}: ${Math.round(total*100)}% — ${letterFor(total)}`,
      sub:`Your weakest area was ${NAMES[weakest.k]} (${Math.round(weakest.v*100)}%).` });
    const grid = el('div', { class:'sumgrid' });
    scores.forEach((sc, i) => {
      const c = el('div', { class:'sumcell' });
      c.appendChild(el('div', { class:'k', text:'Step ' + (i+1) }));
      const v = el('div', { class:'v', text:Math.round(sc*100) + '%' });
      v.style.color = sc >= .8 ? 'var(--good)' : sc >= .55 ? 'var(--warn)' : 'var(--bad)';
      c.appendChild(v);
      c.appendChild(el('div', { class:'s', text:play.beats[i].label || '' }));
      grid.appendChild(c);
    });
    s.body.appendChild(grid);
    s.body.appendChild(meters([['Where players stood', avg('pos')], ['Who had the ball', avg('ball')],
                               ['What happened', avg('act')], ['Spacing', avg('space')]]));
    s.foot.appendChild(btn('Back to the play', { onclick:()=>{ s.close(); go('/play/' + encodeURIComponent(play.id)); } }));
    s.foot.appendChild(btn('Practise again', { cls:'pri', onclick:()=>{ s.close(); restart(); } }));
  }

  /* ---------------------------------------------------------- shooting */
  function shoot(shooter){
    const spots = liveSpots();
    const dfn = App.settings.defence
      ? buildDefence(spots, null, 1, beat(), liveBall(), App.court,
          P.mistakeOpt ? applyMistake(P.mistakeOpt, spots, liveBall(), App.court) : null)
      : null;
    const q = shotQuality(shooter, spots, dfn, App.court);
    const made = Math.random() < q.pct;
    P.shotResult = Object.assign({ shooter, made }, q);
    P.shot = { from:spots[shooter], t:0, made };
    const t0 = performance.now();
    const tick = now => {
      if (!P.shot) return;
      P.shot.t = clamp01((now - t0) / 760);
      draw();
      if (P.shot.t < 1) P.shot.raf = requestAnimationFrame(tick);
      else { P.shot = null; paintAll(); }
    };
    P.shot.raf = requestAnimationFrame(tick);
    paintUnder();
  }
  function shotMenu(anchor){
    const spots = liveSpots();
    const dfn = App.settings.defence
      ? buildDefence(spots, null, 1, beat(), liveBall(), App.court,
          P.mistakeOpt ? applyMistake(P.mistakeOpt, spots, liveBall(), App.court) : null)
      : null;
    menu(anchor, SLOTS.map(n => {
      const q = shotQuality(n, spots, dfn, App.court);
      return { label:`${n} — ${q.contest} ${q.name} · ${q.expected.toFixed(2)} pts`, icon:'ball', run:()=>shoot(n) };
    }));
  }

  /* --------------------------------------------------------- under bar */
  function paintUnder(){
    const u = clear(W.under);
    const dots = el('div', { style:'display:flex;gap:5px;align-items:center', 'aria-label':`Step ${P.step+1} of ${play.beats.length}` });
    play.beats.forEach((_, i) => {
      const r = P.results[i];
      const d = el('span', { style:`width:10px;height:10px;border-radius:99px;display:block;background:${
        i === P.step ? 'var(--accent)' : r && !blind() ? (r.total >= .8 ? 'var(--good)' : r.total >= .55 ? 'var(--warn)' : 'var(--bad)') : 'var(--line-2)'}` });
      dots.appendChild(d);
    });
    u.appendChild(dots);
    u.appendChild(el('span', { class:'help', text:`Step ${P.step+1} of ${play.beats.length}` }));
    u.appendChild(el('div', { class:'sp' }));
    u.appendChild(sw('Defenders', App.settings.defence, v => { App.settings.defence = v; P.mistakeOpt = null; saveSettings(); paintAll(); }));
    if (App.settings.defence) u.appendChild(btn(P.mistakeOpt ? 'Reset defence' : 'Force a mistake', { cls:'sm',
      onclick:()=>{
        if (P.mistakeOpt) P.mistakeOpt = null;
        else {
          const o = mistakeOptions(beat(), liveSpots(), liveBall());
          P.mistakeOpt = o.length ? o[Math.floor(Math.random()*o.length)] : null;
          if (!P.mistakeOpt) toast('No defensive mistake fits this step.');
        }
        paintAll();
      } }));
    const sb = btn('Take a shot', { cls:'sm', icon:'ball', disabled:!!P.shot, title:'Pick a shooter — each shows what the shot is worth' });
    sb.addEventListener('click', () => shotMenu(sb));
    u.appendChild(sb);
  }

  /* -------------------------------------------------------- side panel */
  function paintSide(){
    const s = clear(W.side), b = beat();

    if (P.shotResult){
      const r = P.shotResult;
      const sr = el('div', { class:'block' });
      sr.appendChild(el('div', { class:'label', text: r.made ? 'Shot — good!' : 'Shot — missed' }));
      sr.appendChild(el('p', { class:'lead', html:
        `<b>${esc(r.contest)} ${esc(r.name)}</b> by ${r.shooter} from ${Math.round(r.dist)} ft — ` +
        `${Math.round(r.pct*100)}% chance, <b>${r.expected.toFixed(2)} expected points</b>. ${esc(r.verdict)}` }));
      s.appendChild(sr);
    }
    if (P.mistakeOpt){
      const mis = applyMistake(P.mistakeOpt, liveSpots(), liveBall(), App.court);
      const mb = el('div', { class:'block' });
      mb.appendChild(el('div', { class:'label', text:'Defensive mistake' }));
      mb.appendChild(el('div', { class:'mistake', text:mis.text + (mis.space >= 6 ? ' That is a shot.' : '') }));
      s.appendChild(mb);
    }

    if (P.step === 0 && !P.reviewing){
      const how = el('div', { class:'block' });
      how.appendChild(el('div', { class:'label', text:'How do you want to practise?' }));
      how.appendChild(seg([['all','Place all five'], ['pg','Be the point guard']], mode,
        v => go('/practice/' + encodeURIComponent(play.id) + (v === 'pg' ? '/pg' : '')), 'What you control'));
      how.appendChild(el('p', { class:'help', text: mode === 'pg'
        ? 'You only control the 1. Your team-mates move when you call them.'
        : 'You drag every player to where he should be.' }));
      how.appendChild(seg([['guided','Guided'],['standard','Standard'],['blind','Blind']], App.settings.hints,
        v => { App.settings.hints = v; saveSettings(); restart(); }, 'Hints'));
      how.appendChild(el('p', { class:'help', text:({
        guided:'Shows each step’s name and where everyone was.',
        standard:'Shows where everyone was on the step before.',
        blind:'No hints at all. Scores are shown at the end.' })[App.settings.hints] }));
      s.appendChild(how);
      s.appendChild(el('div', { class:'hr' }));
    }
    const hd = el('div', { class:'block' });
    hd.appendChild(el('div', { class:'label', text:`Step ${P.step+1} of ${play.beats.length}` }));
    hd.appendChild(el('h3', { style:'font-size:20px', text: blind() ? 'No hints — from memory' : (b.label || 'Step ' + (P.step+1)) }));
    s.appendChild(hd);

    if (P.reviewing) return paintReview(s, b);

    if (mode === 'all'){
      const ins = el('div', { class:'block' });
      ins.appendChild(el('p', { class:'lead', html:
        '<b>Drag all five players</b> to where they stand on this step, then <b>drag the ball</b> to whoever has it.' +
        (!blind() && P.step > 0 ? ' The faint circles show where everyone was a step ago.' : '') }));
      s.appendChild(ins);

      const mv = el('div', { class:'block' });
      mv.appendChild(el('div', { class:'label', text:'What happens on this step?' }));
      const list = el('div', { class:'moves' });
      if (!P.attempt.actions.length){
        list.appendChild(moveRow({ type:'none' }));
      } else P.attempt.actions.forEach((a, i) => list.appendChild(moveRow(a, () => { P.attempt.actions.splice(i, 1); paintSide(); })));
      mv.appendChild(list);
      mv.appendChild(btn(P.attempt.actions.length >= MAX_MOVES ? `Up to ${MAX_MOVES} moves` : 'Add a move', {
        icon:'plus', cls:'wide', disabled:P.attempt.actions.length >= MAX_MOVES,
        onclick:()=>pickMove({ by:P.attempt.ball,
          context:{ spots:P.attempt.spots, ball:P.attempt.ball, selected:null, prevActs: P.step > 0 ? play.beats[P.step-1].actions : [] },
          onDone:a => { if (a.type !== 'none') P.attempt.actions.push(a); paintSide(); } }) }));
      mv.appendChild(el('p', { class:'help', text:'Leave it as “Nothing” if players are only getting to their spots.' }));
      s.appendChild(mv);

      const lv = el('div', { class:'block' });
      lv.appendChild(el('div', { class:'label', text:'Spacing check' }));
      lv.appendChild(liveCheck(P.attempt.spots, b));
      s.appendChild(lv);
    } else paintCalls(s, b);

    s.appendChild(btn(mode === 'pg' ? 'Run my calls' : blind() ? 'Lock it in' : 'Check my answer',
      { cls:'pri lg wide', icon:'check', onclick:check }));
    s.appendChild(el('p', { class:'help', style:'text-align:center', text:'or press Enter' }));
  }

  function liveCheck(spots, b){
    const w = el('div', { class:'live' });
    const rack = neutralSpots();
    if (SLOTS.every(n => dist(spots[n], rack[n]) < .01)){
      w.appendChild(el('div', { class:'ln warn', text:'Nobody placed yet — drag the players onto the court.' }));
      return w;
    }
    const sp = spacingReport(spots, b, App.court);
    const tight = sp.violations.filter(v => v.kind === 'tight');
    if (!tight.length) w.appendChild(el('div', { class:'ln', html:'<b>Spacing looks good</b> — nobody is crowding a team-mate.' }));
    for (const v of tight.slice(0, 3))
      w.appendChild(el('div', { class:'ln warn', html:`<b>${v.a}</b> and <b>${v.b}</b> are only <b>${v.d.toFixed(1)} ft</b> apart — one defender can guard both.` }));
    if (sp.violations.some(v => v.kind === 'paint')) w.appendChild(el('div', { class:'ln warn', text:'Three players are in the paint — two is the most there should be.' }));
    return w;
  }

  function paintCalls(s, b){
    const g = P.pg;
    const ins = el('div', { class:'block' });
    ins.appendChild(el('p', { class:'lead', html:
      '<b>You are the point guard (1).</b> Drag yourself, then call your team-mates. <b>Anyone you don’t call stays where they are.</b>' }));
    if (own) ins.appendChild(el('p', { class:'help', text:'This play was drawn freely, so a call counts as right if it sends a player within about 6 ft of his spot.' }));
    s.appendChild(ins);

    const named = new Set();
    for (const c of g.calls){
      if (c.v === 'send' || c.v === 'ballscreen') named.add(c.who);
      else if (c.v === 'offball'){ named.add(c.who); named.add(c.for); }
      else if (c.v === 'clear'){ const sg = c.side === 'left' ? -1 : 1;
        for (const n of [2,3,4,5]) if (Math.sign(g.spots[n][0]) === sg && Math.abs(g.spots[n][0]) >= 4) named.add(n); }
    }
    const rb = el('div', { class:'block' });
    rb.appendChild(el('div', { class:'label', text:'Your team-mates' }));
    const roster = el('div', { class:'roster' });
    for (const n of [2,3,4,5]){
      const r = el('div', { class:'rrow' });
      r.appendChild(playerDot(n));
      r.appendChild(el('span', { class:'nm', text:SLOT_NAME[n] }));
      r.appendChild(el('span', { class:'st ' + (named.has(n) ? 'on' : 'off'), text: named.has(n) ? 'Called' : 'Stays put' }));
      roster.appendChild(r);
    }
    rb.appendChild(roster);
    s.appendChild(rb);

    const cb = el('div', { class:'block' });
    cb.appendChild(el('div', { class:'label', text:'Your calls' }));
    const list = el('div', { class:'calls' });
    if (!g.calls.length) list.appendChild(el('div', { class:'empty', text:'No calls yet.' }));
    g.calls.forEach((c, i) => {
      const r = el('div', { class:'call' });
      r.appendChild(el('span', { class:'tx', text:callSentence(c) }));
      r.appendChild(btn('', { cls:'ghost sm icon', icon:'x', aria:'Remove call', onclick:()=>{ g.calls.splice(i, 1); paintSide(); } }));
      list.appendChild(r);
    });
    cb.appendChild(list);
    cb.appendChild(btn('Call a move', { icon:'plus', cls:'wide', disabled:g.calls.length >= 6,
      onclick:()=>pickCall(c => { g.calls.push(c); paintSide(); }) }));
    const q = el('div', { class:'quick' });
    const quick = (label, c) => q.appendChild(btn(label, { cls:'sm', onclick:()=>{ if (g.calls.length < 6){ g.calls.push(c); paintSide(); } } }));
    quick('Clear the left side', { v:'clear', side:'left' });
    quick('Clear the right side', { v:'clear', side:'right' });
    quick('5, ball screen on my right', { v:'ballscreen', who:5, side:'right' });
    quick('5, ball screen on my left', { v:'ballscreen', who:5, side:'left' });
    cb.appendChild(el('p', { class:'help', text:'Quick calls:' }));
    cb.appendChild(q);
    s.appendChild(cb);
  }

  function paintReview(s, b){
    const res = P.results[P.step];
    const sc = el('div', { class:'block' });
    const big = el('div', { class:'score' });
    const n = el('b', { text:Math.round(res.total*100) + '%' });
    n.style.color = res.total >= .8 ? 'var(--good)' : res.total >= .55 ? 'var(--warn)' : 'var(--bad)';
    big.appendChild(n);
    big.appendChild(el('span', { class:'gr', text:letterFor(res.total) }));
    sc.appendChild(big);
    sc.appendChild(el('p', { class:'help', text:'Hollow circles show where everyone should be; each line runs from your spot to the right one.' }));
    sc.appendChild(meters([['Where players stood', res.parts.pos], ['Who had the ball', res.parts.ball],
                           ['What happened', res.parts.act], ['Spacing', res.parts.space]]));
    s.appendChild(sc);

    if (mode === 'pg' && P.pg.preview){
      const cb = el('div', { class:'block' });
      cb.appendChild(el('div', { class:'label', text:'Your calls' }));
      const list = el('div', { class:'calls' });
      if (!P.pg.preview.log.length) list.appendChild(el('div', { class:'call no' }, [el('span', { class:'tx', text:'You called nothing, so nobody moved.' })]));
      for (const L of P.pg.preview.log) list.appendChild(el('div', { class:'call ' + (L.ok ? 'ok' : 'no') },
        [el('span', { class:'tx', text:`${callSentence(L.call)} — ${L.note}` })]));
      cb.appendChild(list);
      s.appendChild(cb);
    }

    const nb = el('div', { class:'block' });
    nb.appendChild(el('div', { class:'label', text:'What to fix' }));
    const notes = el('div', { class:'notes' });
    for (const x of res.notes){
      const r = el('div', { class:'note ' + x.level });
      const who = el('span', { class:'who', text:String(x.slot) });
      if (SLOTS.includes(x.slot)){ who.style.background = slotColors()[x.slot]; who.style.color = readableInk(slotColors()[x.slot]); }
      else { who.style.background = 'var(--surface-3)'; }
      r.appendChild(who);
      r.appendChild(el('span', { text:x.text }));
      notes.appendChild(r);
    }
    nb.appendChild(notes);
    s.appendChild(nb);

    if (b.coaching) s.appendChild(coachNode(b.coaching, !own));
    if (b.mistake){
      const m = el('div', { class:'mistake' });
      m.appendChild(el('b', { text:'Common mistake' }));
      m.appendChild(document.createTextNode(own ? b.mistake : stripTags(b.mistake)));
      s.appendChild(m);
    }
    const row = el('div', { style:'display:flex;gap:9px' });
    row.appendChild(btn('Try again', { cls:'lg', onclick:()=>{ newStep(); paintAll(); } }));
    const nx = btn(P.step < play.beats.length-1 ? 'Next step' : 'See my score', { cls:'pri lg', icon:'next', onclick:next });
    nx.style.flex = '1';
    row.appendChild(nx);
    s.appendChild(row);
  }

  function paintAll(){ paintUnder(); paintSide(); draw(); }

  const key = e => {
    if (e.key !== 'Enter' || document.querySelector('.scrim') || inField(e) || (e.target.closest && e.target.closest('button'))) return;
    e.preventDefault();
    if (P.reviewing) next(); else check();
  };
  document.addEventListener('keydown', key);
  banner(W.stage, mode === 'pg'
    ? 'You are the 1: drag yourself, then call the others from the panel.'
    : 'Drag all five to their spots, then drag the ball to whoever has it.', mode === 'pg' ? 'hintPG' : 'hintPractice');
  newStep();
  paintAll();
  return { destroy(){ if (P.shot && P.shot.raf) cancelAnimationFrame(P.shot.raf); document.removeEventListener('keydown', key); W.destroy(); },
           redraw:paintAll, P, check, next, get mode(){ return mode; } };
}
function meters(rows){
  const w = el('div', { class:'meters' });
  for (const [name, v] of rows){
    const m = el('div', { class:'meter' });
    const lb = el('div', { class:'lb' });
    lb.appendChild(el('span', { text:name }));
    lb.appendChild(el('b', { text:Math.round(v*100) + '%' }));
    m.appendChild(lb);
    const tr = el('div', { class:'tr' }), fl = el('div', { class:'fl' });
    fl.style.width = (v*100) + '%';
    fl.style.background = v >= .8 ? 'var(--good)' : v >= .5 ? 'var(--warn)' : 'var(--bad)';
    tr.appendChild(fl); m.appendChild(tr); w.appendChild(m);
  }
  return w;
}

/* ============================================================ CALL PICKER */
function callSentence(c){
  if (c.v === 'send') return `${c.who}, go to the ${SIDED.has(c.where) ? c.side + ' ' : ''}${c.where}`;
  if (c.v === 'ballscreen') return `${c.who}, set me a ball screen on my ${c.side}`;
  if (c.v === 'offball') return `${c.who}, ${c.type === 'handoff' ? 'hand off to' : 'screen for'} ${c.for}`;
  if (c.v === 'clear') return `Clear the ${c.side} side`;
  return '?';
}
const CALL_TYPES = [
  { v:'send',       label:'Send a team-mate to a spot', help:'Point where you want him. He goes there — and only there.' },
  { v:'ballscreen', label:'Get a ball screen',          help:'A big comes and screens for you. Pick which side of you.' },
  { v:'offball',    label:'Screen for a team-mate',     help:'One team-mate screens (or hands off) to free another.' },
  { v:'clear',      label:'Clear a side',               help:'Everyone on that side leaves it, so you can attack it with your big. This is how a two-man game starts.' }
];
function pickCall(onDone){
  const cur = { v:null, who:2, where:null, side:'left', type:'screen', for:3 };
  const s = sheet({ title:'Call a move', sub:'What do you want your team-mates to do?', wide:true });
  const types = el('div', { class:'acards two' });
  const detail = el('div');
  const sentence = el('div', { class:'sentence' });
  const ok = btn('Make the call', { cls:'pri', icon:'check', disabled:true });

  function paint(){
    clear(types);
    for (const t of CALL_TYPES){
      const c = el('button', { class:'acard', type:'button', 'aria-pressed':String(cur.v === t.v), onclick:()=>{ cur.v = t.v; paint(); } });
      const ic = el('span', { class:'ic' });
      ic.appendChild(icon(t.v === 'send' ? 'cut' : t.v === 'ballscreen' ? 'screen' : t.v === 'offball' ? 'curl' : 'clearout'));
      c.appendChild(ic);
      const tx = el('div'); tx.appendChild(el('b', { text:t.label })); tx.appendChild(el('span', { text:t.help }));
      c.appendChild(tx);
      types.appendChild(c);
    }
    clear(detail);
    if (cur.v && cur.v !== 'clear'){
      const r = el('div', { class:'pickrow' });
      r.appendChild(el('div', { class:'label', text:'Which team-mate?' }));
      r.appendChild(playerPicker(cur.who, n => { cur.who = n; if (cur.for === n) cur.for = [2,3,4,5,1].find(k => k !== n); paint(); }, null, [2,3,4,5]));
      detail.appendChild(r);
    }
    if (cur.v === 'send'){
      const r = el('div', { class:'pickrow' });
      r.appendChild(el('div', { class:'label', text:'Tap the spot on the floor' }));
      r.appendChild(spotPicker(cur, () => paint()));
      detail.appendChild(r);
    }
    if (cur.v === 'ballscreen' || cur.v === 'clear'){
      const r = el('div', { class:'pickrow' });
      r.appendChild(el('div', { class:'label', text: cur.v === 'clear' ? 'Which side do you want empty?' : 'Screen on which side of you?' }));
      r.appendChild(seg([['left','Left'],['right','Right']], cur.side, v => { cur.side = v; paint(); }));
      detail.appendChild(r);
    }
    if (cur.v === 'offball'){
      const r = el('div', { class:'pickrow' });
      r.appendChild(el('div', { class:'label', text:'What does he do?' }));
      r.appendChild(seg([['screen','Screen'],['handoff','Hand off']], cur.type, v => { cur.type = v; paint(); }));
      r.appendChild(el('div', { class:'label', text:'For whom?' }));
      r.appendChild(playerPicker(cur.for, n => { cur.for = n; paint(); }, [cur.who]));
      detail.appendChild(r);
    }
    const c = buildCall();
    sentence.textContent = c ? '“' + callSentence(c) + '”' : 'Pick what you want above.';
    ok.disabled = !c;
  }
  function buildCall(){
    if (cur.v === 'send') return cur.where ? { v:'send', who:cur.who, where:cur.where, side:cur.side } : null;
    if (cur.v === 'ballscreen') return { v:'ballscreen', who:cur.who, side:cur.side };
    if (cur.v === 'offball') return { v:'offball', who:cur.who, type:cur.type, for:cur.for };
    if (cur.v === 'clear') return { v:'clear', side:cur.side };
    return null;
  }
  s.body.appendChild(types); s.body.appendChild(detail); s.body.appendChild(sentence);
  s.foot.appendChild(btn('Cancel', { onclick:()=>s.close() }));
  ok.addEventListener('click', () => { const c = buildCall(); if (c){ s.close(); onDone(c); } });
  s.foot.appendChild(ok);
  paint();
}
/* Where to send a team-mate. Words you can read (grouped: outside / inside the
   arc) beside a court that shows exactly where the chosen spot is. The dots are
   still tappable, but you never have to guess what an unlabelled dot means. */
const SPOT_GROUPS = [
  ['Outside the arc', ['corner','wing','slot','top','trail']],
  ['Inside the arc',  ['elbow','nail','short corner','block','dunker','rim']]
];
const SPOT_NICE = { 'dunker':'dunker spot', 'trail':'trailer spot', 'top':'top of the key' };
function spotPicker(cur, onchange){
  const wrap = el('div', { class:'spotpick' });
  const left = el('div', { class:'spl' });
  const sided = cur.where ? SIDED.has(cur.where) : true;
  const sideRow = el('div', { style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap' });
  sideRow.appendChild(el('span', { class:'help', text:'Side of the floor:' }));
  sideRow.appendChild(seg([['left','Left'],['right','Right']], cur.side, v => { cur.side = v; onchange(); }));
  if (!sided) sideRow.appendChild(el('span', { class:'help', text:'(this spot is in the middle)' }));
  left.appendChild(sideRow);
  for (const [title, keys] of SPOT_GROUPS){
    left.appendChild(el('div', { class:'label', style:'margin-top:12px', text:title }));
    const row = el('div', { class:'quick' });
    for (const k of keys){
      row.appendChild(el('button', { type:'button', class:'btn sm spotbtn', 'aria-pressed':String(cur.where === k),
        text:SPOT_NICE[k] || k, title:SPOT_HELP[k] || '', onclick:()=>{ cur.where = k; onchange(); } }));
    }
    left.appendChild(row);
  }
  wrap.appendChild(left);

  const c = App.court, hw = c.width/2;
  const m = svg('svg', { viewBox:`${-hw-1} -1 ${c.width+2} 42`, class:'spmap', role:'img', 'aria-label':'Where the chosen spot is' });
  m.appendChild(svg('rect', { x:-hw-2, y:-2, width:c.width+4, height:46, fill:'var(--c-floor)' }));
  m.appendChild(svg('rect', { x:-c.paintHalf, y:0, width:c.paintHalf*2, height:c.ftY, fill:'var(--c-paint)', stroke:'var(--c-line)', 'stroke-width':.3 }));
  m.appendChild(svg('path', { d:courtPath3pt(c), fill:'none', stroke:'var(--c-arc)', 'stroke-width':.36 }));
  m.appendChild(svg('circle', { cx:0, cy:c.hoopY, r:c.rimR, fill:'none', stroke:'var(--c-arc)', 'stroke-width':.3 }));
  let chosen = null;
  for (const key of SPOT_KEYS){
    for (const sg of (SIDED.has(key) ? [-1, 1] : [1])){
      const [x, y] = SPOT_MAP[key](sg);
      const side = sg < 0 ? 'left' : 'right';
      const on = cur.where === key && (!SIDED.has(key) || cur.side === side);
      if (on){ chosen = [x, y]; continue; }
      const d = svg('circle', { cx:x, cy:y, r:1.05, fill:'rgba(0,0,0,.35)', stroke:'var(--c-line)', 'stroke-width':.18,
        style:'cursor:pointer' });
      const t = svg('title'); t.textContent = (SIDED.has(key) ? side + ' ' : '') + (SPOT_NICE[key] || key);
      d.appendChild(t);
      d.addEventListener('click', () => { cur.where = key; cur.side = side; onchange(); });
      m.appendChild(d);
    }
  }
  if (chosen){
    m.appendChild(svg('circle', { cx:chosen[0], cy:chosen[1], r:2.3, fill:'var(--accent)', stroke:'#fff', 'stroke-width':.3 }));
    const name = (SIDED.has(cur.where) ? cur.side + ' ' : '') + (SPOT_NICE[cur.where] || cur.where);
    const lx = clampN(chosen[0], -hw + 7, hw - 7), ly = chosen[1] > 33 ? chosen[1] - 3.4 : chosen[1] + 4.6;
    const bg = svg('rect', { x:lx - name.length*.62, y:ly - 2.1, width:name.length*1.24, height:3, rx:1.4, fill:'rgba(0,0,0,.72)' });
    m.appendChild(bg);
    const t = svg('text', { x:lx, y:ly, 'text-anchor':'middle', 'font-size':2, 'font-weight':700, fill:'#fff',
      'font-family':'system-ui,sans-serif' });
    t.textContent = name;
    m.appendChild(t);
  }
  const right = el('div', { class:'spr' });
  right.appendChild(m);
  right.appendChild(el('p', { class:'help', style:'margin-top:6px', text: cur.where
    ? (SPOT_HELP[cur.where] || '')
    : 'Pick a spot on the left — it lights up here so you can see exactly where it is.' }));
  wrap.appendChild(right);
  return wrap;
}

/* ==================================================================== QUIZ */
/* No side panel: a quiz is one question, so the court gets the whole screen and
   the answers sit under it. The result arrives as a sheet rather than filling a
   column with white space. */
function screenQuiz(root){
  root.appendChild(topBar({ back:['Playbook', '/'], title:'Name that play', actions:globalActions() }));
  const W = workspace(root, { split:false });
  let q = null, anim = null, right = 0, asked = 0;

  function newQ(){
    const pool = allPlays();
    if (pool.length < 2){ q = null; paint(); return; }
    const answer = pool[Math.floor(Math.random()*pool.length)];
    const others = pool.filter(p => p.id !== answer.id).sort(() => Math.random() - .5).slice(0, 3);
    q = { play:answer, choices:others.concat([answer]).sort(() => Math.random() - .5), picked:null };
    run(); paint();
  }
  function run(){
    if (anim && anim.raf) cancelAnimationFrame(anim.raf);
    const beats = q.play.beats;
    if (beats.length < 2){ anim = null; draw(); return; }
    const dwell = 500, travel = 950, seg_ = dwell + travel, n = beats.length - 1, total = seg_ * n + dwell, t0 = performance.now();
    const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
    anim = { spots:beats[0].spots, ball:beats[0].ball, raf:0 };
    const tick = now => {
      if (!anim) return;
      const e_ = clampN(now - t0, 0, total), k = clampN(Math.floor(e_ / seg_), 0, n-1), w = e_ - k*seg_;
      const t = w <= dwell ? 0 : ease(clamp01((w - dwell) / travel)), a = beats[k], b = beats[k+1], sp = {};
      for (const s of SLOTS) sp[s] = [lerp(a.spots[s][0], b.spots[s][0], t), lerp(a.spots[s][1], b.spots[s][1], t)];
      anim.spots = sp; anim.ball = t < .5 ? a.ball : b.ball;
      draw();
      if (e_ < total) anim.raf = requestAnimationFrame(tick);
    };
    anim.raf = requestAnimationFrame(tick);
  }
  const draw = () => { if (!q) return;
    const f = anim || { spots:q.play.beats[0].spots, ball:q.play.beats[0].ball };
    W.R.draw({ spots:f.spots, ballPos:ballOffset(f.spots, f.ball) }); };
  W.onRedraw = draw;

  function reveal(){
    const correct = q.picked === q.play.id;
    const s = sheet({ title: correct ? 'Right — ' + q.play.name : 'Not quite. It was ' + q.play.name,
      sub: asked ? `${right} of ${asked} right so far.` : '' });
    if (q.play.blurb) s.body.appendChild(coachNode(q.play.blurb, isBuiltin(q.play.id), 'lead'));
    s.body.appendChild(el('div', { class:'label', style:'margin:14px 0 8px', text:'How it runs' }));
    const list = el('div', { class:'steps' });
    q.play.beats.forEach((bb, i) => {
      const row = el('div', { class:'stepbtn', style:'cursor:default' });
      row.appendChild(el('span', { class:'n', text:String(i+1) }));
      row.appendChild(el('span', { class:'t', text:bb.label || 'Step ' + (i+1) }));
      list.appendChild(row);
    });
    s.body.appendChild(list);
    s.foot.appendChild(btn('Open this play', { onclick:()=>{ s.close(); go('/play/' + encodeURIComponent(q.play.id)); } }));
    s.foot.appendChild(el('div', { class:'sp' }));
    s.foot.appendChild(btn('Next question', { cls:'pri', icon:'next', onclick:()=>{ s.close(); newQ(); } }));
  }

  function paint(){
    const u = clear(W.under);
    if (!q){ u.appendChild(el('div', { class:'empty', text:'You need at least two plays for a quiz. Create one first.' })); return; }
    const row1 = el('div', { style:'display:flex;align-items:center;gap:10px;width:100%;flex-wrap:wrap' });
    row1.appendChild(el('span', { class:'label', style:'margin:0', text:'Which play is this?' }));
    row1.appendChild(el('div', { class:'sp', style:'flex:1' }));
    row1.appendChild(el('span', { class:'help', text: asked ? `${right} of ${asked} right` : 'First question' }));
    row1.appendChild(btn('Watch again', { cls:'sm', icon:'play', onclick:run }));
    u.appendChild(row1);
    const ch = el('div', { class:'qchoices' });
    for (const p of q.choices){
      const correct = p.id === q.play.id;
      const cls = !q.picked ? 'choice' : correct ? 'choice right' : q.picked === p.id ? 'choice wrong' : 'choice';
      ch.appendChild(el('button', { class:cls, type:'button', disabled:!!q.picked, text:p.name,
        onclick:()=>{ q.picked = p.id; asked++; if (correct) right++; paint(); reveal(); } }));
    }
    u.appendChild(ch);
  }
  newQ();
  return { destroy(){ if (anim && anim.raf) cancelAnimationFrame(anim.raf); anim = null; W.destroy(); }, redraw:draw };
}

async function shareSheet(play){
  let clean;
  try{ clean = validatePlay(play); }catch(e){ return toast('This play can’t be shared: ' + e.message); }
  const url = location.origin + location.pathname + '#p=' + await encodePlay(clean);
  const s = sheet({ title:'Share “' + clean.name + '”', sub:'Anyone who opens this link gets the play. Nothing is uploaded — the whole play travels inside the link.' });
  const ta = el('textarea', { class:'input codebox', readonly:true, 'aria-label':'Share link' });
  ta.value = url;
  s.body.appendChild(ta);
  s.body.appendChild(el('p', { class:'help', style:'margin-top:8px',
    text: url.length > 1800 ? 'This link is long — some chat apps cut long links. Exporting a file is safer.' : url.length + ' characters.' }));
  s.foot.appendChild(btn('Close', { onclick:()=>s.close() }));
  s.foot.appendChild(btn('Copy link', { cls:'pri', icon:'copy', onclick:async ()=>{
    try{ await navigator.clipboard.writeText(url); toast('Link copied.'); }
    catch(e){ ta.focus(); ta.select(); toast('Press Ctrl+C to copy the selected link.'); }
  } }));
  setTimeout(() => { try{ ta.focus(); ta.select(); }catch(e){} }, 30);
}
function download(name, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href:url, download:name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportPlay(play){
  let clean;
  try{ clean = validatePlay(play); }catch(e){ return toast('This play can’t be exported: ' + e.message); }
  download((clean.name || 'play').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() + '.hoopsplay.json', clean);
  toast('Exported “' + clean.name + '”.');
}
function exportPlaybook(){
  const plays = Store.plays();
  if (!plays.length) return toast('You have no plays of your own to export yet.');
  download('my-playbook.hoopsbook.json', { format:'set-play-trainer/playbook', version:2, exported:new Date().toISOString(), plays });
  toast(`Exported ${plays.length} play${plays.length === 1 ? '' : 's'}.`);
}
/* Anything imported is untrusted and may repeat an id already here, so every
   imported play is validated and given an id that cannot collide. */
function importPlays(list){
  const have = new Set(Store.plays().map(p => p.id));
  const saved = [];
  for (const item of list){
    const p = validatePlay(item);
    if (have.has(p.id) || isBuiltin(p.id)) p.id = uid('play');
    const out = Store.put(p);
    if (out){ saved.push(out); have.add(out.id); }
  }
  return saved;
}
function importFile(){
  const inp = el('input', { type:'file', accept:'.json,application/json', style:'display:none' });
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if (!f){ inp.remove(); return; }
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const raw = JSON.parse(String(rd.result));
        const list = Array.isArray(raw) ? raw : Array.isArray(raw.plays) ? raw.plays : [raw];
        const saved = importPlays(list);
        if (!saved.length) toast('Nothing could be imported.');
        else { toast(saved.length === 1 ? 'Imported “' + saved[0].name + '”.' : `Imported ${saved.length} plays.`); route(); }
      }catch(e){ toast('That file isn’t a play: ' + e.message); }
      inp.remove();
    };
    rd.onerror = () => { toast('Couldn’t read that file.'); inp.remove(); };
    rd.readAsText(f);
  });
  document.body.appendChild(inp);
  inp.click();
}
async function openShared(code){
  let p;
  try{ p = await decodePlay(code); }
  catch(e){ toast('That share link couldn’t be read: ' + e.message); history.replaceState(null, '', location.pathname); return route(); }
  history.replaceState(null, '', location.pathname);
  const root = clear(document.getElementById('app'));
  App.ctl = screenHome(root);
  const s = sheet({ title:'Someone shared a play with you', sub:'“' + p.name + '” — ' + p.beats.length + ' steps.' });
  s.body.appendChild(el('div', { class:'thumb', style:'border-radius:12px;overflow:hidden;background:var(--c-floor);aspect-ratio:50/40' }, [playThumb(p)]));
  s.foot.appendChild(btn('Not now', { onclick:()=>s.close() }));
  s.foot.appendChild(btn('Add to my plays', { cls:'pri', icon:'plus', onclick:()=>{
    const saved = importPlays([p]);
    s.close();
    if (saved.length){ toast('Added “' + saved[0].name + '” to your plays.'); go('/play/' + encodeURIComponent(saved[0].id)); }
    else storageFailed();
  } }));
}
