<!doctype html>
<html lang="en" data-appearance="dark" data-court="hardwood" data-render="flat">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set Play Trainer — learn basketball plays by running them</title>
<meta name="description" content="A basketball set-play trainer. Run a play beat by beat and get graded on position, spacing, ball location and action — or play as the point guard and direct your team-mates with calls. Includes a whiteboard designer for building and sharing your own plays.">
<meta name="theme-color" content="#12100e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e0702a'/%3E%3Cg fill='none' stroke='%2340200a' stroke-width='1.5' stroke-linecap='round'%3E%3Ccircle cx='16' cy='16' r='13'/%3E%3Cpath d='M3 16h26M16 3v26'/%3E%3Cpath d='M5.1 8.85Q16 21.1 26.9 8.85'/%3E%3Cpath d='M5.1 23.15Q16 10.9 26.9 23.15'/%3E%3C/g%3E%3C/svg%3E">

<style>
/* ============================================================================
   TOKENS — three orthogonal axes, deliberately independent:
     data-appearance = dark | light                            (app chrome)
     data-court      = hardwood | blueprint | chalkboard | neon (the floor)
     data-render     = flat | tilt                             (the renderer)
   Changing one axis must never disturb another.
   ========================================================================== */
:root{
  --bg:#12100e; --bg-2:#1a1714; --bg-3:#221d19;
  --line:#332c26; --line-2:#453b33;
  --ink:#f2ece6; --ink-2:#b7aa9d; --ink-3:#7d7168;
  --accent:#ff8a3d; --accent-ink:#1a1005;
  --good:#4ec97f; --warn:#ffc247; --bad:#ff6b5e;
  --radius:10px; --radius-sm:7px;
  --shadow:0 8px 28px rgba(0,0,0,.42);
  --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --rail-l:262px; --rail-r:336px;
}
html[data-appearance="light"]{
  --bg:#f4f1ec; --bg-2:#ffffff; --bg-3:#eae4db;
  --line:#dcd3c7; --line-2:#c6b9a8;
  --ink:#1d1815; --ink-2:#5d5248; --ink-3:#877a6d;
  --accent:#c85a12; --accent-ink:#fff6ee;
  --good:#1f8a4c; --warn:#96680a; --bad:#c0392b;
  --shadow:0 8px 24px rgba(60,40,20,.13);
}
html[data-court="hardwood"]{
  --c-floor:#c07f43; --c-floor-2:#a96a33; --c-line:#f6ead9; --c-paint:#9b5c2a;
  --c-arc:#f6ead9; --c-glow:rgba(255,236,208,.16);
}
html[data-court="blueprint"]{
  --c-floor:#0e2140; --c-floor-2:#0a1a33; --c-line:#7fd4ff; --c-paint:#123058;
  --c-arc:#7fd4ff; --c-glow:rgba(127,212,255,.14);
}
html[data-court="chalkboard"]{
  --c-floor:#22312b; --c-floor-2:#1a2721; --c-line:#e8f0e4; --c-paint:#2b4038;
  --c-arc:#e8f0e4; --c-glow:rgba(232,240,228,.10);
}
html[data-court="neon"]{
  --c-floor:#0a0710; --c-floor-2:#0f0a1a; --c-line:#ff3ea5; --c-paint:#170d26;
  --c-arc:#34e7ff; --c-glow:rgba(255,62,165,.18);
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,select,input,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.011em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------------------------------------------------------------- shell -- */
.app{
  display:grid; height:100dvh; min-height:0;
  grid-template-columns:var(--rail-l) minmax(0,1fr) var(--rail-r);
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"hd hd hd" "lf ct rt";
}
.hd{
  grid-area:hd; display:flex; align-items:center; gap:13px;
  padding-block:9px; padding-inline:14px;
  border-bottom:1px solid var(--line); background:var(--bg-2); min-height:52px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand svg{width:22px;height:22px;flex:none}
.brand em{font-style:normal;color:var(--ink-3);font-weight:500}
.modes{display:flex;gap:3px;background:var(--bg-3);padding:3px;border-radius:var(--radius);border:1px solid var(--line);flex-wrap:wrap}
.modes button{
  border:0;background:transparent;color:var(--ink-2);cursor:pointer;
  padding:6px 12px;border-radius:var(--radius-sm);font-weight:600;font-size:13.5px;white-space:nowrap;
}
.modes button:hover{color:var(--ink)}
.modes button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.hd-sp{flex:1 1 auto;min-width:0}

/* ---------------------------------------------------------------- rails -- */
.rail{
  display:flex; flex-direction:column; gap:11px; min-height:0;
  overflow:auto; overscroll-behavior:contain;
  padding-block:12px; padding-inline:12px; background:var(--bg-2);
}
.rail-l{grid-area:lf;border-right:1px solid var(--line)}
.rail-r{grid-area:rt;border-left:1px solid var(--line)}
.card{
  background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius);
  padding-block:11px; padding-inline:11px; min-height:0;
}
/* flex-basis 0 is load-bearing: with `auto` a tall panel drags its siblings. */
.card.grow{flex:1 1 0;display:flex;flex-direction:column;overflow:hidden}
.card.grow > .scroll{flex:1 1 0;overflow:auto;min-height:0;margin-inline:-4px;padding-inline:4px}
.card > .scroll.capped{max-height:32vh;overflow:auto;margin-inline:-4px;padding-inline:4px}
.spotgrid{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:11.5px;color:var(--ink-2);margin-top:8px}
.spotgrid b{font-family:var(--mono);color:var(--accent);font-weight:700;font-size:11px}
.livechk{display:flex;flex-direction:column;gap:5px;margin-top:11px}
.livechk .lrow{
  display:flex;gap:7px;align-items:center;font-size:12px;line-height:1.35;
  background:var(--bg);border:1px solid var(--line);border-left:2px solid var(--good);
  border-radius:var(--radius-sm);padding-block:6px;padding-inline:9px;color:var(--ink-2);
}
.livechk .lrow.warn{border-left-color:var(--warn)}
.livechk .lrow b{color:var(--ink);font-family:var(--mono);font-weight:700}
.roster{display:flex;flex-direction:column;gap:4px;margin-top:7px}
.rrow{
  display:flex;gap:8px;align-items:center;font-size:12px;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding-block:5px;padding-inline:9px;color:var(--ink-3);
}
.rrow .pill{
  flex:none;width:17px;height:17px;border-radius:99px;display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;font-weight:700;color:#1a1005;
}
.rrow .st{margin-left:auto;font-size:11px;font-weight:650}
.rrow.moved{color:var(--ink-2)}
.rrow.moved .st{color:var(--good)}
.rrow.still .st{color:var(--warn)}
.card > h3{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
  margin-bottom:9px;display:flex;align-items:center;gap:7px;font-weight:700;
}
.card > h3 .tag{margin-left:auto;text-transform:none;letter-spacing:0;color:var(--ink-2);font-weight:600;font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58%}

/* --------------------------------------------------------------- court --- */
.ct{grid-area:ct;display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px;gap:10px}
.stage{
  flex:1 1 0;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  border-radius:var(--radius);overflow:hidden;background:var(--bg-3);border:1px solid var(--line);
}
#court{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.stage-note{position:absolute;inset-inline:0;top:0;display:flex;justify-content:center;pointer-events:none;padding-block:9px}
.stage-note b{
  background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--line-2);color:var(--ink);
  padding-block:4px;padding-inline:12px;border-radius:99px;font-size:12.5px;font-weight:600;
  backdrop-filter:blur(6px);text-align:center;
}
/* the bar under the court keeps the centre column full-height: no dead space */
.bar{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);
  padding-block:9px;padding-inline:10px;
}
.bar .sp{flex:1 1 auto;min-width:0}
.bar-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}

/* -------------------------------------------------------------- widgets -- */
.btn{
  border:1px solid var(--line-2);background:var(--bg-3);color:var(--ink);
  border-radius:var(--radius-sm);padding-block:7px;padding-inline:13px;
  cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;
  transition:background .13s ease,border-color .13s ease,color .13s ease;
}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding-block:4px;padding-inline:9px;font-size:12.5px}
.btn.ico{padding-inline:8px}
.btn.wide{width:100%}
select,input[type=text],textarea{
  background:var(--bg);border:1px solid var(--line-2);color:var(--ink);
  border-radius:var(--radius-sm);padding-block:6px;padding-inline:8px;font-size:13.5px;width:100%;
}
select{cursor:pointer}
textarea{resize:vertical;min-height:58px;line-height:1.45;font-size:13px}
label.fld{display:block;margin-bottom:8px}
label.fld > span{
  display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--ink-3);font-weight:700;margin-bottom:4px;
}
.row{display:flex;gap:7px;align-items:center}
.row > *{min-width:0}

/* play list */
.plist{display:flex;flex-direction:column;gap:5px}
.pitem{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding-block:8px;padding-inline:9px;cursor:pointer;color:inherit;
  transition:border-color .13s ease,background .13s ease;
}
.pitem:hover{border-color:var(--line-2)}
.pitem[aria-current="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,var(--bg))}
.pitem .nm{font-weight:640;font-size:13.5px;line-height:1.25}
.pitem .mt{font-size:11px;color:var(--ink-3);margin-top:2px}
.pitem .col{flex:1 1 auto;min-width:0}
.pitem .best{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);flex:none}
.dots{display:flex;gap:2px;flex:none}
.dots i{width:5px;height:5px;border-radius:99px;background:var(--line-2);display:block}
.dots i.on{background:var(--accent)}

/* beat list */
.beats{display:flex;flex-direction:column;gap:4px}
.beat{
  display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;color:inherit;
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding-block:7px;padding-inline:8px;cursor:pointer;font-size:13px;
}
.beat[aria-current="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--bg))}
.beat .n{
  flex:none;width:19px;height:19px;border-radius:5px;background:var(--bg-3);
  display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-2);border:1px solid var(--line);
}
.beat[aria-current="true"] .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.beat .t{flex:1 1 auto;min-width:0;line-height:1.35;font-weight:600}
.beat .sc{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:700}

/* score readouts */
.score-big{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.score-big b{font-size:34px;font-weight:750;letter-spacing:-.03em;line-height:1}
.score-big .gr{font-size:14px;font-weight:750;padding-block:3px;padding-inline:9px;border-radius:99px;
  background:var(--bg);border:1px solid var(--line-2)}
.meters{display:flex;flex-direction:column;gap:7px}
.meter .lb{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-bottom:3px}
.meter .lb b{font-family:var(--mono);color:var(--ink);font-weight:700}
.meter .tr{height:5px;border-radius:99px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.meter .fl{height:100%;border-radius:99px;transition:width .35s cubic-bezier(.3,.9,.35,1)}

.notes{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.note{
  display:flex;gap:8px;font-size:12.5px;line-height:1.45;color:var(--ink-2);
  background:var(--bg);border:1px solid var(--line);border-left:2px solid var(--line-2);
  border-radius:var(--radius-sm);padding-block:7px;padding-inline:9px;
}
.note.bad{border-left-color:var(--bad)}
.note.warn{border-left-color:var(--warn)}
.note.good{border-left-color:var(--good)}
.note .who{
  flex:none;width:18px;height:18px;border-radius:99px;display:grid;place-items:center;
  font-family:var(--mono);font-size:10.5px;font-weight:700;
  background:var(--bg-3);border:1px solid var(--line-2);color:var(--ink);
}
.coach{font-size:13px;line-height:1.55;color:var(--ink-2);border-left:2px solid var(--accent);padding-inline-start:10px}
.coach b{color:var(--ink);font-weight:640}
.mistake{margin-top:8px;font-size:12px;line-height:1.5;color:var(--ink-3);border-top:1px dashed var(--line-2);padding-top:8px}
.mistake b{color:var(--warn);font-weight:700;text-transform:uppercase;font-size:10px;letter-spacing:.08em}

.hist{display:flex;flex-direction:column;gap:3px}
.hrow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2)}
.hrow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .sc{font-family:var(--mono);font-weight:700;flex:none}
.hrow .dt{font-size:10.5px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}
.empty{color:var(--ink-3);font-size:12.5px;line-height:1.5;text-align:center;padding-block:14px}

/* action tagger / call composer */
.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.act select{flex:1 1 auto;min-width:104px}
.act select.who{flex:0 0 68px;min-width:0}
.calls{display:flex;flex-direction:column;gap:5px;margin-block:9px}
.call{
  display:flex;gap:8px;align-items:center;font-size:12.5px;line-height:1.4;
  background:var(--bg);border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:var(--radius-sm);padding-block:6px;padding-inline:9px;
}
.call.ok{border-left-color:var(--good)}
.call.no{border-left-color:var(--bad)}
.call .tx{flex:1 1 auto;min-width:0}
.call .x{
  flex:none;background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:15px;
  line-height:1;padding:2px 4px;border-radius:4px;
}
.call .x:hover{color:var(--bad);background:var(--bg-3)}
.pcalls{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}

/* designer beat chips */
.bchips{display:flex;flex-wrap:wrap;gap:5px}
.bchip{
  display:flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--line);
  border-radius:99px;padding-block:4px;padding-inline:9px;font-size:12px;cursor:pointer;color:inherit;
}
.bchip[aria-current="true"]{border-color:var(--accent);color:var(--accent)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;display:flex;
  align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px)}
.modal .box{
  background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow);
  max-width:600px;width:100%;max-height:86dvh;overflow:auto;padding-block:18px;padding-inline:18px;
}
.modal h2{font-size:19px;margin-bottom:5px}
.modal .sub{color:var(--ink-2);font-size:13.5px;margin-bottom:15px;line-height:1.55}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.seth{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);
  font-weight:700;margin-top:16px;margin-bottom:8px;padding-top:13px;border-top:1px solid var(--line);
}
.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:7px}
.sw{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.sw input[type=color]{
  flex:none;width:32px;height:26px;padding:2px;cursor:pointer;
  background:var(--bg);border:1px solid var(--line-2);border-radius:6px;
}
.sw input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.sw input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
.codebox{
  width:100%;font-family:var(--mono);font-size:11.5px;line-height:1.45;background:var(--bg);
  border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:9px;min-height:86px;word-break:break-all;
}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin-block:14px}
.sumcell{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--radius);padding-block:10px;padding-inline:11px}
.sumcell .k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.sumcell .v{font-size:21px;font-weight:720;margin-top:3px;letter-spacing:-.02em}

.choices{display:flex;flex-direction:column;gap:7px}
.choice{
  width:100%;text-align:left;background:var(--bg);border:1px solid var(--line-2);
  border-radius:var(--radius-sm);padding-block:10px;padding-inline:12px;cursor:pointer;color:inherit;
  font-weight:600;font-size:13.5px;
}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--bg))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.choice:disabled{cursor:default}
.hint{font-size:11.5px;color:var(--ink-3);line-height:1.5}

/* --------------------------------------------------------- responsive --- */
@media (max-width:1240px){ :root{--rail-l:224px;--rail-r:302px} }
@media (max-width:1040px){
  body{overflow:auto}
  .app{
    grid-template-columns:1fr;
    grid-template-rows:auto auto minmax(420px,60dvh) auto;
    grid-template-areas:"hd" "lf" "ct" "rt";
    height:auto;min-height:100dvh;
  }
  .rail{overflow:visible;max-height:none}
  .rail-l{border-right:0;border-bottom:1px solid var(--line)}
  .rail-r{border-left:0;border-top:1px solid var(--line)}
  .card.grow{flex:0 0 auto}
  /* `.grow` is off here, so the scroll child has no free space to claim from
     flex:1 1 0 and would collapse the card to a bare header. */
  .card.grow > .scroll{flex:0 0 auto;height:auto;max-height:300px}
  .card > .scroll.capped{max-height:none}
  .hd{flex-wrap:wrap}
  .stage{min-height:380px}
}
@media (max-width:560px){
  .modes button{padding-inline:9px;font-size:12.5px}
  .brand em{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<div class="app">
  <header class="hd">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="var(--accent)"/>
        <g fill="none" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round">
          <circle cx="16" cy="16" r="13"/>
          <path d="M3 16h26M16 3v26"/>
          <path d="M5.1 8.85Q16 21.1 26.9 8.85"/>
          <path d="M5.1 23.15Q16 10.9 26.9 23.15"/>
        </g>
      </svg>
      <span>Set Play Trainer <em>· v1</em></span>
    </div>
    <nav class="modes" id="modes" role="tablist" aria-label="Mode">
      <button role="tab" data-mode="learn"   aria-selected="false">Learn</button>
      <button role="tab" data-mode="run"     aria-selected="true">Run It</button>
      <button role="tab" data-mode="general" aria-selected="false">Floor General</button>

   Set Play Trainer
   ---------------------------------------------------------------------------
   The one rule that keeps this honest:

       THE GRADING ENGINE NEVER SEES A PIXEL.

   Everything upstream of the renderer is in real court feet. gradeBeat() is
   pure, DOM-free and view-independent, which is what lets a second renderer
   (the tilted 2.5D view) drop in with no engine changes — and what lets Floor
   General mode feed the very same grader from a completely different input
   method. Pointer input is converted to feet by asking the *rendered group*
   for its screen CTM, so whatever affine transform a renderer applies is
   inverted for free.
   ========================================================================== */

   The basket is drawn at the top, which is what every coaching diagram does. */

  nba:  { key:'nba',  name:'NBA',         width:50,   len:47,   hoopY:5.25, rimR:.75,
          bbY:4,    bbHalf:3,    paintHalf:8,    ftY:19,    ftR:6,   raR:4,

  fiba: { key:'fiba', name:'FIBA',        width:49.2, len:47.2, hoopY:5.25, rimR:.74,
          bbY:3.94, bbHalf:2.95, paintHalf:8.04, ftY:19.03, ftR:5.9, raR:4.1,

  hs:   { key:'hs',   name:'High school', width:50,   len:42,   hoopY:5.25, rimR:.75,

/* Derived, never hand-typed: where the arc meets the baseline when there is no
   straight corner segment, and where the straight segment ends when there is. */
function cornerX(c){
  return c.straightCorner ? c.corner3X : Math.sqrt(Math.max(0, c.arc3*c.arc3 - c.hoopY*c.hoopY));
}
function breakY(c){
  if (!c.straightCorner) return 0;
  return c.hoopY + Math.sqrt(Math.max(0, c.arc3*c.arc3 - c.corner3X*c.corner3X));
}

  'Warm court':   { 1:'#ffd166', 2:'#ef8354', 3:'#e56b6f', 4:'#b56576', 5:'#eaac8b', d:'#7d8491' },

}
/* A user can pick any colour, so the number on a token picks its own ink. */
function readableInk(hex){
  if (!HEX.test(hex)) return '#141014';
  const v = i => parseInt(hex.slice(1+i*2, 3+i*2), 16) / 255;
  const lin = u => u <= .03928 ? u/12.92 : Math.pow((u+.055)/1.055, 2.4);
  const L = .2126*lin(v(0)) + .7152*lin(v(1)) + .0722*lin(v(2));
  return L > .42 ? '#141014' : '#ffffff';
}

/* --------------------------------------------------------------- helpers -- */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const dist = (a,b)=> Math.hypot(a[0]-b[0], a[1]-b[1]);
const lerp = (a,b,t)=> a + (b-a)*t;
const round3 = v => Math.round(v*1000)/1000;
function el(tag, attrs, kids){
  const n = document.createElement(tag);
  for (const k in (attrs||{})){
    const v = attrs[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'value' && (tag === 'input' || tag === 'textarea')) n.value = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of (kids||[])) if (c) n.appendChild(c);
  return n;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(prefix){
  const r = new Uint8Array(6);
  if (self.crypto && self.crypto.getRandomValues) crypto.getRandomValues(r);
  else for (let i=0;i<r.length;i++) r[i] = Math.floor(Math.random()*256);
  return prefix + '-' + Array.from(r, b=>b.toString(16).padStart(2,'0')).join('');
}
function cloneSpots(s){ const o = {}; for (const k of SLOTS) o[k] = [s[k][0], s[k][1]]; return o; }

/* ================================================================= STORE ==
   Every storage access is wrapped: a private window throws on read as well as
   write, and the app has to keep working when it does.
   ======================================================================== */
const K_PLAYS = 'hoops.plays.v1', K_HIST = 'hoops.history.v1', K_SET = 'hoops.settings.v1';
const HIST_CAP = 200;
const Store = {
  _get(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if (raw === null) return fallback;
      const v = JSON.parse(raw);
      return (v === null || v === undefined) ? fallback : v;
    }catch(e){ return fallback; }
  },
  _set(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; }
  },
  plays(){ const v = this._get(K_PLAYS, []); return Array.isArray(v) ? v : []; },
  savePlay(play){
    const all = this.plays();
    const i = all.findIndex(p => p.id === play.id);
    if (i >= 0) all[i] = play; else all.push(play);
    return this._set(K_PLAYS, all);
  },
  deletePlay(id){ return this._set(K_PLAYS, this.plays().filter(p => p.id !== id)); },
  history(){ const v = this._get(K_HIST, []); return Array.isArray(v) ? v : []; },
  addHistory(rec){ const all = this.history(); all.unshift(rec); return this._set(K_HIST, all.slice(0, HIST_CAP)); },
  bestFor(playId){
    let best = null;
    for (const h of this.history()) if (h.playId === playId && (best === null || h.score > best)) best = h.score;
    return best;
  },
  settings(){
    const d = { appearance:'dark', court:'hardwood', render:'flat', spec:'nba', hints:'standard',
                defence:'off', colors: Object.assign({}, DEFAULT_COLORS) };
    const v = this._get(K_SET, {});
    const out = Object.assign(d, (v && typeof v === 'object') ? v : {});
    out.colors = Object.assign({}, DEFAULT_COLORS, (out.colors && typeof out.colors === 'object') ? out.colors : {});
    return out;
  },
  saveSettings(s){ return this._set(K_SET, s); }
};

/* --------------------------------------------------------- share codes --- */
function b64urlEncode(bytes){
  let s = ''; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(str){
  const s = str.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(s + '='.repeat((4 - s.length % 4) % 4));
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function encodePlay(play){
  const bytes = new TextEncoder().encode(JSON.stringify(play));
  if (typeof CompressionStream === 'function'){
    try{
      const cs = new CompressionStream('deflate-raw');
      const w = cs.writable.getWriter(); w.write(bytes); w.close();
      const buf = await new Response(cs.readable).arrayBuffer();
      return 'z' + b64urlEncode(new Uint8Array(buf));
    }catch(e){ /* fall through to raw */ }
  }
  return 'r' + b64urlEncode(bytes);
}
async function decodePlay(code){
  if (!code || code.length < 2) throw new Error('empty share code');
  const tag = code[0];
  let bytes = b64urlDecode(code.slice(1));
  if (tag === 'z'){
    if (typeof DecompressionStream !== 'function') throw new Error('this browser cannot read compressed share codes');
    const ds = new DecompressionStream('deflate-raw');
    const w = ds.writable.getWriter(); w.write(bytes); w.close();
    bytes = new Uint8Array(await new Response(ds.readable).arrayBuffer());
  } else if (tag !== 'r'){
    throw new Error('unrecognised share code');
  }
  return validatePlay(JSON.parse(new TextDecoder().decode(bytes)));
}

/* Anything arriving from a URL, a file or another person is untrusted input.
   Normalise it into the shape the engine expects, or refuse it outright. */
function validatePlay(raw){
  if (!raw || typeof raw !== 'object') throw new Error('not a play object');
  const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  const play = {
    id: (typeof raw.id === 'string' && raw.id) ? raw.id.slice(0,64) : uid('play'),
    name: String(raw.name || 'Untitled play').slice(0,80),
    formation: String(raw.formation || 'Custom').slice(0,40),
    difficulty: Math.min(3, Math.max(1, Math.round(num(raw.difficulty, 1)))),
    tags: Array.isArray(raw.tags) ? raw.tags.slice(0,6).map(t=>String(t).slice(0,24)) : [],
    blurb: String(raw.blurb || '').slice(0,700),
    custom: true, beats: []
  };
  const beats = Array.isArray(raw.beats) ? raw.beats.slice(0,12) : [];
  if (!beats.length) throw new Error('a play needs at least one beat');
  for (const b of beats){
    const spots = {};
    for (const s of SLOTS){
      const p = (b && b.spots) ? b.spots[s] : null;
      spots[s] = (Array.isArray(p) && p.length === 2)
        ? [ Math.max(-30, Math.min(30, num(p[0], 0))), Math.max(-2, Math.min(52, num(p[1], 20))) ]
        : [ (s-3)*8, 24 ];
    }
    const actions = (Array.isArray(b.actions) ? b.actions.slice(0,3) : []).map(a => {
      if (!a || !ACTION_LABEL[a.type] || a.type === 'none') return null;
      if (!SLOTS.includes(a.by)) return null;
      const out = { type:a.type, by:a.by };
      if (ACTION_NEEDS_FOR.has(a.type) && SLOTS.includes(a.for)) out.for = a.for;
      return out;
    }).filter(Boolean);
    play.beats.push({
      label: String((b && b.label) || 'Beat').slice(0,48),
      ball: SLOTS.includes(b && b.ball) ? b.ball : 1,
      spots, actions,
      keyPlayers: Array.isArray(b && b.keyPlayers) ? b.keyPlayers.filter(s=>SLOTS.includes(s)) : [],
      spacingExempt: Array.isArray(b && b.spacingExempt)
        ? b.spacingExempt.filter(p => Array.isArray(p) && p.length===2 && SLOTS.includes(p[0]) && SLOTS.includes(p[1]))
        : [],
      coaching: String((b && b.coaching) || '').slice(0,700),
      mistake:  String((b && b.mistake)  || '').slice(0,500)
    });
  }
  return play;
}

/* ================================================================= GRADE ==
   Pure. No DOM, no globals beyond the constant tables, no knowledge that a
   renderer or a UI exists. Same input, same output, forever.
   ======================================================================== */
const TOL = {
  screener: { ok:2.5, fail:7  },   // a screen 5 ft off the mark is not a screen
  cutter:   { ok:3.5, fail:9  },
  spot:     { ok:4.5, fail:11 }    // a corner shooter has room to breathe
};
const WEIGHTS = { pos:.55, ball:.15, act:.20, space:.10 };
const MIN_SPACING = 12;   // feet between non-contact team-mates
const PAINT_MAX   = 2;    // offensive players allowed in the paint at once

function roleForSlot(beat, slot){
  for (const a of beat.actions || []){
    if (a.by === slot && CONTACT_ACTIONS.has(a.type)) return 'screener';
    if (a.by === slot) return 'cutter';
    if (a.for === slot) return 'cutter';
  }
  if (beat.ball === slot) return 'cutter';
  return 'spot';
}
function positionScore(user, ref, role){
  const t = TOL[role] || TOL.spot;
  const d = dist(user, ref);
  if (d <= t.ok) return 1;
  return clamp01((t.fail - d) / (t.fail - t.ok));
}
function exemptPairs(beat){
  const set = new Set();
  const add = (a,b) => set.add(a < b ? a+'-'+b : b+'-'+a);
  for (const a of beat.actions || []) if (CONTACT_ACTIONS.has(a.type) && a.by && a.for) add(a.by, a.for);
  for (const p of beat.spacingExempt || []) add(p[0], p[1]);
  return set;
}
function spacingReport(spots, beat, court){
  const ex = exemptPairs(beat);
  const violations = [];
  for (let i = 0; i < SLOTS.length; i++){
    for (let j = i+1; j < SLOTS.length; j++){
      const a = SLOTS[i], b = SLOTS[j];
      if (ex.has(a+'-'+b)) continue;
      const d = dist(spots[a], spots[b]);
      if (d < MIN_SPACING) violations.push({ kind:'tight', a, b, d });
    }
  }
  const inPaint = SLOTS.filter(s => Math.abs(spots[s][0]) <= court.paintHalf && spots[s][1] <= court.ftY);
  if (inPaint.length > PAINT_MAX) violations.push({ kind:'paint', who:inPaint });
  return { violations, score: clamp01(1 - .34 * violations.length) };
}
function scoreActions(userActs, refActs){
  const u = (userActs || []).filter(a => a && a.type && a.type !== 'none');
  const r = (refActs  || []).filter(a => a && a.type && a.type !== 'none');
  if (!r.length && !u.length) return 1;         // correctly identified a quiet beat
  if (!r.length || !u.length) return 0;
  const used = new Set();
  let total = 0;
  for (const ua of u){
    let best = 0, bestI = -1;
    r.forEach((ra, i) => {
      if (used.has(i)) return;
      let s = 0;
      if (ra.type === ua.type){
        s = .25;
        if (ra.by === ua.by){
          s = .6;
          if (!ACTION_NEEDS_FOR.has(ra.type) || ra.for === ua.for) s = 1;
        }
      }
      if (s > best){ best = s; bestI = i; }
    });
    if (bestI >= 0) used.add(bestI);
    total += best;
  }
  return clamp01(total / Math.max(r.length, u.length));
}
function describeMiss(user, ref){
  const d = dist(user, ref), dx = user[0]-ref[0], dy = user[1]-ref[1], ft = d.toFixed(1);
  if (Math.abs(dy) >= Math.abs(dx)) return dy > 0 ? `${ft} ft too far from the basket` : `${ft} ft too deep toward the basket`;
  const outward = (ref[0] === 0) ? (dx > 0) : (Math.sign(dx) === Math.sign(ref[0]));
  return outward ? `${ft} ft too wide` : `${ft} ft too far inside`;
}
/**
 * Grade one beat.
 * @param {{spots:Object, ball:number, actions:Array}} attempt   court feet
 * @param {Object} beat   reference beat
 * @param {Object} court  court spec (only the paint test uses it)
 */
function gradeBeat(attempt, beat, court){
  const parts = {}, per = {};
  let weighted = 0, weightSum = 0;
  for (const s of SLOTS){
    const role = roleForSlot(beat, s);
    const sc = positionScore(attempt.spots[s], beat.spots[s], role);
    const w = (beat.keyPlayers || []).includes(s) ? 1.5 : 1;
    per[s] = { score:sc, role, weight:w, dist:Math.round(dist(attempt.spots[s], beat.spots[s])*100)/100 };
    weighted += sc*w; weightSum += w;
  }
  parts.pos   = weightSum ? weighted/weightSum : 0;
  parts.ball  = attempt.ball === beat.ball ? 1 : 0;
  parts.act   = scoreActions(attempt.actions, beat.actions);
  const sp    = spacingReport(attempt.spots, beat, court);
  parts.space = sp.score;

  const total = parts.pos*WEIGHTS.pos + parts.ball*WEIGHTS.ball + parts.act*WEIGHTS.act + parts.space*WEIGHTS.space;

  /* Diagnostics: geometry first, coaching cue second. */
  const notes = [];
  for (const s of SLOTS){
    if (per[s].score >= .85) continue;
    notes.push({ slot:s, level: per[s].score < .4 ? 'bad' : 'warn',
      text:`${SLOT_NAME[s]} was ${describeMiss(attempt.spots[s], beat.spots[s])}.` });
  }
  if (!parts.ball) notes.push({ slot:beat.ball, level:'bad',
    text:`The ball belongs with ${beat.ball} on this beat, not ${attempt.ball}.` });
  if (parts.act < 1){
    const want = (beat.actions || []).length
      ? beat.actions.map(a => ACTION_LABEL[a.type].toLowerCase() + ' by ' + a.by + (a.for ? ' for ' + a.for : '')).join(', ')
      : 'no action at all';
    notes.push({ slot:'!', level: parts.act === 0 ? 'bad' : 'warn', text:`The action here is ${want}.` });
  }
  for (const v of sp.violations){
    notes.push(v.kind === 'paint'
      ? { slot:'!', level:'warn', text:`${v.who.join(', ')} are all in the paint. Two at most, or there is nowhere to drive.` }
      : { slot:'!', level:'warn', text:`${v.a} and ${v.b} are only ${v.d.toFixed(1)} ft apart. One defender guards both.` });
  }
  if (!notes.length) notes.push({ slot:'✓', level:'good',
    text:'Every spot inside tolerance, spacing legal, right action. Clean beat.' });

  return { total, parts, per, spacing:sp, notes };
}
function letterFor(score){
  const p = score*100;
  if (p >= 93) return 'A';
  if (p >= 87) return 'A-';
  if (p >= 80) return 'B+';
  if (p >= 73) return 'B';
  if (p >= 66) return 'B-';
  if (p >= 58) return 'C+';
  if (p >= 50) return 'C';
  if (p >= 40) return 'D';
  return 'F';
}
/* Later beats are harder and matter more, so they carry slightly more weight. */
function gradePlay(beatScores){
  if (!beatScores.length) return 0;
  let num = 0, den = 0;
  beatScores.forEach((s,i)=>{ const w = 1 + i*0.12; num += s*w; den += w; });
  return num/den;
}

/* ========================================================= FLOOR GENERAL ==
   You are the 1. You place only yourself; everyone else moves because you told
   them to. A call is resolved against the beat's intent:

     - a call that MATCHES the intent sends that team-mate to the play's spot.
       Your team-mates know the play; a correct call means they execute it.
     - a call that does NOT match sends them literally where you said, which
       will grade exactly as badly as it deserves.
     - anyone you never called stays where they were, so forgetting to move
       someone costs you. That is the lesson.

   The output is an ordinary {spots, ball, actions} attempt, so it goes through
   gradeBeat() untouched. The engine has no idea this mode exists.
   ======================================================================== */
const SPOT_MAP = {
  'corner':       s => [22*s, 5],
  'wing':         s => [21*s, 22],
  'slot':         s => [11*s, 29],
  'top':          _ => [0, 30],
  'trail':        _ => [0, 36],
  'elbow':        s => [8*s, 19],
  'block':        s => [8*s, 6],
  'short corner': s => [14*s, 6],
  'dunker':       s => [9*s, 9],
  'nail':         _ => [0, 19],
  'rim':          _ => [0, 8]
};
const SPOT_KEYS = Object.keys(SPOT_MAP);
const SIDED = new Set(['corner','wing','slot','elbow','block','short corner','dunker']);
const SNAP_FT = 6.5;   // how close a called destination must be to count as right

function sideSign(side){ return side === 'left' ? -1 : 1; }
function spotFor(where, side){ return SPOT_MAP[where](sideSign(side)); }
function callText(c){
  if (c.v === 'send')       return `${c.who} → ${SIDED.has(c.where) ? c.side + ' ' : ''}${c.where}`;
  if (c.v === 'ballscreen') return `${c.who} ball screen, my ${c.side}`;
  if (c.v === 'offball')    return `${c.who} ${ACTION_LABEL[c.type].toLowerCase()} for ${c.for}`;
  if (c.v === 'clear')      return `clear the ${c.side} side`;
  return '?';
}
/**
 * @param {Object} baseSpots  where everyone currently stands
 * @param {Array}  pgPos      where the user put the 1
 * @param {Array}  calls
 * @param {Object} beat       the reference beat, used only to judge intent
 * @returns {{spots, actions, log}}
 */
function resolveCalls(baseSpots, pgPos, calls, beat){
  const spots = cloneSpots(baseSpots);
  spots[1] = [pgPos[0], pgPos[1]];
  const actions = [];
  const log = [];
  const refActs = beat.actions || [];

  for (const c of (calls || [])){
    let ok = false, note = '', action = null, who = c.who;

    if (c.v === 'send'){
      const target = spotFor(c.where, c.side);
      const ref = beat.spots[who];
      ok = dist(target, ref) <= SNAP_FT;
      spots[who] = ok ? [ref[0], ref[1]] : target;
      note = ok ? 'right spot for this beat' : 'the play does not want him there';
    }
    else if (c.v === 'ballscreen'){
      const want = refActs.find(a => a.type === 'screen' && a.by === who && a.for === 1);
      if (want){
        const ref = beat.spots[who];
        const refSide = (ref[0] - beat.spots[1][0]) >= 0 ? 'right' : 'left';
        ok = refSide === c.side;
      }
      if (ok){
        spots[who] = [beat.spots[who][0], beat.spots[who][1]];
        note = 'right screener, right side';
      } else {
        spots[who] = [pgPos[0] + 5*sideSign(c.side), pgPos[1] - 1.5];
        note = want ? 'right screener, wrong side' : 'not the screener on this beat';
      }
      action = { type:'screen', by:who, for:1 };
    }
    else if (c.v === 'offball'){
      const want = refActs.find(a => a.type === c.type && a.by === who && a.for === c.for);
      if (want){
        ok = true;
        spots[who] = [beat.spots[who][0], beat.spots[who][1]];
        spots[c.for] = [beat.spots[c.for][0], beat.spots[c.for][1]];
        note = 'exactly the off-ball action this beat needs';
      } else {
        /* Put the screener between the target and the rim: a plausible but, on
           this beat, wrong place to be. */
        const t = spots[c.for];
        spots[who] = [ (t[0] + beat.spots[1][0])/2, (t[1] + beat.spots[1][1])/2 ];
        note = 'no such action on this beat';
      }
      action = { type:c.type, by:who, for:c.for };
    }
    else if (c.v === 'clear'){
      const sgn = sideSign(c.side);
      /* "Everybody out" never means the big who is screening for you. Real
         point guards do not wave off their own ball screen. */
      const keep = new Set([1]);
      for (const a of refActs) if (CONTACT_ACTIONS.has(a.type) && a.for === 1) keep.add(a.by);
      let moved = 0, right = 0;
      for (const s of SLOTS){
        if (keep.has(s)) continue;
        if (Math.sign(spots[s][0]) !== sgn || Math.abs(spots[s][0]) < 4) continue;
        moved++;
        const ref = beat.spots[s];
        /* Clearing is correct for this player if the play really does want him
           off that side. */
        if (Math.sign(ref[0]) !== sgn || Math.abs(ref[0]) < 4){ spots[s] = [ref[0], ref[1]]; right++; }
        else spots[s] = [-spots[s][0], spots[s][1]];
      }
      ok = moved > 0 && right === moved;
      note = moved === 0 ? 'nobody needed to move off that side'
           : ok ? 'everyone who had to move, moved'
           : `${moved-right} of them belonged on that side`;
    }
    log.push({ call:c, ok, note, text:callText(c) });
    if (action) actions.push(action);
  }
  return { spots, actions, log };
}


/* ================================================================ DEFENCE ==
   Defenders are DERIVED from the offensive shape, never authored. That means
   every play — including one you design yourself — gets a defence for free,
   and the defence reacts to where YOU actually put people rather than to some
   stored ideal. All five wear one colour, because as an offensive player you
   read the shape of a defence, not its individuals.

   Pure functions. They never touch the DOM, and they never touch the score:
   defenders are a reading layer, not a graded one.
   ========================================================================= */
const D_ON_BALL = 3.0;     // how tight the on-ball defender plays
const D_MIN_GAP = 3.6;     // closest an off-ball defender sits to his man
const D_MAX_GAP = 9.5;     // furthest he sags in help
const D_PER_FT  = .20;     // extra sag per foot of distance from the ball
const D_HOOP_BIAS = .58;   // ball-you-man: how much of the gap points at the rim

function unitVec(from, to){
  const dx = to[0]-from[0], dy = to[1]-from[1], m = Math.hypot(dx, dy);
  return m < 1e-6 ? [0,0] : [dx/m, dy/m];
}
/* One defender's steady-state position, on the ball-you-man line. */
function defenderPos(slot, spots, ballSlot, court){
  const man = spots[slot], hoop = [0, court.hoopY];
  if (slot === ballSlot){
    const u = unitVec(man, hoop);
    return clampCourt([man[0] + u[0]*D_ON_BALL, man[1] + u[1]*D_ON_BALL], court);
  }
  const ball = spots[ballSlot];
  const gap = Math.max(D_MIN_GAP, Math.min(D_MAX_GAP, D_MIN_GAP + dist(man, ball)*D_PER_FT));
  const uh = unitVec(man, hoop), ub = unitVec(man, ball);
  let vx = uh[0]*D_HOOP_BIAS + ub[0]*(1-D_HOOP_BIAS);
  let vy = uh[1]*D_HOOP_BIAS + ub[1]*(1-D_HOOP_BIAS);
  const m = Math.hypot(vx, vy) || 1;
  return clampCourt([man[0] + vx/m*gap, man[1] + vy/m*gap], court);
}
/* Nudge a defender clear of the others so a blown coverage is never rendered
   underneath the token that caused it. */
function separate(p, victim, spots, ballSlot, court){
  let out = [p[0], p[1]];
  for (let pass = 0; pass < 6; pass++){
    let moved = false;
    for (const s of SLOTS){
      if (s === victim) continue;
      const other = defenderPos(s, spots, ballSlot, court);
      const dx = out[0]-other[0], dy = out[1]-other[1];
      const dd = Math.hypot(dx, dy);
      if (dd >= 3.0) continue;
      const u = dd < 1e-6 ? [0, 1] : [dx/dd, dy/dd];
      out = [ out[0] + u[0]*(3.0-dd), out[1] + u[1]*(3.0-dd) ];
      moved = true;
    }
    if (!moved) break;
  }
  return out;
}
function clampCourt(p, court){
  return [ Math.max(-court.width/2 + .6, Math.min(court.width/2 - .6, p[0])),
           Math.max(.6, Math.min(court.len - .6, p[1])) ];
}
/* How late a defender is to react. Being screened costs you the most; guarding
   the screener costs a little; everyone else is just half a step behind. */
function defenderLag(slot, beat){
  for (const a of (beat && beat.actions) || []){
    if (CONTACT_ACTIONS.has(a.type) && a.for === slot) return .55;
    if (CONTACT_ACTIONS.has(a.type) && a.by  === slot) return .28;
  }
  return .15;
}

const MISTAKE_LABEL = {
  caught:   'caught on the screen',
  switched: 'blown switch',
  overhelp: 'over-help',
  ballwatch:'ball-watching'
};
/* Which coverage errors this particular beat could plausibly produce. */
function mistakeOptions(beat, spots, ballSlot){
  const out = [];
  for (const a of (beat.actions || [])){
    if (a.type !== 'screen' || !a.for) continue;
    out.push({ type:'caught',   victim:a.for, by:a.by });
    out.push({ type:'switched', victim:a.for, by:a.by });
  }
  const away = SLOTS.filter(x => x !== ballSlot)
    .sort((a,b) => dist(spots[b], spots[ballSlot]) - dist(spots[a], spots[ballSlot]));
  if (away[0]) out.push({ type:'overhelp',  victim:away[0] });
  if (away[1]) out.push({ type:'ballwatch', victim:away[1] });
  return out;
}
/**
 * Apply one coverage error and report the window it opens.
 * @returns {{type, victim, defender:[x,y], space:number, where:string, text:string}}
 */
function applyMistake(opt, spots, ballSlot, court){
  const man = spots[opt.victim];
  let d = defenderPos(opt.victim, spots, ballSlot, court);
  if (opt.type === 'caught' || opt.type === 'switched'){
    /* Stuck on the screen: he ends up on the far side of the screener from his
       man, which is both what happens and what makes him visible. */
    const scr = spots[opt.by] || spots[ballSlot];
    const u = unitVec(man, scr);
    d = (u[0] === 0 && u[1] === 0)
      ? [d[0], d[1] + 4.6]
      : [scr[0] + u[0]*2.3, scr[1] + u[1]*2.3];
  } else {
    /* Helped too far and cannot recover: pull the defender toward the ball. */
    const u = unitVec(d, spots[ballSlot]);
    const pull = opt.type === 'overhelp' ? 6.2 : 4.4;
    d = [d[0] + u[0]*pull, d[1] + u[1]*pull];
  }
  d = separate(d, opt.victim, spots, ballSlot, court);
  d = clampCourt(d, court);
  const space = dist(d, man);
  const where = nearestSpotName(man);
  const who = opt.victim;
  const text = opt.type === 'caught'
      ? `X${who} got caught on ${opt.by}’s screen — ${who} has ${space.toFixed(1)} ft at the ${where}.`
    : opt.type === 'switched'
      ? `${opt.by} and ${who} switched late and nobody picked ${who} up — ${space.toFixed(1)} ft at the ${where}.`
    : opt.type === 'overhelp'
      ? `X${who} over-helped on the ball — ${who} is open by ${space.toFixed(1)} ft at the ${where}.`
      : `X${who} ball-watched — ${who} slipped to ${space.toFixed(1)} ft at the ${where}.`;
  return { type:opt.type, victim:who, by:opt.by, defender:d, space, where, text };
}
/* Name a point using the same vocabulary Floor General calls use. */
function nearestSpotName(p){
  let best = 'floor', bd = Infinity;
  for (const key of SPOT_KEYS){
    for (const sg of (SIDED.has(key) ? [-1,1] : [1])){
      const t = SPOT_MAP[key](sg);
      const d = dist(t, p);
      if (d < bd){ bd = d; best = (SIDED.has(key) ? (sg < 0 ? 'left ' : 'right ') : '') + key; }
    }
  }
  return best;
}
/**
 * The whole defence for one frame.
 * @param spots  current offensive positions
 * @param prev   positions at the start of the move (for reaction lag), or null
 * @param t      tween progress 0..1
 */
function buildDefence(spots, prev, t, beat, ballSlot, court, mistake){
  const lagged = {};
  for (const s of SLOTS){
    if (!prev || t >= 1){ lagged[s] = spots[s]; continue; }
    const lag = defenderLag(s, beat);
    const ts = clamp01((t - lag) / (1 - lag));
    lagged[s] = [ lerp(prev[s][0], spots[s][0], ts), lerp(prev[s][1], spots[s][1], ts) ];
  }
  const out = {};
  for (const s of SLOTS) out[s] = defenderPos(s, lagged, ballSlot, court);
  if (mistake) out[mistake.victim] = mistake.defender;
  return out;
}

/* ============================================================== RENDERERS ==
   Both renderers implement the same interface:
     mount(svgEl, court) · draw(state) · toCourt(cx,cy) · fromCourt(x,y)
     hitTest(cx,cy) · destroy()
   toCourt() is implemented once, against the CTM of the transformed group, so
   the tilted renderer inherits an exact inverse for free. That is the whole
   trick that keeps dragging correct across views.
   ======================================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in (attrs||{})) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  return n;
}
/* A real basketball, face on. The recognisable pattern is the equator, the
   meridian, and two seams that BOW between opposite points on the rim — not
   four lines converging on the poles, which reads as a globe. */
function ballGlyph(cx, cy, r){
  const g = svg('g', { filter:'url(#tokShadow)' });
  const ink = '#3d1e08';
  g.appendChild(svg('circle', { cx, cy, r, fill:'url(#ballSkin)', stroke:ink, 'stroke-width':r*.10 }));
  const seams = svg('g', { fill:'none', stroke:ink, 'stroke-width':r*.115, 'stroke-linecap':'round' });
  seams.appendChild(svg('path', { d:`M ${cx-r} ${cy} H ${cx+r}` }));   // equator
  seams.appendChild(svg('path', { d:`M ${cx} ${cy-r} V ${cy+r}` }));   // meridian
  /* Both endpoints sit on the rim: 0.835^2 + 0.55^2 = 1. Kept well clear of the
     equator, or the three lines bundle together in the middle. */
  const ex = r*.835, ey = r*.55, bow = r*.15;
  seams.appendChild(svg('path', { d:`M ${cx-ex} ${cy-ey} Q ${cx} ${cy+bow} ${cx+ex} ${cy-ey}` }));
  seams.appendChild(svg('path', { d:`M ${cx-ex} ${cy+ey} Q ${cx} ${cy-bow} ${cx+ex} ${cy+ey}` }));
  g.appendChild(seams);
  /* a soft specular so it reads as a sphere rather than a disc */
  g.appendChild(svg('ellipse', { cx:cx - r*.33, cy:cy - r*.44, rx:r*.30, ry:r*.19,
    fill:'#fff', opacity:.28, transform:`rotate(-30 ${cx - r*.33} ${cy - r*.44})` }));
  return g;
}

function courtPath3pt(c){
  const x = cornerX(c), by = breakY(c), r = c.arc3;
  if (!c.straightCorner) return `M ${-x} 0 A ${r} ${r} 0 0 0 ${x} 0`;
  return `M ${-x} 0 L ${-x} ${by} A ${r} ${r} 0 0 0 ${x} ${by} L ${x} 0`;
}
function buildCourtGroup(c){
  const g = svg('g'), L = 'var(--c-line)', hw = c.width/2;
  const add = (t,a)=>{ g.appendChild(svg(t,a)); };
  add('rect', { x:-hw, y:0, width:c.width, height:c.len, fill:'var(--c-floor)' });
  add('rect', { x:-hw, y:0, width:c.width, height:c.len, fill:'url(#floorGlow)' });
  add('rect', { x:-hw, y:0, width:c.width, height:c.len, fill:'none', stroke:L, 'stroke-width':.35 });
  add('rect', { x:-c.paintHalf, y:0, width:c.paintHalf*2, height:c.ftY, fill:'var(--c-paint)', stroke:L, 'stroke-width':.28 });
  // free-throw circle: solid away from the basket, dashed through the paint
  add('path', { d:`M ${-c.ftR} ${c.ftY} A ${c.ftR} ${c.ftR} 0 0 0 ${c.ftR} ${c.ftY}`, fill:'none', stroke:L, 'stroke-width':.28 });
  add('path', { d:`M ${-c.ftR} ${c.ftY} A ${c.ftR} ${c.ftR} 0 0 1 ${c.ftR} ${c.ftY}`, fill:'none', stroke:L, 'stroke-width':.24, 'stroke-dasharray':'1.1 .9' });
  if (c.raR > 0) add('path', { d:`M ${-c.raR} ${c.hoopY} A ${c.raR} ${c.raR} 0 0 0 ${c.raR} ${c.hoopY}`, fill:'none', stroke:L, 'stroke-width':.22, opacity:.75 });
  add('path', { d:courtPath3pt(c), fill:'none', stroke:'var(--c-arc)', 'stroke-width':.34 });
  add('path', { d:`M -6 ${c.len} A 6 6 0 0 1 6 ${c.len}`, fill:'none', stroke:L, 'stroke-width':.28 });
  add('line', { x1:-c.bbHalf, y1:c.bbY, x2:c.bbHalf, y2:c.bbY, stroke:L, 'stroke-width':.42, 'stroke-linecap':'round' });
  add('circle', { cx:0, cy:c.hoopY, r:c.rimR, fill:'none', stroke:'var(--c-arc)', 'stroke-width':.3 });
  return g;
}

function makeRenderer(kind){
  const LIFT = 2.8, PAD = 1.8, TOK_R = 1.55;
  let root, scene, world, layers, court, tokens = [], sy = .62;

  function mount(svgEl, courtSpec){
    root = svgEl; court = courtSpec; tokens = [];
    root.textContent = '';
    const hw = court.width/2;

    /* A tilted court is inherently wide, so a fixed squash letterboxes badly in
       a tall stage. Choose the squash from the actual container aspect instead:
       the viewBox then matches the stage and the court fills it, while the tilt
       stays within a range that still reads as depth. */
    if (kind === 'tilt'){
      sy = .62;
      const box = root.getBoundingClientRect();
      if (box.width > 40 && box.height > 40){
        const wantH = (court.width + PAD*2) * box.height / box.width;
        sy = (wantH - LIFT - PAD*2) / court.len;
        sy = Math.max(.5, Math.min(.86, sy));
      }
    } else sy = 1;

    const h = kind === 'tilt' ? court.len*sy + LIFT + PAD*2 : court.len + PAD*2;
    const y0 = kind === 'tilt' ? 0 : -PAD;
    root.setAttribute('viewBox', `${-hw-PAD} ${y0} ${court.width+PAD*2} ${h}`);
    root.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    const defs = svg('defs');
    const rg = svg('radialGradient', { id:'floorGlow', cx:'50%', cy:'22%', r:'78%' });
    rg.appendChild(svg('stop', { offset:'0%',   'stop-color':'var(--c-glow)' }));
    rg.appendChild(svg('stop', { offset:'100%', 'stop-color':'transparent' }));
    defs.appendChild(rg);
    const f = svg('filter', { id:'tokShadow', x:'-60%', y:'-60%', width:'220%', height:'220%' });
    f.appendChild(svg('feDropShadow', { dx:0, dy:.35, stdDeviation:.32, 'flood-color':'#000', 'flood-opacity':'.45' }));
    defs.appendChild(f);
    /* Sphere shading for the ball: light from the upper left, as everywhere else. */
    const bs = svg('radialGradient', { id:'ballSkin', cx:'36%', cy:'30%', r:'78%' });
    bs.appendChild(svg('stop', { offset:'0%',   'stop-color':'#f0a057' }));
    bs.appendChild(svg('stop', { offset:'55%',  'stop-color':'#df7328' }));
    bs.appendChild(svg('stop', { offset:'100%', 'stop-color':'#a84a12' }));
    defs.appendChild(bs);
    root.appendChild(defs);

    scene = svg('g'); root.appendChild(scene);
    /* `world` carries the view transform. getScreenCTM() on this node inverts
       it exactly, whatever it happens to be. */
    world = svg('g');
    if (kind === 'tilt') world.setAttribute('transform', `translate(0 ${LIFT}) scale(1 ${sy})`);
    scene.appendChild(world);
    world.appendChild(buildCourtGroup(court));

    layers = {};
    layers.shadow = svg('g'); world.appendChild(layers.shadow);
    layers.ghost  = svg('g'); world.appendChild(layers.ghost);
    layers.trails = svg('g'); world.appendChild(layers.trails);
    /* Tokens live outside the squashed group in tilt mode so the discs stay
       round; each one positions itself through fromCourt(). */
    /* Defenders sit under the offence, in the same space as the tokens so they
       stay round in the tilted view. */
    layers.defence = svg('g'); (kind === 'tilt' ? scene : world).appendChild(layers.defence);
    layers.tokens  = svg('g'); (kind === 'tilt' ? scene : world).appendChild(layers.tokens);
  }

  /* Court feet -> whatever space the tokens layer lives in. */
  function fromCourt(x, y){ return kind === 'tilt' ? [x, y*sy + LIFT] : [x, y]; }
  /* Screen pixels -> court feet, correct under any affine view transform. */
  function toCourt(cx, cy){
    if (!world) return [0,0];
    const m = world.getScreenCTM();
    if (!m) return [0,0];
    const p = new DOMPoint(cx, cy).matrixTransform(m.inverse());
    return [p.x, p.y];
  }
  function hitTest(cx, cy){
    const [fx, fy] = toCourt(cx, cy);
    let best = null, bestD = Infinity;
    for (const t of tokens){
      const d = Math.hypot(t.pos[0]-fx, t.pos[1]-fy);
      const r = (t.id === 'ball' ? 1.3 : TOK_R) * 1.6;
      if (d < r && d < bestD){ best = t.id; bestD = d; }
    }
    return best;
  }
  function draw(st){
    if (!layers) return;
    for (const k in layers) layers[k].textContent = '';
    tokens = [];

    if (st.ghost){
      for (const s of SLOTS){
        const g = st.ghost[s]; if (!g) continue;
        const [gx, gy] = fromCourt(g[0], g[1]);
        layers.ghost.appendChild(svg('circle', { cx:gx, cy:gy, r:TOK_R, fill:'none',
          stroke:'var(--c-line)', 'stroke-width':.24, 'stroke-dasharray':'.9 .7', opacity:.62 }));
        const t = svg('text', { x:gx, y:gy+.52, 'text-anchor':'middle', 'font-size':1.5,
          fill:'var(--c-line)', opacity:.55, 'font-family':'system-ui, sans-serif', 'font-weight':600 });
        t.textContent = s;
        layers.ghost.appendChild(t);
      }
    }
    for (const tr of (st.trails || [])){
      const [ax, ay] = fromCourt(tr.from[0], tr.from[1]);
      const [bx, by] = fromCourt(tr.to[0], tr.to[1]);
      layers.trails.appendChild(svg('line', { x1:ax, y1:ay, x2:bx, y2:by,
        stroke: tr.color || 'var(--c-line)', 'stroke-width': tr.width || .26,
        'stroke-linecap':'round', 'stroke-dasharray': tr.dash || null, opacity: tr.opacity == null ? .9 : tr.opacity }));
    }
    if (kind === 'tilt'){
      for (const s of SLOTS){
        const p = st.spots[s]; if (!p) continue;
        layers.shadow.appendChild(svg('ellipse', { cx:p[0], cy:p[1], rx:TOK_R*.95, ry:TOK_R*.95, fill:'#000', opacity:.3 }));
      }
    }
    if (st.defenders){
      const dc = st.defColor || '#8b93a3';
      /* The open man gets a dashed halo the size of the window he actually has,
         so the space is something you see rather than something you are told. */
      if (st.mistake){
        const m = st.mistake, mp = st.spots[m.victim];
        if (mp){
          const [ox, oy] = fromCourt(mp[0], mp[1]);
          layers.defence.appendChild(svg('circle', { cx:ox, cy:oy, r:Math.max(2.2, m.space*.5),
            fill:'none', stroke:'var(--c-arc)', 'stroke-width':.26, 'stroke-dasharray':'1.2 .9', opacity:.85 }));
          const dp = fromCourt(m.defender[0], m.defender[1]);
          layers.defence.appendChild(svg('line', { x1:ox, y1:oy, x2:dp[0], y2:dp[1],
            stroke:'var(--c-arc)', 'stroke-width':.18, 'stroke-dasharray':'.7 .6', opacity:.6 }));
        }
      }
      const order = SLOTS.filter(s => !(st.mistake && st.mistake.victim === s))
        .concat(st.mistake ? [st.mistake.victim] : []);
      for (const s of order){
        const p = st.defenders[s]; if (!p) continue;
        const [px, py] = fromCourt(p[0], p[1]);
        const beaten = st.mistake && st.mistake.victim === s;
        const g = svg('g', { opacity: beaten ? .95 : .88 });
        g.appendChild(svg('circle', { cx:px, cy:py, r:1.38, fill:'rgba(10,10,14,.55)',
          stroke:dc, 'stroke-width': beaten ? .42 : .3,
          'stroke-dasharray': beaten ? '1.1 .55' : null }));
        const t = svg('text', { x:px, y:py+.5, 'text-anchor':'middle', 'font-size':1.5,
          'font-family':'system-ui, -apple-system, sans-serif', 'font-weight':700,
          fill:dc, 'pointer-events':'none' });
        t.textContent = 'x' + s;
        g.appendChild(t);
        layers.defence.appendChild(g);
      }
    }
    for (const s of SLOTS){
      const p = st.spots[s]; if (!p) continue;
      const [px, py] = fromCourt(p[0], p[1]);
      const g = svg('g', { filter:'url(#tokShadow)' });
      const isKey = (st.highlight || []).includes(s);
      const locked = (st.locked || []).includes(s);
      g.appendChild(svg('circle', { cx:px, cy:py, r:TOK_R,
        fill: (st.colors && st.colors[s]) || 'var(--c-line)',
        stroke: isKey ? 'var(--c-arc)' : 'rgba(0,0,0,.4)',
        'stroke-width': isKey ? .34 : .16,
        opacity: locked ? .55 : 1 }));
      const t = svg('text', { x:px, y:py+.58, 'text-anchor':'middle', 'font-size':1.85,
        'font-family':'system-ui, -apple-system, sans-serif', 'font-weight':750,
        fill: readableInk((st.colors && st.colors[s]) || '#cccccc'), 'pointer-events':'none' });
      t.textContent = s;
      g.appendChild(t);
      layers.tokens.appendChild(g);
      tokens.push({ id:s, pos:p });
    }
    if (st.ballPos){
      const [bx, by] = fromCourt(st.ballPos[0], st.ballPos[1]);
      layers.tokens.appendChild(ballGlyph(bx, by, 1.2));
      tokens.push({ id:'ball', pos:st.ballPos });
    }
  }
  function destroy(){ if (root) root.textContent = ''; layers = null; world = null; tokens = []; }
  return { mount, draw, toCourt, fromCourt, hitTest, destroy, get kind(){ return kind; } };
}

/* ============================================================ APPLICATION ==*/
const App = {
  mode:'run', settings:Store.settings(), play:null, beatIndex:0,
  attempt:null, results:[], reviewing:false, renderer:null, court:COURTS.nba,
  anim:null, designer:null, quiz:null, general:null, defMistakeOpt:null
};

/* The beat and ball-handler the defence should be reading, per mode. */
function defenceContext(){
  if (App.mode === 'design' && App.designer){
    const b = App.designer.play.beats[App.designer.beat];
    return { beat:b, ballSlot:b.ball };
  }
  if (App.mode === 'name' && App.quiz) return { beat:App.quiz.play.beats[0], ballSlot:App.quiz.play.beats[0].ball };
  if (!App.play) return null;
  const beat = App.play.beats[App.beatIndex];
  if (!beat) return null;
  if (isPlacementMode() && App.attempt) return { beat, ballSlot:App.attempt.ball };
  return { beat, ballSlot:beat.ball };
}
/* The positions actually on screen right now. Every consumer of the defence
   reads this one function; when triggerMistake and the readout each decided
   for themselves, a forced mistake could name a player from a different mode's
   leftover state. */
function displaySpots(){
  if (App.mode === 'design' && App.designer) return App.designer.play.beats[App.designer.beat].spots;
  if (App.mode === 'general' && App.general)
    return App.general.preview ? App.general.preview.spots : App.general.spots;
  if (isPlacementMode() && App.attempt) return App.attempt.spots;
  if (App.mode === 'name' && App.quiz) return App.quiz.play.beats[0].spots;
  if (App.play && App.play.beats[App.beatIndex]) return App.play.beats[App.beatIndex].spots;
  return null;
}
/* Used by both the renderer and the readout so they can never disagree. */
function defenceFor(spots, prev, t){
  if (App.settings.defence === 'off') return null;
  const ctx = defenceContext();
  if (!ctx || !spots) return null;
  const mistake = App.defMistakeOpt
    ? applyMistake(App.defMistakeOpt, spots, ctx.ballSlot, App.court) : null;
  return { defenders: buildDefence(spots, prev || null, t == null ? 1 : t, ctx.beat, ctx.ballSlot, App.court, mistake),
           mistake, color: slotColors().d };
}
function triggerMistake(force){
  const ctx = defenceContext();
  App.defMistakeOpt = null;
  if (!ctx) return;
  if (!force && App.settings.defence !== 'mistakes') return;
  if (!force && Math.random() > .42) return;
  const spots = displaySpots() || ctx.beat.spots;
  const opts = mistakeOptions(ctx.beat, spots, ctx.ballSlot);
  if (opts.length) App.defMistakeOpt = opts[Math.floor(Math.random()*opts.length)];
}

function neutralSpots(){
  /* An off-court rack along the half-court line, so every placement in beat 1
     is deliberate rather than inherited. */
  const y = App.court.len - 3.5;
  return { 1:[-16,y], 2:[-8,y], 3:[0,y], 4:[8,y], 5:[16,y] };
}
function ballOffsetFor(spots, slot){ return [spots[slot][0] + 2.2, spots[slot][1] - 1.1]; }
function nearestSlot(spots, pos, maxFt){
  let best = null, bd = Infinity;
  for (const s of SLOTS){ const d = dist(spots[s], pos); if (d < bd){ bd = d; best = s; } }
  return (maxFt === undefined || bd <= maxFt) ? best : null;
}
function allPlays(){ return BUILTIN.concat(Store.plays()); }
function findPlay(id){ return allPlays().find(p => p.id === id) || null; }
function isPlacementMode(){ return App.mode === 'run' || App.mode === 'recall'; }
function isGradedMode(){ return isPlacementMode() || App.mode === 'general'; }

/* --------------------------------------------------------------- theming -- */
function applySettings(){
  const s = App.settings;
  document.documentElement.dataset.appearance = s.appearance;
  document.documentElement.dataset.court = s.court;
  document.documentElement.dataset.render = s.render;
  App.court = COURTS[s.spec] || COURTS.nba;
  buildRenderer();
  renderSpotMap();
}
function buildRenderer(){
  if (App.renderer) App.renderer.destroy();
  App.renderer = makeRenderer(App.settings.render === 'tilt' ? 'tilt' : 'flat');
  App.renderer.mount($('#court'), App.court);
  paint();
}

/* ================================================================ PAINTING */
function paint(){
  if (!App.renderer) return;
  const st = { spots:neutralSpots(), ballPos:null, ghost:null, trails:[],
               colors:slotColors(), highlight:[], locked:[] };

  if (App.mode === 'design' && App.designer){
    const d = App.designer, b = d.play.beats[d.beat];
    st.spots = b.spots;
    st.ballPos = ballOffsetFor(b.spots, b.ball);
    st.highlight = b.keyPlayers || [];
    if (d.beat > 0){
      const prev = d.play.beats[d.beat-1];
      st.ghost = prev.spots;
      st.trails = SLOTS.map(s => ({ from:prev.spots[s], to:b.spots[s], color:slotColors()[s],
        width:.2, dash:'.8 .6', opacity:.5 }));
    }
  }
  else if (App.mode === 'learn' && App.play){
    const beat = App.play.beats[App.beatIndex];
    const f = App.anim ? App.anim.frame : { spots:beat.spots, ball:beat.ball };
    st.spots = f.spots;
    st.prevSpots = f.prev; st.t = f.t;
    st.ballPos = ballOffsetFor(f.spots, f.ball);
    st.highlight = beat.keyPlayers || [];
  }
  else if (App.mode === 'name' && App.quiz){
    const b0 = App.quiz.play.beats[0];
    const f = App.anim ? App.anim.frame : { spots:b0.spots, ball:b0.ball };
    st.spots = f.spots;
    st.prevSpots = f.prev; st.t = f.t;
    st.ballPos = ballOffsetFor(f.spots, f.ball);
  }
  else if (App.mode === 'general' && App.play && App.general){
    const g = App.general, beat = App.play.beats[App.beatIndex];
    st.spots = g.preview ? g.preview.spots : g.spots;
    st.ballPos = ballOffsetFor(st.spots, beat.ball);
    st.locked = g.preview ? [] : [2,3,4,5];   // dimmed: not yours to drag
    if (App.reviewing){
      st.ghost = beat.spots;
      const res = App.results[App.beatIndex];
      st.trails = SLOTS.map(s => ({ from:st.spots[s], to:beat.spots[s],
        color: res && res.per[s].score >= .85 ? 'var(--c-arc)' : res && res.per[s].score >= .4 ? '#ffc247' : '#ff6b5e',
        width:.3 }));
      st.highlight = beat.keyPlayers || [];
    }
  }
  else if (isPlacementMode() && App.play && App.attempt){
    const beat = App.play.beats[App.beatIndex];
    st.spots = App.attempt.spots;
    st.ballPos = App.attempt.ballPos;
    if (App.reviewing){
      /* Ghost diff: hollow markers at the truth, one line per player coloured
         by how good that placement was. This is the teaching moment. */
      st.ghost = beat.spots;
      const res = App.results[App.beatIndex];
      st.trails = SLOTS.map(s => ({ from:App.attempt.spots[s], to:beat.spots[s],
        color: res && res.per[s].score >= .85 ? 'var(--c-arc)' : res && res.per[s].score >= .4 ? '#ffc247' : '#ff6b5e',
        width:.3 }));
      st.highlight = beat.keyPlayers || [];
    } else if (hintLevel() !== 'blind' && App.beatIndex > 0){
      st.ghost = App.play.beats[App.beatIndex-1].spots;
    }
  }
  const dfn = defenceFor(st.spots, st.prevSpots, st.t);
  if (dfn){ st.defenders = dfn.defenders; st.mistake = dfn.mistake; st.defColor = dfn.color; }
  App.renderer.draw(st);
}
function hintLevel(){ return App.mode === 'recall' ? 'blind' : App.settings.hints; }

/* ================================================================== INPUT */
let dragging = null;
function draggableIds(){
  if (App.mode === 'design') return ['ball',1,2,3,4,5];
  if (isPlacementMode() && App.attempt && !App.reviewing) return ['ball',1,2,3,4,5];
  if (App.mode === 'general' && App.general && !App.reviewing && !App.general.preview) return [1];
  return [];
}
function onPointerDown(e){
  const allowed = draggableIds();
  if (!allowed.length) return;
  const id = App.renderer.hitTest(e.clientX, e.clientY);
  if (id === null || !allowed.includes(id)) return;
  const [fx, fy] = App.renderer.toCourt(e.clientX, e.clientY);
  const cur = id === 'ball' ? currentBallPos() : currentSpots()[id];
  dragging = { id, dx:cur[0]-fx, dy:cur[1]-fy };
  try{ $('#court').setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
}
function onPointerMove(e){
  if (!dragging) return;
  const [fx, fy] = App.renderer.toCourt(e.clientX, e.clientY);
  const x = Math.max(-App.court.width/2 + .5, Math.min(App.court.width/2 - .5, fx + dragging.dx));
  const y = Math.max(.5, Math.min(App.court.len - .5, fy + dragging.dy));
  if (dragging.id === 'ball') setBallPos([x,y]); else setSpot(dragging.id, [x,y]);
  paint();
}
function onPointerUp(e){
  if (!dragging) return;
  const id = dragging.id;
  dragging = null;
  try{ $('#court').releasePointerCapture(e.pointerId); }catch(err){}
  if (id === 'ball' && isPlacementMode() && App.attempt){
    /* Snap the ball to whoever it was dropped nearest — that is the answer for
       the ball component. Dropped in open space, it returns to its holder. */
    const near = nearestSlot(App.attempt.spots, App.attempt.ballPos, 5.5);
    setBallHolder(near || App.attempt.ball);
  }
  paint();
  renderRail();
}
function currentSpots(){
  if (App.mode === 'design') return App.designer.play.beats[App.designer.beat].spots;
  if (App.mode === 'general') return App.general.spots;
  return App.attempt.spots;
}
function currentBallPos(){
  if (App.mode === 'design'){
    const b = App.designer.play.beats[App.designer.beat];
    return ballOffsetFor(b.spots, b.ball);
  }
  if (App.mode === 'general') return ballOffsetFor(App.general.spots, App.play.beats[App.beatIndex].ball);
  return App.attempt.ballPos;
}
function setSpot(slot, pos){
  if (App.mode === 'design'){
    App.designer.play.beats[App.designer.beat].spots[slot] = pos;
    App.designer.dirty = true;
  } else if (App.mode === 'general'){
    App.general.spots[slot] = pos;
  } else {
    App.attempt.spots[slot] = pos;
    if (App.attempt.ball === slot) App.attempt.ballPos = ballOffsetFor(App.attempt.spots, slot);
  }
}
function setBallPos(pos){ if (isPlacementMode() && App.attempt) App.attempt.ballPos = pos; }
function setBallHolder(slot){
  if (!slot) return;
  if (App.mode === 'design'){
    App.designer.play.beats[App.designer.beat].ball = slot;
    App.designer.dirty = true;
  } else if (App.attempt){
    App.attempt.ball = slot;
    App.attempt.ballPos = ballOffsetFor(App.attempt.spots, slot);
  }
}

/* ============================================================ RUN / RECALL */
function startRun(play){
  App.play = play; App.beatIndex = 0; App.results = []; App.reviewing = false;
  App.general = null;
  newAttempt();
  renderAll();
}
function newAttempt(){
  /* Beat 1 starts from the rack; later beats start from the PREVIOUS beat's
     correct positions, so one bad beat never compounds into the next. */
  const spots = App.beatIndex === 0 ? neutralSpots() : cloneSpots(App.play.beats[App.beatIndex-1].spots);
  const ball  = App.beatIndex === 0 ? 1 : App.play.beats[App.beatIndex-1].ball;
  App.attempt = { spots, ball, ballPos:ballOffsetFor(spots, ball), actions:[] };
  triggerMistake(false);
}
function checkBeat(){
  const beat = App.play.beats[App.beatIndex];
  App.results[App.beatIndex] = gradeBeat(App.attempt, beat, App.court);
  if (App.mode === 'recall'){
    if (App.beatIndex < App.play.beats.length - 1){ App.beatIndex++; newAttempt(); }
    else return finishRun();
  } else {
    App.reviewing = true;
  }
  renderAll();
}
function nextBeat(){
  App.reviewing = false;
  if (App.beatIndex < App.play.beats.length - 1){
    App.beatIndex++;
    if (App.mode === 'general') newGeneralBeat(); else newAttempt();
    renderAll();
  } else finishRun();
}
function finishRun(){
  const scores = App.results.map(r => r ? r.total : 0);
  const total = gradePlay(scores);
  Store.addHistory({
    playId:App.play.id, playName:App.play.name, mode:App.mode,
    score:round3(total), perBeat:scores.map(round3), ts:Date.now()
  });
  showSummary(total, scores);
  renderLibrary(); renderHistory();
}

/* ========================================================= FLOOR GENERAL UI */
function startGeneral(play){
  App.play = play; App.beatIndex = 0; App.results = []; App.reviewing = false;
  App.attempt = null;
  newGeneralBeat();
  renderAll();
}
function newGeneralBeat(){
  const base = App.beatIndex === 0 ? neutralSpots() : cloneSpots(App.play.beats[App.beatIndex-1].spots);
  const pg = App.beatIndex === 0 ? [0, App.court.len - 8] : [base[1][0], base[1][1]];
  App.general = { spots:cloneSpots(base), calls:[], preview:null, draft:defaultDraft() };
  App.general.spots[1] = pg;
  triggerMistake(false);
}
function defaultDraft(){ return { v:'send', who:2, where:'corner', side:'left', type:'screen', for:3 }; }
function runCalls(){
  const g = App.general, beat = App.play.beats[App.beatIndex];
  const base = App.beatIndex === 0 ? neutralSpots() : cloneSpots(App.play.beats[App.beatIndex-1].spots);
  const res = resolveCalls(base, g.spots[1], g.calls, beat);
  g.preview = res;
  App.attempt = { spots:res.spots, ball:beat.ball, ballPos:ballOffsetFor(res.spots, beat.ball), actions:res.actions };
  App.results[App.beatIndex] = gradeBeat(App.attempt, beat, App.court);
  App.reviewing = true;
  renderAll();
}

/* =============================================================== ANIMATION */
function animatePlay(play, opts){
  cancelAnim();
  const beats = play.beats;
  if (beats.length < 2){ App.anim = { frame:{ spots:beats[0].spots, ball:beats[0].ball } }; paint(); return; }
  const dwell = (opts && opts.dwell) || 620, travel = (opts && opts.travel) || 900;
  const seg = dwell + travel, totalMs = seg*(beats.length-1) + dwell;
  const t0 = performance.now();
  const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  App.anim = { frame:{ spots:beats[0].spots, ball:beats[0].ball, prev:null, t:1 }, raf:0, onBeat:(opts&&opts.onBeat) };
  const step = now => {
    if (!App.anim) return;
    const elapsed = Math.min(totalMs, now - t0);
    const i = Math.min(beats.length-2, Math.floor(elapsed/seg));
    const within = elapsed - i*seg;
    const t = within <= dwell ? 0 : ease(clamp01((within-dwell)/travel));
    const a = beats[i], b = beats[i+1], spots = {};
    for (const s of SLOTS) spots[s] = [ lerp(a.spots[s][0], b.spots[s][0], t), lerp(a.spots[s][1], b.spots[s][1], t) ];
    App.anim.frame = { spots, ball: t < .5 ? a.ball : b.ball, prev: a.spots, t };
    if (App.anim.onBeat) App.anim.onBeat(t < .5 ? i : i+1);
    paint();
    if (elapsed < totalMs) App.anim.raf = requestAnimationFrame(step);
    else { App.anim.done = true; if (opts && opts.onDone) opts.onDone(); }
  };
  App.anim.raf = requestAnimationFrame(step);
}
function cancelAnim(){ if (App.anim && App.anim.raf) cancelAnimationFrame(App.anim.raf); App.anim = null; }

function setStageNote(text){
  const n = $('#stageNote');

  n.hidden = false; $('b', n).textContent = text;
}

function renderBar(){

  const add = n => { if (n) bar.appendChild(n); };

  if (!App.play && App.mode !== 'design' && App.mode !== 'name'){
    add(el('span', { class:'bar-lbl', text:'Pick a play from the left to begin' }));

    add(el('span', { class:'bar-lbl', text:'Beat' }));
    App.play.beats.forEach((b,i) => add(el('button', {

      setStageNote('Playing — ' + App.play.name);

        onDone:()=>setStageNote('') });

    add(el('span', { class:'bar-lbl', text:`Beat ${App.beatIndex+1} / ${App.play.beats.length}` }));

      add(el('div', { class:'sp' }));
      add(el('span', { class:'bar-lbl', text:'Action' }));
      add(actionTagger());
      add(defenceButton());
      add(el('button', { class:'btn sm pri', text: App.mode === 'recall' ? 'Lock in →' : 'Check beat', onclick:checkBeat }));
      setStageNote(hintLevel() === 'blind' ? 'Blind — no reference shown'

        : 'Place all five, then drag the ball onto its handler');
    } else {
      const r = App.results[App.beatIndex], pct = Math.round(r.total*100);
      add(el('span', { class:'bar-lbl',
        style:`color:${pct>=80?'var(--good)':pct>=55?'var(--warn)':'var(--bad)'}`,
        text:`${pct}% · ${letterFor(r.total)}` }));
      add(el('div', { class:'sp' }));
      add(el('button', { class:'btn sm', text:'Retry beat',
        onclick:()=>{ App.reviewing = false; newAttempt(); renderAll(); } }));
      add(el('button', { class:'btn sm pri',
        text: App.beatIndex < App.play.beats.length-1 ? 'Next beat →' : 'Finish ✓', onclick:nextBeat }));
      setStageNote('Hollow markers are the truth · lines show your error');
    }
    return;
  }

  if (App.mode === 'general'){
    const beat = App.play.beats[App.beatIndex];
    add(el('span', { class:'bar-lbl', text:`Beat ${App.beatIndex+1} / ${App.play.beats.length}` }));
    add(el('span', { class:'bar-lbl', style:'color:var(--ink)', text:beat.label }));
    add(el('div', { class:'sp' }));
    if (!App.reviewing){
      add(el('span', { class:'hint', text:'Drag the 1. Call the rest.' }));
      add(defenceButton());
      add(el('button', { class:'btn sm pri', text:'Run the call →', onclick:runCalls }));
      setStageNote('You are the 1 — drag yourself, then call your team-mates from the right');
    } else {
      const r = App.results[App.beatIndex], pct = Math.round(r.total*100);
      add(el('span', { class:'bar-lbl',
        style:`color:${pct>=80?'var(--good)':pct>=55?'var(--warn)':'var(--bad)'}`,
        text:`${pct}% · ${letterFor(r.total)}` }));
      add(el('div', { class:'sp' }));

        onclick:()=>{ App.reviewing = false; newGeneralBeat(); renderAll(); } }));

    add(el('span', { class:'bar-lbl', text:'Watch the play, then name it' }));
