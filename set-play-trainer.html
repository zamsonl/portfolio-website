/* ============================================================ MOVE LANGUAGE */
/* A move reads as a sentence, because "5 screens for 1" is what a coach says. */
function moveSentence(a){
  if (!a || a.type === 'none') return 'Nothing — players just get to their spots';
  const f = a.for || '?';
  switch (a.type){
    case 'screen':  return `${a.by} sets a screen for ${f}`;
    case 'handoff': return `${a.by} hands the ball off to ${f}`;
    case 'pass':    return `${a.by} passes to ${f}`;
    case 'clearout':return `${a.by} clears out to the far side`;
    case 'cut':     return `${a.by} cuts`;
    case 'roll':    return `${a.by} rolls to the rim`;
    case 'pop':     return `${a.by} pops out`;
    case 'dribble': return `${a.by} dribbles`;
    case 'flare':   return `${a.by} flares away`;
    case 'curl':    return `${a.by} curls around the screen`;
    case 'lift':    return `${a.by} lifts out of the corner`;
    case 'post':    return `${a.by} posts up`;
    case 'seal':    return `${a.by} seals his defender`;
  }
  return ACTION_LABEL[a.type] || a.type;
}

/* ============================================================== RENDERER v2 */
/* Draws the court, the players and — new in v2 — the play itself, using the
   whiteboard conventions every coach uses: a solid arrow is a player moving, a
   zig-zag is the ball being dribbled, a dashed line is a pass and a T-bar is a
   screen. Engine rule still holds: nothing here decides anything; it only
   draws court feet. */
function makeCourt(root, kind){
  const LIFT = 2.8, PAD = 1.8, TOK_R = 1.55;
  let scene, world, L = {}, tokens = [], sy = 1, court = App.court;

  function mount(){
    court = App.court;
    root.textContent = '';
    tokens = [];
    const hw = court.width / 2;
    if (kind === 'tilt'){
      sy = .62;
      const box = root.getBoundingClientRect();
      if (box.width > 40 && box.height > 40){
        const wantH = (court.width + PAD*2) * box.height / box.width;
        sy = clampN((wantH - LIFT - PAD*2) / court.len, .5, .86);
      }
    } else sy = 1;
    const h = kind === 'tilt' ? court.len*sy + LIFT + PAD*2 : court.len + PAD*2;
    root.setAttribute('viewBox', `${-hw-PAD} ${kind === 'tilt' ? 0 : -PAD} ${court.width+PAD*2} ${h}`);
    root.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    const defs = svg('defs');
    const rg = svg('radialGradient', { id:'floorGlow', cx:'50%', cy:'22%', r:'78%' });
    rg.appendChild(svg('stop', { offset:'0%', 'stop-color':'var(--c-glow)' }));
    rg.appendChild(svg('stop', { offset:'100%', 'stop-color':'transparent' }));
    defs.appendChild(rg);
    const f = svg('filter', { id:'tokShadow', x:'-60%', y:'-60%', width:'220%', height:'220%' });
    f.appendChild(svg('feDropShadow', { dx:0, dy:.35, stdDeviation:.32, 'flood-color':'#000', 'flood-opacity':'.45' }));
    defs.appendChild(f);
    const bs = svg('radialGradient', { id:'ballSkin', cx:'36%', cy:'30%', r:'78%' });
    bs.appendChild(svg('stop', { offset:'0%', 'stop-color':'#f0a057' }));
    bs.appendChild(svg('stop', { offset:'55%', 'stop-color':'#df7328' }));
    bs.appendChild(svg('stop', { offset:'100%', 'stop-color':'#a84a12' }));
    defs.appendChild(bs);
    root.appendChild(defs);

    scene = svg('g'); root.appendChild(scene);
    world = svg('g');
    if (kind === 'tilt') world.setAttribute('transform', `translate(0 ${LIFT}) scale(1 ${sy})`);
    scene.appendChild(world);
    world.appendChild(buildCourtGroup(court));
    for (const n of ['shadow','ghost','trail','mark']) { L[n] = svg('g'); world.appendChild(L[n]); }
    const top = kind === 'tilt' ? scene : world;
    for (const n of ['defence','token']) { L[n] = svg('g'); top.appendChild(L[n]); }
  }

  const fromCourt = (x, y) => kind === 'tilt' ? [x, y*sy + LIFT] : [x, y];
  function toCourt(cx, cy){
    const m = world && world.getScreenCTM();
    if (!m) return [0, 0];
    const p = new DOMPoint(cx, cy).matrixTransform(m.inverse());
    return [p.x, p.y];
  }
  /** Nearest token under the pointer, restricted to `allowed` ids if given. */
  function hitTest(cx, cy, allowed){
    const [fx, fy] = toCourt(cx, cy);
    let best = null, bd = Infinity;
    for (const t of tokens){
      if (allowed && !allowed.includes(t.id)) continue;
      const d = Math.hypot(t.pos[0]-fx, t.pos[1]-fy);
      const r = (t.id === 'ball' ? 1.3 : TOK_R) * 1.65;
      if (d < r && d < bd){ best = t.id; bd = d; }
    }
    return best;
  }

  const unit = (a, b) => { const dx = b[0]-a[0], dy = b[1]-a[1], m = Math.hypot(dx, dy); return m < 1e-6 ? [0,0] : [dx/m, dy/m]; };
  function head(layer, tip, u, size, color){
    const px = -u[1], py = u[0], bx = tip[0]-u[0]*size, by = tip[1]-u[1]*size;
    layer.appendChild(svg('path', { d:`M ${tip[0]} ${tip[1]} L ${bx+px*size*.56} ${by+py*size*.56} L ${bx-px*size*.56} ${by-py*size*.56} Z`, fill:color }));
  }
  function drawMark(m){
    const layer = L.mark;
    if (m.kind === 'move' || m.kind === 'dribble'){
      const u = unit(m.from, m.to);
      const len = dist(m.from, m.to);
      if (len < 2.4) return;
      const a = [m.from[0]+u[0]*.4, m.from[1]+u[1]*.4];
      const b = [m.to[0]-u[0]*(TOK_R+.35), m.to[1]-u[1]*(TOK_R+.35)];
      const col = m.color || 'var(--c-line)';
      let d;
      if (m.kind === 'dribble'){
        const seg = dist(a, b), n = Math.max(2, Math.floor(seg / 1.5)), px = -u[1], py = u[0];
        d = `M ${a[0]} ${a[1]}`;
        for (let i = 1; i < n; i++){
          const t = i / n, s = (i % 2 ? 1 : -1) * .6;
          d += ` L ${a[0]+(b[0]-a[0])*t+px*s} ${a[1]+(b[1]-a[1])*t+py*s}`;
        }
        d += ` L ${b[0]-u[0]*.9} ${b[1]-u[1]*.9}`;
      } else d = `M ${a[0]} ${a[1]} L ${b[0]-u[0]*.9} ${b[1]-u[1]*.9}`;
      layer.appendChild(svg('path', { d, fill:'none', stroke:col, 'stroke-width':.34, 'stroke-linecap':'round', 'stroke-linejoin':'round', opacity:m.faint ? .45 : .95 }));
      head(layer, b, u, 1.15, col);
    } else if (m.kind === 'pass'){
      const u = unit(m.from, m.to);
      if (dist(m.from, m.to) < 3) return;
      const a = [m.from[0]+u[0]*(TOK_R+.3), m.from[1]+u[1]*(TOK_R+.3)];
      const b = [m.to[0]-u[0]*(TOK_R+.35), m.to[1]-u[1]*(TOK_R+.35)];
      layer.appendChild(svg('path', { d:`M ${a[0]} ${a[1]} L ${b[0]-u[0]*.9} ${b[1]-u[1]*.9}`, fill:'none',
        stroke:'var(--c-line)', 'stroke-width':.3, 'stroke-dasharray':'1 .75', 'stroke-linecap':'round' }));
      head(layer, b, u, 1.1, 'var(--c-line)');
    } else if (m.kind === 'screen'){
      const u = unit(m.at, m.toward);
      const c = [m.at[0]+u[0]*(TOK_R+.55), m.at[1]+u[1]*(TOK_R+.55)];
      const px = -u[1], py = u[0];
      layer.appendChild(svg('path', { d:`M ${c[0]-px*1.6} ${c[1]-py*1.6} L ${c[0]+px*1.6} ${c[1]+py*1.6}`,
        stroke:'var(--c-line)', 'stroke-width':.55, 'stroke-linecap':'round' }));
    } else if (m.kind === 'diff'){
      layer.appendChild(svg('line', { x1:m.from[0], y1:m.from[1], x2:m.to[0], y2:m.to[1],
        stroke:m.color, 'stroke-width':.32, 'stroke-linecap':'round', opacity:.95 }));
    }
  }

  /**
   * @param {{spots, ballPos?, colors, ghosts?, marks?, selected?, highlight?,
   *          locked?, defenders?, defColor?, mistake?, ballScale?, shotFlash?}} st
   */
  function draw(st){
    if (!world) return;
    for (const k in L) L[k].textContent = '';
    tokens = [];
    const colors = st.colors || slotColors();

    if (st.ghosts){
      for (const s of SLOTS){
        const g = st.ghosts[s]; if (!g) continue;
        const [gx, gy] = [g[0], g[1]];
        L.ghost.appendChild(svg('circle', { cx:gx, cy:gy, r:TOK_R, fill:'none', stroke:'var(--c-line)',
          'stroke-width':.22, 'stroke-dasharray':'.8 .6', opacity:.55 }));
        const t = svg('text', { x:gx, y:gy+.52, 'text-anchor':'middle', 'font-size':1.45, fill:'var(--c-line)',
          opacity:.5, 'font-family':'system-ui,sans-serif', 'font-weight':650 });
        t.textContent = s;
        L.ghost.appendChild(t);
      }
    }
    for (const m of (st.marks || [])) drawMark(m);

    if (kind === 'tilt'){
      for (const s of SLOTS){
        const p = st.spots[s]; if (!p) continue;
        L.shadow.appendChild(svg('ellipse', { cx:p[0], cy:p[1], rx:TOK_R*.95, ry:TOK_R*.95, fill:'#000', opacity:.3 }));
      }
    }

    if (st.defenders){
      const dc = st.defColor || slotColors().d;
      if (st.mistake && st.spots[st.mistake.victim]){
        const mp = st.spots[st.mistake.victim];
        const [ox, oy] = fromCourt(mp[0], mp[1]);
        L.defence.appendChild(svg('circle', { cx:ox, cy:oy, r:Math.max(2.2, st.mistake.space*.5), fill:'none',
          stroke:'var(--c-arc)', 'stroke-width':.26, 'stroke-dasharray':'1.2 .9', opacity:.85 }));
      }
      const order = SLOTS.filter(s => !(st.mistake && st.mistake.victim === s)).concat(st.mistake ? [st.mistake.victim] : []);
      for (const s of order){
        const p = st.defenders[s]; if (!p) continue;
        const [px, py] = fromCourt(p[0], p[1]);
        const beaten = st.mistake && st.mistake.victim === s;
        const g = svg('g', { opacity:.9 });
        g.appendChild(svg('circle', { cx:px, cy:py, r:1.35, fill:'rgba(10,10,14,.55)', stroke:dc,
          'stroke-width':beaten ? .42 : .3, 'stroke-dasharray':beaten ? '1.1 .55' : null }));
        const t = svg('text', { x:px, y:py+.5, 'text-anchor':'middle', 'font-size':1.45, fill:dc,
          'font-family':'system-ui,sans-serif', 'font-weight':700, 'pointer-events':'none' });
        t.textContent = 'x' + s;
        g.appendChild(t);
        L.defence.appendChild(g);
      }
    }

    for (const s of SLOTS){
      const p = st.spots[s]; if (!p) continue;
      const [px, py] = fromCourt(p[0], p[1]);
      const g = svg('g', { filter:'url(#tokShadow)', 'data-slot':s });
      if (st.selected === s)
        g.appendChild(svg('circle', { cx:px, cy:py, r:TOK_R+.62, fill:'none', stroke:'var(--accent)', 'stroke-width':.36 }));
      const key = (st.highlight || []).includes(s);
      g.appendChild(svg('circle', { cx:px, cy:py, r:TOK_R, fill:colors[s],
        stroke: key ? 'var(--c-arc)' : 'rgba(0,0,0,.42)', 'stroke-width': key ? .34 : .16,
        opacity:(st.locked || []).includes(s) ? .6 : 1 }));
      const t = svg('text', { x:px, y:py+.6, 'text-anchor':'middle', 'font-size':1.85, 'font-weight':780,
        'font-family':'system-ui,-apple-system,sans-serif', fill:readableInk(colors[s]), 'pointer-events':'none' });
      t.textContent = s;
      g.appendChild(t);
      L.token.appendChild(g);
      tokens.push({ id:s, pos:p });
    }
    if (st.ballPos){
      const [bx, by] = fromCourt(st.ballPos[0], st.ballPos[1]);
      L.token.appendChild(ballGlyph(bx, by, 1.2 * (st.ballScale || 1)));
      tokens.push({ id:'ball', pos:st.ballPos });
      if (st.shotFlash === true || st.shotFlash === false){
        const [hx, hy] = fromCourt(0, court.hoopY);
        L.token.appendChild(svg('circle', { cx:hx, cy:hy, r:3.2, fill:'none',
          stroke: st.shotFlash ? '#4ec97f' : '#ff6b5e', 'stroke-width':.45, opacity:.9 }));
      }
    }
  }
  function destroy(){ root.textContent = ''; world = null; tokens = []; }
  mount();
  return { draw, toCourt, fromCourt, hitTest, destroy, remount:mount, get kind(){ return kind; } };
}

/* The marks for one step: who moved since the step before, and what happened. */
function stepMarks(play, i, spotsNow){
  const b = play.beats[i], prev = i > 0 ? play.beats[i-1] : null;
  const spots = spotsNow || b.spots, colors = slotColors(), marks = [];
  if (prev){
    for (const s of SLOTS){
      if (dist(prev.spots[s], spots[s]) < 1.2) continue;
      const dribble = (prev.ball === s && b.ball === s) || (b.actions || []).some(a => a.type === 'dribble' && a.by === s);
      marks.push({ kind: dribble ? 'dribble' : 'move', from:prev.spots[s], to:spots[s], color:colors[s] });
    }
  }
  for (const a of (b.actions || [])){
    if ((a.type === 'pass' || a.type === 'handoff') && a.for && spots[a.for]) marks.push({ kind:'pass', from:spots[a.by], to:spots[a.for] });
    if (a.type === 'screen' && a.for && spots[a.for]) marks.push({ kind:'screen', at:spots[a.by], toward:spots[a.for] });
  }
  return marks;
}
function ballOffset(spots, slot){ return [spots[slot][0] + 2.2, spots[slot][1] - 1.1]; }
function nearestSlot(spots, pos, maxFt){
  let best = null, bd = Infinity;
  for (const s of SLOTS){ const d = dist(spots[s], pos); if (d < bd){ bd = d; best = s; } }
  return (maxFt == null || bd <= maxFt) ? best : null;
}
function neutralSpots(){
  const y = App.court.len - 3.5;
  return { 1:[-16,y], 2:[-8,y], 3:[0,y], 4:[8,y], 5:[16,y] };
}
/* A sensible spread for a brand-new play: nobody starts on top of anyone. */
function starterSpots(){ return { 1:[0,30], 2:[-20,22], 3:[20,22], 4:[-22,5], 5:[22,5] }; }

/* A play as a coach's diagram, for the playbook cards: every player's route
   through every step, ending in an arrow, with the player where he finishes. */
function playThumb(play){
  const c = App.court, hw = c.width/2, colors = slotColors();
  const s = svg('svg', { viewBox:`${-hw-.5} -.5 ${c.width+1} 41`, preserveAspectRatio:'xMidYMid slice', 'aria-hidden':'true' });
  s.appendChild(svg('rect', { x:-hw-1, y:-1, width:c.width+2, height:43, fill:'var(--c-floor)' }));
  const L = 'var(--c-line)';
  s.appendChild(svg('rect', { x:-c.paintHalf, y:0, width:c.paintHalf*2, height:c.ftY, fill:'var(--c-paint)', stroke:L, 'stroke-width':.3 }));
  s.appendChild(svg('path', { d:courtPath3pt(c), fill:'none', stroke:'var(--c-arc)', 'stroke-width':.36 }));
  s.appendChild(svg('path', { d:`M ${-c.ftR} ${c.ftY} A ${c.ftR} ${c.ftR} 0 0 0 ${c.ftR} ${c.ftY}`, fill:'none', stroke:L, 'stroke-width':.3 }));
  s.appendChild(svg('line', { x1:-c.bbHalf, y1:c.bbY, x2:c.bbHalf, y2:c.bbY, stroke:L, 'stroke-width':.45 }));
  s.appendChild(svg('circle', { cx:0, cy:c.hoopY, r:c.rimR, fill:'none', stroke:'var(--c-arc)', 'stroke-width':.32 }));
  const last = play.beats[play.beats.length-1];
  for (const sl of SLOTS){
    const pts = play.beats.map(b => b.spots[sl]);
    const moved = pts.some((p, i) => i && dist(p, pts[i-1]) > 1.2);
    if (moved){
      let d = `M ${pts[0][0]} ${pts[0][1]}`;
      for (let i = 1; i < pts.length; i++) d += ` L ${pts[i][0]} ${pts[i][1]}`;
      s.appendChild(svg('path', { d, fill:'none', stroke:colors[sl], 'stroke-width':.5, 'stroke-linejoin':'round',
        'stroke-linecap':'round', opacity:.92 }));
      s.appendChild(svg('circle', { cx:pts[0][0], cy:pts[0][1], r:.7, fill:colors[sl], opacity:.8 }));
    }
    const p = last.spots[sl];
    s.appendChild(svg('circle', { cx:p[0], cy:p[1], r:1.75, fill:colors[sl], stroke:'rgba(0,0,0,.4)', 'stroke-width':.15 }));
    const t = svg('text', { x:p[0], y:p[1]+.66, 'text-anchor':'middle', 'font-size':2, 'font-weight':800,
      'font-family':'system-ui,sans-serif', fill:readableInk(colors[sl]) });
    t.textContent = sl;
    s.appendChild(t);
  }
  return s;
}

/* ================================================================= UI KIT */
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); return n; }
function btn(label, opts){
  opts = opts || {};
  const b = el('button', { class:'btn' + (opts.cls ? ' ' + opts.cls : ''), type:'button',
    title:opts.title, disabled:opts.disabled, onclick:opts.onclick, 'aria-label':opts.aria });
  if (opts.icon) b.appendChild(icon(opts.icon));
  if (label) b.appendChild(el('span', { class:'lbl', text:label }));
  return b;
}
function seg(options, value, onpick, aria){
  const w = el('div', { class:'seg', role:'group', 'aria-label':aria });
  for (const [v, label, title] of options){
    w.appendChild(el('button', { type:'button', 'aria-pressed':String(v === value), title,
      text:label, onclick:()=>{ if (v !== value) onpick(v); } }));
  }
  return w;
}
function sw(label, checked, onchange){
  const l = el('label', { class:'switch' });
  const i = el('input', { type:'checkbox', role:'switch' });
  i.checked = !!checked;
  i.addEventListener('change', () => onchange(i.checked));
  l.appendChild(i);
  l.appendChild(el('span', { text:label }));
  return l;
}
function playerDot(n, size){
  const c = slotColors()[n];

  d.style.background = c; d.style.color = readableInk(c);

/* Built-in coaching uses <b> for emphasis and is trusted; anything a person
   wrote arrives stripped (validatePlay) and is rendered as plain text. */
function coachNode(text, trusted, cls){
  const n = el('div', { class:cls || 'coach' });
  if (trusted) n.innerHTML = text; else n.textContent = text;
  return n;
}

let toastTimer = null;
function toast(msg, action){
  const old = document.querySelector('.toast'); if (old) old.remove();
  /* An Undo offer is raised *during* a navigation (delete sends you home), so
     it must outlive that navigation — otherwise deleting has no way back. */
  const t = el('div', { class:'toast', role:'status', 'data-keep': action ? 'true' : null });
  t.appendChild(el('span', { text:msg }));
  if (action){
    t.appendChild(el('button', { type:'button', text:action[0], onclick:()=>{ t.remove(); action[1](); } }));
  }
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), action ? 6500 : 3200);
}

/* A modal sheet. Returns { close, body, foot }. Sheets stack: Escape and a
   click on the backdrop only ever close the one on top. */
const SHEETS = [];
function closeAllSheets(){ for (const s of SHEETS.slice().reverse()) s.close(); }
function sheet(opts){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const scrim = el('div', { class:'scrim' });
  const box = el('div', { class:'sheet' + (opts.wide ? ' wide' : ''), role:'dialog', 'aria-modal':'true', 'aria-label':opts.title });
  const head = el('div', { class:'sh' });
  const ht = el('div', { style:'flex:1;min-width:0' });
  ht.appendChild(el('h2', { text:opts.title }));
  if (opts.sub) ht.appendChild(el('p', { text:opts.sub }));
  head.appendChild(ht);
  head.appendChild(btn('', { cls:'ghost icon sm', icon:'x', aria:'Close', onclick:()=>close() }));
  const body = el('div', { class:'sb' });
  const foot = el('div', { class:'sf' });
  box.appendChild(head); box.appendChild(body);
  if (!opts.noFoot) box.appendChild(foot);
  scrim.appendChild(box);
  const me = { close, body, foot, box };
  let closed = false;
  function onKey(e){ if (e.key === 'Escape' && SHEETS[SHEETS.length-1] === me){ e.stopPropagation(); close(); } }
  function close(){
    if (closed) return;
    closed = true;
    scrim.remove();
    document.removeEventListener('keydown', onKey, true);
    const i = SHEETS.indexOf(me); if (i >= 0) SHEETS.splice(i, 1);
    if (opts.onClose) opts.onClose();
  }
  scrim.addEventListener('pointerdown', e => { if (e.target === scrim) close(); });
  document.addEventListener('keydown', onKey, true);
  document.body.appendChild(scrim);
  SHEETS.push(me);
  return me;
}
function confirmSheet(title, sub, yes, onyes){
  const s = sheet({ title, sub });
  s.foot.appendChild(btn('Cancel', { onclick:()=>s.close() }));
  s.foot.appendChild(btn(yes, { cls:'pri', onclick:()=>{ s.close(); onyes(); } }));
}
/* A small popover menu anchored to a button. */
function menu(anchor, items){
  document.querySelectorAll('.menu').forEach(m => m.remove());
  const m = el('div', { class:'menu', role:'menu' });
  for (const it of items){
    if (it === '-'){ m.appendChild(el('hr')); continue; }
    const b = el('button', { type:'button', role:'menuitem', class:it.danger ? 'danger' : '',
      onclick:()=>{ m.remove(); it.run(); } });
    if (it.icon) b.appendChild(icon(it.icon));
    b.appendChild(el('span', { text:it.label }));
    m.appendChild(b);
  }
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  m.style.left = clampN(r.right - mw, 8, innerWidth - mw - 8) + 'px';
  m.style.top = (r.bottom + mh + 8 > innerHeight ? Math.max(8, r.top - mh - 6) : r.bottom + 6) + 'px';
  const off = e => { if (!m.contains(e.target)){ m.remove(); document.removeEventListener('pointerdown', off, true); } };
  setTimeout(() => document.addEventListener('pointerdown', off, true), 0);
}

/* ================================================================== ROUTER */
/* Hash routes, so the browser's own Back button works everywhere. */
function go(path){ if (location.hash !== '#' + path) location.hash = path; else route(); }
function parseRoute(){
  const h = location.hash || '';
  if (h.startsWith('#p=')) return { name:'shared', code:h.slice(3).split('&')[0] };
  const parts = h.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  if (!parts.length) return { name:'home' };
  const [name, id, sub] = parts;
  if (['play','practice','edit'].includes(name) && id) return { name, id, sub };
  if (name === 'quiz') return { name:'quiz' };
  return { name:'home' };
}
function route(){
  document.querySelectorAll('.menu').forEach(n => n.remove());
  document.querySelectorAll('.toast:not([data-keep])').forEach(n => n.remove());
  closeAllSheets();
  window.scrollTo(0, 0);
  renderScreen();
}
function renderScreen(){
  if (App.ctl && App.ctl.destroy) App.ctl.destroy();
  App.ctl = null;
  const r = parseRoute();
  const root = clear(document.getElementById('app'));
  if (r.name === 'shared') return openShared(r.code);
  if (r.name !== 'home' && r.name !== 'quiz'){
    const play = findPlay(r.id);
    if (!play){ toast('That play no longer exists.'); return go('/'); }
    if (r.name === 'edit' && isBuiltin(play.id)) return go('/play/' + encodeURIComponent(play.id));
    App.ctl = r.name === 'play' ? screenPlay(root, play)
            : r.name === 'practice' ? screenPractice(root, play, r.sub === 'pg' ? 'pg' : 'all')
            : screenEdit(root, play);
    return;
  }
  App.ctl = r.name === 'quiz' ? screenQuiz(root) : screenHome(root);
}

/* ============================================================== WORKSPACE */
/* Court on the left, one panel on the right, a grip between them that you can
   drag. Used by Watch, Practice and Edit alike. */
function workspace(root, opts){
  opts = opts || {};
  const w = el('div', { class:'work' + (opts.split === false ? ' nosplit' : '') });
  const stagecol = el('div', { class:'stagecol' });
  const stage = el('div', { class:'stage' });
  const court = svg('svg', { class:'court', role:'img', 'aria-label':'Basketball half court' });
  stage.appendChild(court);
  const under = el('div', { class:'under' });
  stagecol.appendChild(stage);
  stagecol.appendChild(under);
  const grip = el('div', { class:'grip', role:'separator', 'aria-orientation':'vertical',
    'aria-label':'Resize the side panel', title:'Drag to resize · double-click to reset' });
  const side = el('aside', { class:'side' });
  w.appendChild(stagecol);
  if (opts.split !== false){ w.appendChild(grip); w.appendChild(side); }
  root.appendChild(w);

  let drag = null;
  grip.addEventListener('pointerdown', e => {
    drag = { x:e.clientX, w:side.getBoundingClientRect().width };
    grip.classList.add('drag');
    try{ grip.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  grip.addEventListener('pointermove', e => {
    if (!drag) return;
    App.settings.side = clampN(Math.round(drag.w - (e.clientX - drag.x)), SIDE_MIN, sideCap());
    applySideWidth();
  });
  const stop = e => { if (!drag) return; drag = null; grip.classList.remove('drag');
    try{ grip.releasePointerCapture(e.pointerId); }catch(err){} saveSettings(); };
  grip.addEventListener('pointerup', stop);
  grip.addEventListener('pointercancel', stop);
  grip.addEventListener('dblclick', () => { App.settings.side = SIDE_DEFAULT; applySideWidth(); saveSettings(); });

  const R = makeCourt(court, App.settings.render === 'tilt' ? 'tilt' : 'flat');
  let redraw = null;
  let ro = null, rt = 0, last = [0, 0];
  if (typeof ResizeObserver === 'function'){
    ro = new ResizeObserver(entries => {
      const r = entries[0].contentRect;
      if (Math.abs(r.width-last[0]) < 2 && Math.abs(r.height-last[1]) < 2) return;
      last = [r.width, r.height];
      clearTimeout(rt);
      rt = setTimeout(() => { if (R.kind === 'tilt') R.remount(); if (redraw) redraw(); }, 120);
    });
    ro.observe(stage);
  }
  return { stage, court, under, side, R,
    set onRedraw(fn){ redraw = fn; },
    destroy(){ if (ro) ro.disconnect(); clearTimeout(rt); R.destroy(); } };
}
